kind": "chapter", "num": 7, "title": "Alchemy", "dateline": "Egypt, the Islamic world, and Europe, from about AD 100 to 1700", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> From roughly AD 100; at its height in Europe from 1300 to 1700.<br/>\n<strong>Where:<\/strong> Roman Egypt, then Baghdad and the Islamic world, then Latin Europe.<br/>\n<strong>Key people:<\/strong> Maria the Jewess, Zosimos, Jabir ibn Hayyan, al-Razi, Paracelsus, Robert Boyle, Isaac Newton.<br/>\n<strong>Key texts:<\/strong> <em>The Emerald Tablet<\/em>; George Ripley’s <em>Compound of Alchemy<\/em> (1471); Newton’s private notebooks.<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-6\">\n<h2>The short version<\/h2>\n<p class=\"lede\">The art of transforming matter: turning ordinary metals into gold, making medicines, and finding the Philosopher’s Stone. For most of its history, it was hands-on work with furnaces, flasks, and real chemicals. The idea that alchemy was “really” a coded spiritual practice is mostly a reading from the 1800s and 1900s.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-6\">\n<h2>Where it really comes from<\/h2>\n<p>Alchemy grew in three main phases.<\/p>\n<p><strong>Greco-Egyptian (about AD 100 to 400).<\/strong> It came out of the workshops of Roman Egypt, where metalworkers and dyers knew how to make cheap metals look like gold and silver. Early texts circulated under the name of the philosopher Democritus. <strong>Maria the Jewess<\/strong>, known through later quotations, is credited with laboratory equipment still named for her: the double boiler is a <em>bain-marie<\/em> in French, “Mary’s bath.” <strong>Zosimos of Panopolis<\/strong> (around 300) is the first alchemist whose own writings survive in any amount. He mixed lab procedures with religious visions.<\/p>\n<p><strong>Arabic (8th to 12th centuries).<\/strong> Writers in the Islamic world turned alchemy into a systematic science. A huge body of work was credited to <strong>Jabir ibn Hayyan<\/strong>, though much of it was probably written by a later circle using his name. The physician <strong>al-Razi<\/strong> (c. 865 to 925) carefully classified substances and equipment. Not everyone believed: the great philosopher Ibn Sina (Avicenna) doubted that metals could truly be changed into one another. The word itself is Arabic, <em>al-kīmiyā<\/em>, and so are “alcohol,” “alkali,” and “elixir.” The Emerald Tablet (chapter 3) first appears in this period.<\/p>\n<p><strong>Latin Europe (1144 onward).<\/strong> Robert of Chester made the first Latin translation of an Arabic alchemy book in 1144. Alchemy then spread across Europe. It was respectable enough that kings funded it and dangerous enough that rulers banned it: Pope John XXII condemned fraudulent alchemists in 1317, and England outlawed “multiplying” gold and silver in 1404, for fear of fake coinage. <strong>Paracelsus<\/strong> (1493 to 1541), a brawling Swiss physician, turned alchemy toward making medicines. The court of Emperor Rudolf II in Prague became a magnet for alchemists around 1600. <strong>Isaac Newton<\/strong> wrote over a million words on alchemy in private notebooks he never published.<\/p>\n<p>Until about 1700, alchemy and chemistry were the same field. <strong>Robert Boyle<\/strong>, often called a founder of modern chemistry, believed in transmutation and sought the Stone. The historians Lawrence Principe and William Newman use the old spelling “chymistry” for the combined field to make this point. It was the new chemistry of Antoine Lavoisier, in the late 1700s, that finally separated the two.<\/p>\n<p>Alchemy also grew independently in China and India, with their own long traditions of elixirs and inner practices. This chapter follows the Western line.<\/p>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-6\">\n<h2>The big ideas<\/h2>\n<p><strong>Matter can be changed.<\/strong> All metals were thought to be mixtures of the same basic principles in different proportions, so in principle lead could be refined into gold.<\/p>\n<p><strong>Sulfur, mercury, and salt.<\/strong> The Arabic theory used two principles: sulfur (the fiery, active part) and mercury (the fluid, receptive part). Paracelsus added salt (the fixed, solid part). These weren’t the substances we call by those names today, but ideas about the qualities of matter.<\/p>\n<p><strong>The stages of the Work.<\/strong> The process ran through color stages: <em>nigredo<\/em> (blackening, breaking down), <em>albedo<\/em> (whitening, purifying), sometimes <em>citrinitas<\/em> (yellowing), and <em>rubedo<\/em> (reddening, completion). Writers like George Ripley (1471) listed twelve operations, among them calcination (heating to ash), dissolution, and distillation.<\/p>\n<p><strong>Solve et coagula.<\/strong> “Dissolve and coagulate”: break a thing down, then let it come together again in a new, purer form.<\/p>\n<p><strong>The Stone and the Elixir.<\/strong> The goal: a substance that would perfect metals and, for many, heal the body and lengthen life.<\/p>\n<p><strong>The psychological reading.<\/strong> In 1850, Mary Anne Atwood argued that alchemy had always been a hidden spiritual practice. The American general Ethan Allen Hitchcock said much the same in 1857. Carl Jung took the idea much further in <em>Psychology and Alchemy<\/em> (1944). He saw the stages as pictures of a person’s inner growth: the breakdown of the old self, the joining of opposites, and a final wholeness he called <em>individuation<\/em>. Many readers find Jung’s reading useful as psychology. As history, it reads modern ideas back into people who were, for the most part, doing chemistry.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-6\">\n<h2>What to watch for<\/h2>\n<p><strong>“Alchemy was never about gold.”<\/strong> That’s a myth in the other direction. Some alchemists did use spiritual language, and a few were mainly spiritual. But most were trying to make real substances in real furnaces, and the records of their experiments survive.<\/p>\n<p><strong>Fraud is part of the story.<\/strong> Alchemy had con artists from the start: crucibles with hidden gold, coins dipped to look silver, nails half-replaced with gold to show a “transmutation.” Medieval writers warned against “puffers” who wasted patrons’ money. The lesson carries over well: when the payoff is always one more experiment away, watch your purse.<\/p>\n<p><strong>Nicolas Flamel.<\/strong> A real Parisian scribe who died in 1418. The legend that he found the Stone and became immortal was attached to him two centuries after his death.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-6\">\n<h2>Where it went next<\/h2>\n<p>Alchemy gave chemistry its equipment and much of its vocabulary. Its symbols fed the Rosicrucian manifestos (chapter 10), and its language of refining a rough substance shaped Masonic imagery (chapter 11). The Golden Dawn treated it as spiritual, and Jung made it psychological, which is how most people meet it today. And in a strange twist, modern physics achieved transmutation: in 1980, researchers at Berkeley turned tiny amounts of bismuth into gold in a particle accelerator, at a cost far above the value of the gold.<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-6\">\n<h2>Read it free<\/h2>\n<ul>\n<li>The Alchemy Web Site (<a href=\"https://levity.com/alchemy\" rel=\"noopener\" target=\"_blank\">levity.com/alchemy<\/a>): hundreds of public-domain alchemical texts, including Ripley.<\/li>\n<li><em>The Chymistry of Isaac Newton<\/em> (<a href=\"https://webapp1.dlib.indiana.edu/newton\" rel=\"noopener\" target=\"_blank\">webapp1.dlib.indiana.edu/newton<\/a>): Newton’s own alchemical manuscripts, transcribed and free.<\/li>\n<li>Esoterica (free on YouTube) has many episodes on alchemy, from its Egyptian origins to Newton.<\/li>\n<li>Jung’s <em>Psychology and Alchemy<\/em> isn’t free online, but most public libraries carry it.<\/li>\n<\/ul>\n<\/section>"}, {"id": "kabbalah", "kind": "chapter", "num": 8, "title": "Kabbalah", "dateline": "Provence, Spain, and the Galilee, from the 12th century", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> First texts in the 1100s; the Zohar in the 1280s; Isaac Luria in 1569 to 1572; living tradition today.<br/>\n<strong>Where:<\/strong> Provence, Spain, then Safed in the Galilee, then Eastern Europe.<br/>\n<strong>Key people:<\/strong> Moses de León, Abraham Abulafia, Moses Cordovero, Isaac Luria, the Baal Shem Tov.<br/>\n<strong>Key texts:<\/strong> <em>Sefer Yetzirah<\/em>, the <em>Bahir<\/em>, the <em>Zohar<\/em>, the writings of Hayyim Vital.<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-7\">\n<h2>The short version<\/h2>\n<p class=\"lede\">The mystical tradition within Judaism. It maps how the hidden, infinite God expresses itself through ten qualities, and how human actions affect the life of God and the world. It’s a living religious tradition, practiced today. It is different from the Christian and occult versions that borrowed from it, which are usually spelled “Cabala” or “Qabalah.”<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-7\">\n<h2>Where it really comes from<\/h2>\n<p>“Kabbalah” means “received,” as in tradition handed down. Its legend traces it back to Moses at Sinai, or even to Adam. The documented history runs like this:<\/p>\n<ul>\n<li><strong>Early Jewish mysticism<\/strong> (roughly AD 200 to 700). <em>Merkavah<\/em> (“chariot”) mystics described journeys through heavenly palaces toward God’s throne, inspired by Ezekiel’s vision. <em>Sefer Yetzirah<\/em>, the “Book of Formation,” a short and difficult text of uncertain date, describes creation through ten numbers (the <em>sefirot<\/em>) and the 22 letters of the Hebrew alphabet.<\/li>\n<li><strong>Provence and Spain<\/strong> (1100s and 1200s). The <em>Bahir<\/em> (Provence, around 1180) is the first text to treat the sefirot as qualities of God. Circles of teachers formed in Provence and in the Spanish town of Girona. <strong>Abraham Abulafia<\/strong> (1240 to about 1291) developed an “ecstatic” Kabbalah of meditating on combinations of Hebrew letters.<\/li>\n<li><strong>The Zohar<\/strong> (Castile, 1280s). The central work: a huge mystical commentary on the Torah, written in Aramaic and presented as the teaching of a 2nd-century rabbi, Shimon bar Yochai. The scholar Gershom Scholem argued it was largely written by <strong>Moses de León<\/strong>. Most scholars agree it’s medieval, though some now see it as the work of a circle rather than one man.<\/li>\n<li><strong>Safed<\/strong> (1500s). After the Jews were expelled from Spain in 1492, Kabbalah’s center moved to Safed, a hill town in the Galilee. <strong>Moses Cordovero<\/strong> organized the earlier teaching into a system. <strong>Isaac Luria<\/strong> taught there for only about two years before he died in 1572, at 38. He wrote almost nothing; his student Hayyim Vital recorded the teaching.<\/li>\n<li><strong>Later history.<\/strong> In 1665, a Kabbalist named Sabbatai Zevi declared himself the Messiah and won followers across the Jewish world. A year later, threatened with death by the Ottoman sultan, he converted to Islam. The disaster made many rabbis wary of Kabbalah for generations. In the 1700s, the Hasidic movement, begun by the Baal Shem Tov, brought Kabbalistic ideas into everyday devotion. Chabad, one Hasidic branch, still teaches them widely.<\/li>\n<\/ul>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-7\">\n<h2>The big ideas<\/h2>\n<p><strong>Ein Sof.<\/strong> God as infinite and unknowable: “without end.”<\/p>\n<p><strong>The ten sefirot.<\/strong> The ways the hidden God becomes knowable, drawn as the Tree of Life in three columns. The right side includes <em>Chesed<\/em> (lovingkindness). The left side includes <em>Gevurah<\/em> (strength, judgment). The center column includes <em>Tiferet<\/em> (beauty, harmony). Seven more complete the tree, from <em>Keter<\/em> (crown) at the top down to <em>Malkhut<\/em> (kingship), the divine presence in the world.<\/p>\n<p><strong>Luria’s three-step story.<\/strong> First, <em>tzimtzum<\/em>: the Infinite withdraws into itself to make room for a world. Second, <em>shevirat ha-kelim<\/em>, the shattering of the vessels: the containers meant to hold the divine light break, scattering sparks of holiness into the material world. Third, <em>tikkun<\/em>: repair. Every good deed and every commandment kept lifts a spark back to its source.<\/p>\n<p><strong>Human action matters to God.<\/strong> In the Zohar and in Luria, people aren’t spectators. Their deeds help heal a broken divine order. The modern phrase <em>tikkun olam<\/em>, “repairing the world,” used for social justice work, comes from this idea.<\/p>\n<p><strong>Hidden meanings in the text.<\/strong> Kabbalists read the Torah on several levels at once, down to the shapes and number-values of its letters.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-7\">\n<h2>What to watch for<\/h2>\n<p><strong>Borrowed versions aren’t the same tradition.<\/strong> In 1486, the Italian scholar Pico della Mirandola claimed that Kabbalah proved the truth of Christianity, and a Christian “Cabala” was born. Occultists later reworked it again into “Qabalah” (chapter 13). These are reinterpretations, often by people who couldn’t read Hebrew. They’re interesting in their own right, but they don’t tell you what Jewish Kabbalists believe.<\/p>\n<p><strong>Kabbalah for sale.<\/strong> Celebrity Kabbalah centers selling red strings, holy water, and courses have been widely criticized by rabbis and Jewish scholars.<\/p>\n<p><strong>Respect for a living faith.<\/strong> Traditionally, the study was reserved for married men over forty, already grounded in Torah and Talmud. That rule is debated today, and many teachers have relaxed it. But it’s a reminder that this is someone’s living religion, not a set of free-floating symbols.<\/p>\n<p><strong>Messiahs and certainty.<\/strong> The Sabbatai Zevi episode is a hard lesson: a mystical system that promises the end of history can carry whole communities away when a charismatic figure claims to fulfill it.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-7\">\n<h2>Where it went next<\/h2>\n<p>Christian Cabala passed through scholars like Johannes Reuchlin (1517) and Christian Knorr von Rosenroth, whose Latin anthology <em>Kabbala Denudata<\/em> (1677 to 1684) became the main source for non-Jewish readers. Part of it was translated into English in 1887 by S. L. MacGregor Mathers, who the next year co-founded the Golden Dawn (chapter 13). The Tree of Life became the backbone of the Golden Dawn’s grades, of occult tarot (chapter 9), and of much modern esotericism. Within Judaism, the 20th-century scholarship of Gershom Scholem turned Kabbalah into a major academic field.<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-7\">\n<h2>Read it free<\/h2>\n<ul>\n<li><a href=\"https://www.sefaria.org\" rel=\"noopener\" target=\"_blank\">Sefaria.org<\/a>: the Zohar and <em>Sefer Yetzirah<\/em> in Hebrew and English, free.<\/li>\n<li><a href=\"https://www.chabad.org\" rel=\"noopener\" target=\"_blank\">Chabad.org<\/a>: hundreds of free articles, from inside the tradition, on tzimtzum, the shattering, and tikkun.<\/li>\n<li>S. L. MacGregor Mathers, <em>The Kabbalah Unveiled<\/em> (1887): <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>. Useful for seeing how occultists received it.<\/li>\n<li>Esoterica (free on YouTube): its host reads Hebrew and Aramaic and has many episodes on the history of Kabbalah.<\/li>\n<\/ul>\n<\/section>"}, {"id": "tarot", "kind": "chapter", "num": 9, "title": "Tarot", "dateline": "Northern Italy, 1440s; reinvented in Paris, 1781", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> Cards first made in the 1440s; turned to fortune-telling and occultism from 1781.<br/>\n<strong>Where:<\/strong> Milan, Ferrara, and Florence; later Paris and London.<br/>\n<strong>Key people:<\/strong> Antoine Court de Gébelin, Etteilla, Éliphas Lévi, A. E. Waite, Pamela Colman Smith, Aleister Crowley.<br/>\n<strong>Key texts:<\/strong> Court de Gébelin, <em>Le Monde primitif<\/em>, volume 8 (1781); Waite, <em>The Pictorial Key to the Tarot<\/em> (1910).<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-8\">\n<h2>The short version<\/h2>\n<p class=\"lede\">A deck of 78 cards: four suits much like ordinary playing cards, plus 22 picture cards called “trumps” or the “major arcana.” Tarot was invented in 15th-century Italy for a card game, which is still played in parts of Europe. About 340 years later, a French scholar declared it a sacred book of ancient Egypt, and it has been a tool of fortune-telling and self-reflection ever since.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-8\">\n<h2>Where it really comes from<\/h2>\n<p>Playing cards reached Europe from the Islamic world in the late 1300s. In the 1440s, at the courts of northern Italy, someone added a fifth suit of picture cards that beat all the others: the <em>trionfi<\/em>, or “triumphs,” from which we get the word “trump.” By the early 1500s these decks were called <em>tarocchi<\/em>. The oldest surviving examples are luxurious hand-painted decks made for the ruling Visconti and Sforza families of Milan in the mid-1400s.<\/p>\n<p>The pictures came from everyday Renaissance imagery: the virtues (Justice, Strength, Temperance), the planets (Sun, Moon, Star), figures from street processions and morality plays (the Emperor, the Pope, Death, the Wheel of Fortune), and the Last Judgment. For more than three centuries, people simply played a trick-taking game with them, a bit like bridge. The British philosopher Michael Dummett, who wrote the standard history of the game, showed there is no evidence that anyone used tarot for divination before the 1700s.<\/p>\n<p>Then came 1781. Antoine Court de Gébelin, a French Protestant minister and Freemason, was writing a vast book about a lost primeval civilization. In its eighth volume, he announced that the tarot trumps were the surviving pages of the <em>Book of Thoth<\/em>, the secret wisdom of ancient Egyptian priests, hidden in plain sight as a game. In the same volume, an essay by the Comte de Mellet linked the 22 trumps to the 22 letters of the Hebrew alphabet. Neither man offered evidence. At the time, no one in Europe could read Egyptian hieroglyphs; they were deciphered in 1822, and nothing about tarot was found.<\/p>\n<p>The idea caught on anyway. A Parisian fortune-teller who called himself <strong>Etteilla<\/strong> (his real name, Alliette, spelled backward) published a deck designed for divination in 1789. In the 1850s, the French occultist <strong>Éliphas Lévi<\/strong> worked the Hebrew-letter link into a full system of magic. The Golden Dawn (chapter 13) then fitted each trump onto a path of the Kabbalistic Tree of Life.<\/p>\n<p>In 1909, A. E. Waite, a former Golden Dawn member, published a new deck drawn by the artist <strong>Pamela Colman Smith<\/strong>. Smith gave every card, including the numbered suit cards, a full illustrated scene, which made the deck far easier to read intuitively. She seems to have been inspired by photographs of the Sola Busca deck, a rare Italian deck from about 1490, which the British Museum had received in 1907. The “Rider-Waite-Smith” deck (Rider was the publisher) became the model for most tarot decks since. Aleister Crowley’s <em>Thoth<\/em> deck, painted by Lady Frieda Harris between 1938 and 1943, is the other major modern line.<\/p>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-8\">\n<h2>The big ideas<\/h2>\n<p><strong>The major arcana as a journey.<\/strong> Occult readers see the 22 trumps, from the Fool to the World, as stages of a soul’s path. This “Fool’s journey” is a modern reading, but a popular and evocative one.<\/p>\n<p><strong>Correspondences.<\/strong> Each card is tied to a Hebrew letter, a planet or zodiac sign, an element, and a path on the Tree of Life. The four suits match the four classical elements: wands to fire, cups to water, swords to air, and pentacles (or coins) to earth.<\/p>\n<p><strong>Reading the cards.<\/strong> Cards are laid out in a pattern, a “spread,” with each position standing for something: the past, an obstacle, a likely outcome. The reader interprets the combination.<\/p>\n<p><strong>Tarot as a mirror.<\/strong> Many modern users don’t claim the cards predict anything. They use them as prompts for reflection, a structured way of looking at a situation from angles they hadn’t considered. Some therapists and writers use them this way too.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-8\">\n<h2>What to watch for<\/h2>\n<p><strong>The Egyptian origin.<\/strong> It’s the most repeated myth in this guide. There is no evidence linking tarot to Egypt, and solid evidence of its Italian origins as a game.<\/p>\n<p><strong>Prediction claims.<\/strong> There’s no good evidence that tarot predicts events. Readings can feel uncannily accurate because of a well-studied effect: general statements feel personal when we apply them to ourselves (psychologists call it the Barnum or Forer effect), and we remember the hits and forget the misses. That doesn’t make reflective use worthless. It does mean caution with anyone selling predictions.<\/p>\n<p><strong>Paid readings and dependence.<\/strong> Tarot reading is a business. Be wary of readers who say a curse or dark future can be lifted with more sessions or a payment, or who encourage you to consult them before every decision.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-8\">\n<h2>Where it went next<\/h2>\n<p>Tarot is now one of the most visible parts of the occult revival, with thousands of decks in print. Most follow the Rider-Waite-Smith imagery. Psychologists in the Jungian tradition have read the trumps as archetypes, recurring figures of the human imagination. And in France and parts of central Europe, people still play the old card game, often with no idea of the occult history attached to it.<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-8\">\n<h2>Read it free<\/h2>\n<ul>\n<li>A. E. Waite, <em>The Pictorial Key to the Tarot<\/em> (1910), with Smith’s images: <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a> and <a href=\"https://www.gutenberg.org\" rel=\"noopener\" target=\"_blank\">Project Gutenberg<\/a>. The original 1909 deck is in the public domain in the United States.<\/li>\n<li>The Morgan Library &amp; Museum has a free online exhibition on early Italian tarot (<a href=\"https://themorgan.org\" rel=\"noopener\" target=\"_blank\">themorgan.org<\/a>).<\/li>\n<li>Michael Dummett’s histories aren’t free, but libraries can often get <em>The Game of Tarot<\/em> (1980) by interlibrary loan.<\/li>\n<\/ul>\n<\/section>"}, {"id": "the-rosicrucians", "kind": "chapter", "num": 10, "title": "The Rosicrucians", "dateline": "Germany, 1614 to 1616", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> Three manifestos, 1614 to 1616; many later groups using the name.<br/>\n<strong>Where:<\/strong> Kassel and Strasbourg; the “Rosicrucian furor” spread across Europe.<br/>\n<strong>Key people:<\/strong> The legendary Christian Rosenkreutz; Johann Valentin Andreae; defenders Michael Maier and Robert Fludd.<br/>\n<strong>Key texts:<\/strong> <em>Fama Fraternitatis<\/em> (1614), <em>Confessio Fraternitatis<\/em> (1615), <em>The Chymical Wedding of Christian Rosenkreutz<\/em> (1616).<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-9\">\n<h2>The short version<\/h2>\n<p class=\"lede\">In 1614, a pamphlet appeared in Germany announcing a secret brotherhood of wise men, founded centuries earlier by a German nobleman named Christian Rosenkreutz, who had learned hidden wisdom in the East. The brotherhood, it said, was ready to reveal itself and reform all of knowledge. Readers across Europe tried to contact it. As far as anyone can tell, it never existed. But the idea of it shaped Freemasonry, occultism, and even early science.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-9\">\n<h2>Where it really comes from<\/h2>\n<p>The first manifesto, the <em>Fama Fraternitatis<\/em> (“The Fame of the Brotherhood”), was printed in Kassel in 1614, though it had circulated in handwritten copies for a few years before. It tells the story of “Brother C.R.C.,” who travels to Damascus, Arabia, and Fez in North Africa, learns their wisdom, and returns to Germany to found a small brotherhood of the Rose Cross. Members heal the sick for free, wear the clothes of whatever country they live in, and meet once a year. When the founder dies, his tomb is hidden. About 120 years later, members rediscover the vault, perfectly preserved and lit by an inner sun, with his uncorrupted body inside.<\/p>\n<p>The second manifesto, the <em>Confessio<\/em> (1615), added dates: Rosenkreutz was born in 1378 and lived 106 years. The third, <em>The Chymical Wedding of Christian Rosenkreutz<\/em> (Strasbourg, 1616), was something different: a strange, dreamlike story told over seven days, in which an aged Rosenkreutz is invited to a royal wedding that turns into an alchemical death and rebirth.<\/p>\n<p>Historians trace the manifestos to a circle of young Lutheran thinkers at the University of Tübingen. <strong>Johann Valentin Andreae<\/strong> (1586 to 1654), a theologian, later admitted writing the <em>Chymical Wedding<\/em> as a young man. In his autobiography he called it a <em>ludibrium<\/em>, a word meaning a joke, a play, or a piece of theater. Scholars still debate whether the whole affair was a satire, an allegory, a recruiting tool for a real reform movement, or some mix.<\/p>\n<p>Whatever was intended, the effect was a sensation. Hundreds of books and pamphlets appeared, some begging the brotherhood to accept the writer, others denouncing it. The English physician <strong>Robert Fludd<\/strong> and the German alchemist <strong>Michael Maier<\/strong> wrote defenses. In 1623, posters appeared in Paris claiming that the invisible brothers were in the city. No one ever came forward as a member, which only made the legend stronger.<\/p>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-9\">\n<h2>The big ideas<\/h2>\n<p><strong>A universal reformation.<\/strong> The manifestos called for a renewal of all learning, medicine, and religion, uniting the wisdom of nature with Christian faith. They were also fiercely Protestant and anti-papal.<\/p>\n<p><strong>The Book of Nature.<\/strong> God reveals himself through creation as well as scripture, and careful study of nature is a form of worship.<\/p>\n<p><strong>Hidden helpers.<\/strong> Wise and holy people work quietly among us, healing and teaching, without seeking credit.<\/p>\n<p><strong>The rose and the cross.<\/strong> The emblem joins the cross of Christ with the rose, a symbol of beauty, secrecy, and the soul unfolding.<\/p>\n<p><strong>Alchemy as an inner wedding.<\/strong> <em>The Chymical Wedding<\/em> treats the alchemical process (chapter 7) as a story of death and rebirth, the joining of opposites. It’s an early example of reading alchemy spiritually.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-9\">\n<h2>What to watch for<\/h2>\n<p><strong>“An unbroken line since the 1400s.”<\/strong> Many modern groups use the Rosicrucian name, and some claim direct descent from Rosenkreutz or from even older Egyptian mysteries. No evidence connects any of them to a real 15th-century brotherhood, and most historians doubt that one existed at all.<\/p>\n<p><strong>The invisible authority.<\/strong> The manifestos created a powerful pattern: a perfect, hidden group that knows the truth, can’t be found, and will contact you if you’re worthy. That structure is very effective at drawing people in, and it’s very hard to test. Be wary of any group whose real leaders are always offstage.<\/p>\n<p><strong>Mail-order mysteries.<\/strong> Several 20th-century Rosicrucian organizations were built as correspondence courses, with lessons released in stages for a fee. Paying to move up through hidden levels is a pattern this guide flags in several chapters.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-9\">\n<h2>Where it went next<\/h2>\n<p>The ideal of a brotherhood of learned men reforming knowledge helped inspire the scientific societies of the 1600s. Rosicrucian imagery passed into Freemasonry (chapter 11), where the 18th degree of the Scottish Rite is called “Knight of the Rose Croix.” In the 1700s a German order, the Golden and Rosy Cross, gave the name a real organization. In 1866, English Freemasons founded the Societas Rosicruciana in Anglia, whose members included the founders of the Golden Dawn (chapter 13); the Golden Dawn’s inner order was named for the Rose Cross. In the 20th century, American groups like the Rosicrucian Fellowship (1909) and AMORC (1915), the largest today, spread the name worldwide.<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-9\">\n<h2>Read it free<\/h2>\n<ul>\n<li>A. E. Waite, <em>The Real History of the Rosicrucians<\/em> (1887): includes English translations of the <em>Fama<\/em> and <em>Confessio<\/em>. <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>.<\/li>\n<li><em>The Chymical Wedding of Christian Rosenkreutz<\/em> (Ezekiel Foxcroft’s 1690 English translation): <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>.<\/li>\n<li>Frances Yates, <em>The Rosicrucian Enlightenment<\/em> (1972), isn’t free, but it’s widely available in libraries. Read it as a bold argument, not the final word.<\/li>\n<\/ul>\n<\/section>"}, {"id": "freemasonry", "kind": "chapter", "num": 11, "title": "Freemasonry", "dateline": "Britain, from the 1300s; London, 1717", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> Working masons’ lodges from the 1300s; the first Grand Lodge in 1717 (traditional date).<br/>\n<strong>Where:<\/strong> Scotland and England, then worldwide.<br/>\n<strong>Key people:<\/strong> Elias Ashmole, James Anderson, Prince Hall, Albert Mackey.<br/>\n<strong>Key texts:<\/strong> The Regius Poem (c. 1390), Anderson’s <em>Constitutions<\/em> (1723), <em>Duncan’s Masonic Ritual and Monitor<\/em> (1866).<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-10\">\n<h2>The short version<\/h2>\n<p class=\"lede\">A fraternal society that teaches morality through the tools and legends of stonemasons. Each member is pictured as a rough stone being shaped into a true one. It is less a secret religion than a lodge with ritual, charity, fellowship, and a great deal of symbolism. It’s also the most influential secret society in modern history, and the target of more conspiracy theories than any other.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-10\">\n<h2>Where it really comes from<\/h2>\n<p>The legend runs back to the builders of King Solomon’s Temple, and sometimes further, to Pythagoras or Egypt. The record runs back to the working masons of medieval Britain:<\/p>\n<ul>\n<li><strong>Operative masonry (1300s to 1600s).<\/strong> Real stonemasons had lodges, rules, and legends about their craft. The Regius Poem (around 1390) is the oldest known text of their “Old Charges,” which mix craft rules with a legendary history of geometry. The Schaw Statutes (Scotland, 1598 and 1599) are the earliest records of organized lodges.<\/li>\n<li><strong>Accepted masons (1600s).<\/strong> Gentlemen who weren’t builders began joining lodges. The antiquarian Elias Ashmole recorded his own admission in 1646.<\/li>\n<li><strong>Speculative masonry (1700s onward).<\/strong> Four London lodges formed the first Grand Lodge, traditionally dated to 1717; some historians now place it a few years later. James Anderson’s <em>Constitutions<\/em> (1723) set the template. A rival “Antients” Grand Lodge formed in 1751, and the two merged in 1813 as the United Grand Lodge of England.<\/li>\n<\/ul>\n<p>Freemasonry spread fast across Europe and the American colonies. George Washington and Benjamin Franklin were members. On March 6, 1775, <strong>Prince Hall<\/strong> and fourteen other free Black men in Boston were initiated by a lodge attached to a British army regiment. Barred from the white American lodges, they received their own charter from England in 1784 as African Lodge No. 459. Prince Hall Freemasonry remains a major tradition today.<\/p>\n<p>Freemasonry has also drawn intense opposition. The Catholic Church first condemned it in 1738 and still forbids Catholics to join. In 1826, a New York man named William Morgan, who planned to publish the rituals, disappeared, and Masons were blamed. The outcry produced the Anti-Masonic Party, the first third party in American politics. Totalitarian regimes, including Nazi Germany, banned and persecuted Masons.<\/p>\n<p>In the United States, membership peaked at about 4.1 million in 1959 and had fallen to about 870,000 by 2023, according to the Masonic Service Association.<\/p>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-10\">\n<h2>The big ideas<\/h2>\n<p><strong>Three degrees.<\/strong> Entered Apprentice, Fellowcraft, and Master Mason. Each is a ritual drama that teaches through symbols.<\/p>\n<p><strong>The working tools.<\/strong> Each degree gives moral meanings to builders’ tools. The 24-inch gauge divides the day into parts for work, rest, and service. The common gavel knocks the rough corners off. The square tests conduct; the level stands for equality; the plumb for uprightness. The trowel spreads “the cement of brotherly love.”<\/p>\n<p><strong>The rough and perfect ashlar.<\/strong> An <em>ashlar<\/em> is a squared building stone. The rough one is a person as they are; the perfect one is a person shaped by work.<\/p>\n<p><strong>Hiram Abiff.<\/strong> The Master Mason degree acts out the murder of the Temple’s master builder, who dies rather than give up the secret word. Hiram is a ritual character, and the story is a teaching drama about faithfulness and death, not history.<\/p>\n<p><strong>The Great Architect of the Universe.<\/strong> Most lodges require members to believe in a Supreme Being, but the lodge doesn’t define it. Religion and politics are traditionally kept out of lodge discussion. (The Grand Orient of France dropped the belief requirement in 1877, which caused a lasting split with English-style Masonry.)<\/p>\n<p><strong>Brotherly love, relief, and truth.<\/strong> The stated purposes. Much of a lodge’s actual life is charity and fellowship. The Shriners, a Masonic group, run a network of children’s hospitals founded in 1922.<\/p>\n<p><strong>Further degrees.<\/strong> Systems like the Scottish Rite (up to the 33rd degree) and the York Rite add degrees after Master Mason. Masonic writers often point out that none is “higher” than the third degree in the main lodge; the others expand on it.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-10\">\n<h2>What to watch for<\/h2>\n<p><strong>The conspiracy myth.<\/strong> The idea that Masons secretly run the world has been around since the 1790s. Many famous fake quotes still passed around online trace back to the Taxil hoax, a series of invented exposés by the French writer Léo Taxil, who publicly confessed in 1897 that he had made it all up.<\/p>\n<p><strong>The ancient-secrets myth.<\/strong> The “secrets” of Freemasonry are mostly recognition signs and ritual wording, and those were published long ago, in exposés and in <em>Duncan’s Ritual<\/em> (1866). The lodge has no hidden ancient knowledge, and many Masons say so plainly.<\/p>\n<p><strong>The ladder structure.<\/strong> Freemasonry has the shape this guide flags in several chapters: the real meaning always seems to be one degree further in. Many Masons will tell you the value is in the fellowship, the service, and the ritual experience itself, not in a final secret. That’s a healthy way to hold it.<\/p>\n<p><strong>Who can join.<\/strong> Mainstream lodges admit only men. Separate bodies admit women, such as the Order of the Eastern Star, and “co-Masonic” orders like Le Droit Humain (founded in France in 1893) admit men and women together.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-10\">\n<h2>Where it went next<\/h2>\n<p>Freemasonry’s grades, rituals, oaths, and symbols became the template for nearly every later secret society, from the Golden Dawn (chapter 13) to college fraternities and fraternal clubs. Its rituals carried Hermetic, Kabbalistic, Rosicrucian, and alchemical images to thousands of ordinary men who might never have read those traditions directly. All three founders of the Golden Dawn were Freemasons, which is why its ceremonies feel familiar to anyone who has seen a lodge.<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-10\">\n<h2>Read it free<\/h2>\n<ul>\n<li><em>Duncan’s Masonic Ritual and Monitor<\/em> (1866) and Albert Mackey’s <em>Encyclopedia of Freemasonry<\/em> (1873): <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a> and <a href=\"https://www.gutenberg.org\" rel=\"noopener\" target=\"_blank\">Project Gutenberg<\/a>.<\/li>\n<li>Anderson’s <em>Constitutions<\/em> (1723): free online at several Masonic history sites, including <a href=\"https://phoenixmasonry.org\" rel=\"noopener\" target=\"_blank\">phoenixmasonry.org<\/a>.<\/li>\n<li>Grand Lodge websites explain membership and charity from the inside, and many local lodges hold open houses.<\/li>\n<\/ul>\n<\/section>"}, {"id": "theosophy", "kind": "chapter", "num": 12, "title": "Theosophy", "dateline": "New York and India, from 1875", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> Founded 1875; most influential from the 1880s to the 1930s.<br/>\n<strong>Where:<\/strong> New York, then Adyar (near Chennai), India, and London.<br/>\n<strong>Key people:<\/strong> Helena Petrovna Blavatsky, Henry Steel Olcott, William Quan Judge, Annie Besant, Charles Leadbeater, Jiddu Krishnamurti, Rudolf Steiner.<br/>\n<strong>Key texts:<\/strong> Blavatsky, <em>Isis Unveiled<\/em> (1877), <em>The Secret Doctrine<\/em> (1888), <em>The Key to Theosophy<\/em> (1889).<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-11\">\n<h2>The short version<\/h2>\n<p class=\"lede\">A movement founded in New York in 1875 that claimed all the world’s religions grew from one ancient wisdom, still kept by hidden spiritual Masters in Tibet. It’s the main reason ideas like karma, reincarnation, chakras, and “spiritual evolution” became common in the West. Much of what is now called “New Age” spirituality comes down from it.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-11\">\n<h2>Where it really comes from<\/h2>\n<p><strong>Helena Petrovna Blavatsky<\/strong> (1831 to 1891), usually called HPB, was born into an aristocratic family in what is now Ukraine. She left an early marriage and spent decades traveling; her own accounts of those years, including claims of study in Tibet, are hard to verify. In 1874 she met <strong>Henry Steel Olcott<\/strong>, an American lawyer and journalist investigating séances in Vermont. The next year, in New York, they founded the Theosophical Society with the lawyer <strong>William Quan Judge<\/strong> and others.<\/p>\n<p>The name comes from Greek: “divine wisdom.” The Society set out three aims: to form a universal brotherhood of humanity without distinction of race, creed, sex, caste, or color; to encourage the comparative study of religion, philosophy, and science; and to investigate unexplained laws of nature and the hidden powers in human beings.<\/p>\n<p>Blavatsky’s first big book, <em>Isis Unveiled<\/em> (1877), argued that a single ancient wisdom lay behind all religions and that modern science and the churches had both lost it. In 1879 she and Olcott moved to India, and in 1882 they set up headquarters at Adyar, near Madras (now Chennai), where the Society’s international center still is. Her <em>The Secret Doctrine<\/em> (1888) laid out a vast cosmology based, she said, on an ancient text called the <em>Stanzas of Dzyan<\/em>, which no scholar has ever found.<\/p>\n<p>Blavatsky said her teachings came from the Mahatmas or Masters, especially two named Morya and Koot Hoomi, who sent letters that sometimes appeared mysteriously. In 1885 the Society for Psychical Research in London sent Richard Hodgson to investigate. His report called Blavatsky a fraud and the letters forgeries. (A 1986 paper published by the same society criticized Hodgson’s methods, so the debate continues among her defenders.) Critics also showed that <em>Isis Unveiled<\/em> borrowed heavily, often without credit, from dozens of other books.<\/p>\n<p>After Blavatsky’s death, the movement split. <strong>Annie Besant<\/strong>, a British social reformer, became international president in 1907. With <strong>Charles Leadbeater<\/strong>, she announced that a young Indian boy, <strong>Jiddu Krishnamurti<\/strong>, would be the vehicle of a coming World Teacher, and built an organization around him. In 1929, Krishnamurti dissolved it himself, saying that truth is a “pathless land” no organization can lead anyone to. He went on to become an independent teacher. Earlier, in 1913, the German head of the Society, <strong>Rudolf Steiner<\/strong>, broke away to found Anthroposophy, which gave rise to Waldorf schools and biodynamic farming.<\/p>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-11\">\n<h2>The big ideas<\/h2>\n<p><strong>One ancient wisdom.<\/strong> All religions are partial versions of a single original truth, the “Ageless Wisdom,” which the Masters preserve.<\/p>\n<p><strong>Karma and reincarnation.<\/strong> Souls are reborn many times, and the effects of actions carry over from life to life. Theosophy taught these ideas, borrowed from Hindu and Buddhist sources and reshaped, to a huge Western audience.<\/p>\n<p><strong>Spiritual evolution.<\/strong> The universe and humanity are on a vast, planned climb through cycles and stages, toward higher consciousness.<\/p>\n<p><strong>The Masters.<\/strong> Perfected human beings, guiding humanity’s development from behind the scenes.<\/p>\n<p><strong>The subtle bodies.<\/strong> People have invisible layers beyond the physical body, and energy centers called chakras. Leadbeater’s book <em>The Chakras<\/em> (1927) gave the West much of its picture of them, which differs a good deal from the older Indian sources.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-11\">\n<h2>What to watch for<\/h2>\n<p><strong>Letters only the leaders could receive.<\/strong> The Masters communicated through Blavatsky and, later, a few chosen successors. It’s the Rosicrucian pattern again (chapter 10): an authority that can’t be checked, speaking only through the people at the top.<\/p>\n<p><strong>The “root races.”<\/strong> <em>The Secret Doctrine<\/em> describes humanity’s history as a series of “root races,” ranked as more or less spiritually advanced. Blavatsky also taught universal brotherhood, but the race scheme was later picked up by racist occult movements in Germany and Austria in the early 1900s, as the historian Nicholas Goodrick-Clarke documented. It’s a clear case of a tradition’s ideas being used to rank people.<\/p>\n<p><strong>Borrowed Eastern words.<\/strong> Theosophy presented itself as Eastern wisdom, but it often reshaped Hindu and Buddhist ideas to fit Western hopes, such as turning karma and rebirth into a story of steady progress. If you want to know what a Hindu or Buddhist tradition teaches, go to that tradition’s own sources.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-11\">\n<h2>Where it went next<\/h2>\n<p>Theosophy’s reach was far larger than its membership. Olcott helped revive Buddhism in Sri Lanka and helped design the Buddhist flag (1885). Besant became a leader of the Indian home-rule movement. Gandhi first read the Bhagavad Gita in London in 1889, at the suggestion of Theosophist friends. Painters like Wassily Kandinsky and Piet Mondrian drew on Theosophical ideas as they invented abstract art. The poet W. B. Yeats was a member before he joined the Golden Dawn (chapter 13). Through later writers like Alice Bailey, who popularized the phrase “New Age,” Theosophy fed directly into today’s spiritual marketplace.<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-11\">\n<h2>Read it free<\/h2>\n<ul>\n<li>Blavatsky, <em>The Key to Theosophy<\/em> (1889): her own question-and-answer introduction, and the most readable place to start. Free at <a href=\"https://theosociety.org\" rel=\"noopener\" target=\"_blank\">theosociety.org<\/a> and <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>.<\/li>\n<li>Blavatsky, <em>Isis Unveiled<\/em> and <em>The Secret Doctrine<\/em>: <a href=\"https://theosociety.org\" rel=\"noopener\" target=\"_blank\">theosociety.org<\/a>.<\/li>\n<li>Krishnamurti, “Truth Is a Pathless Land” (1929): his short speech dissolving the order built around him. Free at <a href=\"https://jkrishnamurti.org\" rel=\"noopener\" target=\"_blank\">jkrishnamurti.org<\/a>.<\/li>\n<\/ul>\n<\/section>"}, {"id": "the-golden-dawn", "kind": "chapter", "num": 13, "title": "The Golden Dawn", "dateline": "London, 1888 to 1903", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> Founded 1888; split apart 1900 to 1903; rituals published 1937 to 1940.<br/>\n<strong>Where:<\/strong> London, Edinburgh, Paris, and other cities.<br/>\n<strong>Key people:<\/strong> William Wynn Westcott, S. L. MacGregor Mathers, William Robert Woodman, Moina Mathers, W. B. Yeats, Florence Farr, Aleister Crowley, Israel Regardie.<br/>\n<strong>Key texts:<\/strong> The Cipher Manuscripts; Regardie, <em>The Golden Dawn<\/em> (1937 to 1940); Waite, <em>The Pictorial Key to the Tarot<\/em> (1910).<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-12\">\n<h2>The short version<\/h2>\n<p class=\"lede\">A small Victorian magical order that took nearly every tradition in this guide and wove them into one system of grades, rituals, and symbolic correspondences. It lasted barely fifteen years as a single order. Almost all modern Western occultism, including most tarot decks and most “Hermetic” content online, descends from it.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-12\">\n<h2>Where it really comes from<\/h2>\n<p>The Hermetic Order of the Golden Dawn was founded in London in 1888 by three Freemasons: <strong>William Wynn Westcott<\/strong>, a London coroner; <strong>Samuel Liddell MacGregor Mathers<\/strong>, a scholar of magical manuscripts; and <strong>William Robert Woodman<\/strong>, a retired doctor. All three belonged to the Societas Rosicruciana in Anglia (chapter 10).<\/p>\n<p>Its founding story rested on the “Cipher Manuscripts,” a set of papers written in a simple code that outlined five initiation rituals. Westcott said a letter found with them led him to Anna Sprengel, a German adept, who granted permission to found the order. Historians generally conclude that Sprengel never existed and that her letters were forged, most likely by Westcott himself.<\/p>\n<p>The order still produced serious work and drew remarkable members: the poet <strong>W. B. Yeats<\/strong>; the actress <strong>Florence Farr<\/strong>; the artist <strong>Moina Mathers<\/strong> (sister of the philosopher Henri Bergson, and wife of MacGregor Mathers); the writer <strong>Arthur Machen<\/strong>; and the tea heiress <strong>Annie Horniman<\/strong>, who later funded Dublin’s Abbey Theatre. Unusually for the time, women were admitted on equal terms with men from the start.<\/p>\n<p>In 1892 an inner order was formed for members who had passed through the outer grades, and there, for the first time, members practiced ritual magic rather than only studying it. <strong>Aleister Crowley<\/strong>, a young poet and mountaineer, joined in 1898. Quarrels over leadership boiled over in 1900, when Crowley, acting for Mathers, tried to seize the order’s London ritual rooms in what became known as the “Battle of Blythe Road.” By 1903 the order had split into rival groups, each claiming to be the true heir.<\/p>\n<p>Between 1937 and 1940, <strong>Israel Regardie<\/strong>, once Crowley’s secretary, published the order’s rituals and teaching papers, ending their secrecy. Regardie later trained in psychotherapy and recast much of the system in psychological terms, as a method of self-development.<\/p>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-12\">\n<h2>The big ideas<\/h2>\n<p><strong>The great synthesis.<\/strong> Hermetic philosophy, Christian Cabala’s Tree of Life, alchemy, astrology, tarot, Masonic-style grades, Egyptian imagery, and the angel magic of the Elizabethan scholar John Dee, all placed on one map.<\/p>\n<p><strong>Grades on the Tree of Life.<\/strong> Each grade matched a sefirah (chapter 8). Members climbed the Tree by study, examinations, and ritual, so the Tree became a ladder of personal development.<\/p>\n<p><strong>Correspondences.<\/strong> Everything links to everything: each sefirah to a planet, a color, a tarot card, a Hebrew letter, a god-name, an incense. Memorizing these tables was much of the training.<\/p>\n<p><strong>Ritual and visualization.<\/strong> Practices like the Lesser Banishing Ritual of the Pentagram, still the first ritual many occultists learn, and the “Middle Pillar,” published by Regardie in 1938, in which you picture points of light down the center of the body while chanting divine names.<\/p>\n<p><strong>The higher self.<\/strong> The ultimate goal was union with one’s higher, divine self, described as the soul’s true nature.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-12\">\n<h2>What to watch for<\/h2>\n<p><strong>Every warning sign at once.<\/strong> The Golden Dawn shows nearly every pattern flagged in this guide: a forged pedigree, grades behind oaths, the real knowledge always one level higher, and a breakup into rival orders each claiming to be the true one. That doesn’t make its symbol system useless; it’s a rich and memorable map. It means the pedigree was marketing.<\/p>\n<p><strong>Modern “authentic lineage” claims.<\/strong> Several groups today claim descent from the original order. The rituals have been in print since 1940, so a claim of special lineage is a claim about authority, not about access to secret material.<\/p>\n<p><strong>Crowley’s shadow.<\/strong> Crowley went on to found his own religion, Thelema, based on <em>The Book of the Law<\/em>, which he said was dictated to him by a spirit in Cairo in 1904. He became notorious, and he courted that notoriety. Much of what’s said about him online is exaggerated in both directions. His influence on later occultism is real.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-12\">\n<h2>Where it went next<\/h2>\n<p>Successor orders like the Stella Matutina and the Alpha et Omega carried the system on. Members and their students founded many of the 20th century’s occult movements: Dion Fortune’s Society of the Inner Light, Paul Foster Case’s Builders of the Adytum, and Crowley’s orders. The Rider-Waite-Smith tarot (chapter 9) made the Golden Dawn’s card meanings the world standard. Gerald Gardner borrowed Golden Dawn and Crowley material when he shaped modern Wicca in the 1950s. And Regardie’s psychological reading of magic is the ancestor of the many books today that present ritual as a tool for self-development.<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-12\">\n<h2>Read it free<\/h2>\n<ul>\n<li>S. L. MacGregor Mathers, <em>The Kabbalah Unveiled<\/em> (1887): <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>.<\/li>\n<li>A. E. Waite, <em>The Pictorial Key to the Tarot<\/em> (1910): <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a> and <a href=\"https://www.gutenberg.org\" rel=\"noopener\" target=\"_blank\">Project Gutenberg<\/a>.<\/li>\n<li>W. Wynn Westcott’s papers and several early Golden Dawn documents are collected on <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>.<\/li>\n<li>Angela’s Symposium, a free YouTube channel run by the scholar Angela Puca, has episodes on the Golden Dawn, Hermetic Qabalah, and Regardie’s psychological reading of magic.<\/li>\n<\/ul>\n<\/section>"}, {"id": "new-thought-and-the-kybalion", "kind": "chapter", "num": 14, "title": "New Thought and The Kybalion", "dateline": "New England and Chicago, 1840s to 1908", "html": "<div class=\"glance\">\n<p><strong>When:<\/strong> New Thought from the mid-1800s; <em>The Kybalion<\/em> in 1908.<br/>\n<strong>Where:<\/strong> Maine, Boston, Chicago, and Kansas City.<br/>\n<strong>Key people:<\/strong> Phineas Quimby, Mary Baker Eddy, Emma Curtis Hopkins, Charles and Myrtle Fillmore, William Walker Atkinson.<br/>\n<strong>Key texts:<\/strong> <em>The Kybalion<\/em> (1908); Atkinson, <em>Thought Vibration<\/em> (1906); Ralph Waldo Trine, <em>In Tune with the Infinite<\/em> (1897).<\/p>\n<\/div>\n<section class=\"level2\" id=\"the-short-version-13\">\n<h2>The short version<\/h2>\n<p class=\"lede\">New Thought was an American movement built on the idea that the mind shapes reality: that right thinking produces health, wealth, and happiness. <em>The Kybalion<\/em>, published in Chicago in 1908, presents seven “Hermetic Principles” as secret teaching from ancient Egypt. It’s really New Thought in Egyptian robes. It’s also the most popular “Hermetic” book in the world today, and the least ancient thing in this one.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-really-comes-from-13\">\n<h2>Where it really comes from<\/h2>\n<p><strong>Phineas Parkhurst Quimby<\/strong> (1802 to 1866), a clockmaker in Maine, became a traveling mesmerist (an early form of hypnotist) and then a healer. He came to believe that illness was largely caused by mistaken beliefs, and that changing the belief could heal the body. He called his method the “science of health.”<\/p>\n<p>His patients carried the idea in several directions. <strong>Mary Baker Eddy<\/strong>, treated by Quimby in 1862, went on to found Christian Science, though she later played down his influence. Others, like Warren Felt Evans and Julius and Annetta Dresser, spread a broader “mind cure.” <strong>Emma Curtis Hopkins<\/strong>, a former student of Eddy’s, taught in Chicago in the 1880s and trained many of the movement’s founders, earning the title “teacher of teachers.” Among her students were <strong>Charles and Myrtle Fillmore<\/strong>, who founded the Unity movement in Kansas City in 1889. Ernest Holmes later founded Religious Science. The name “New Thought” came into use in the 1890s, and the International New Thought Alliance formed in 1914.<\/p>\n<p>The movement drew on Emerson and the Transcendentalists, on popular Neoplatonism (chapter 5), on Swedenborg’s mysticism, and on Theosophy’s borrowed Eastern ideas (chapter 12). The philosopher William James studied it seriously in <em>The Varieties of Religious Experience<\/em> (1902), calling it “the religion of healthy-mindedness.”<\/p>\n<p><strong>William Walker Atkinson<\/strong> (1862 to 1932) was a Pennsylvania lawyer who suffered a breakdown, credited New Thought with his recovery, moved to Chicago around 1900, and became one of the movement’s most prolific writers. He published under many pen names, including “Yogi Ramacharaka,” under which he wrote popular books on yoga. His 1906 book <em>Thought Vibration, or the Law of Attraction in the Thought World<\/em> helped spread the phrase “law of attraction.”<\/p>\n<p><em>The Kybalion<\/em> appeared in 1908 from the Yogi Publication Society in Chicago, a press closely tied to Atkinson, credited only to “Three Initiates.” Most scholars think Atkinson wrote it, possibly alone.<\/p>\n<\/section>\n<section class=\"level2\" id=\"the-big-ideas-13\">\n<h2>The big ideas<\/h2>\n<p><strong>Thoughts are things.<\/strong> Mental states have real effects on the body and on circumstances. Change your thinking and you change your life.<\/p>\n<p><strong>The divine within.<\/strong> Most New Thought writers taught that God is present in every person, so each person has access to infinite power and supply.<\/p>\n<p><strong>Affirmation.<\/strong> Repeating positive statements (“I am whole,” “I am prosperous”) as a way of reshaping belief.<\/p>\n<p><strong>The seven principles of <em>The Kybalion<\/em>.<\/strong> Here they are, with what holds up as a usable idea once the claim of ancient origin is set aside:<\/p>\n<div class=\"table\">\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Principle<\/th>\n<th>The book’s claim<\/th>\n<th>What survives as a usable idea<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mentalism<\/td>\n<td>“The All is Mind; the Universe is Mental.”<\/td>\n<td>The frame you bring to a situation shapes what you can do in it.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Correspondence<\/td>\n<td>As above, so below.<\/td>\n<td>Patterns repeat at different scales, so it helps to zoom out.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Vibration<\/td>\n<td>Everything moves and vibrates.<\/td>\n<td>Little, beyond metaphor.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Polarity<\/td>\n<td>Opposites are the same thing in different degrees.<\/td>\n<td>Moods sit on a scale, so you can move along it gradually.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rhythm<\/td>\n<td>Everything swings like a pendulum.<\/td>\n<td>Moods rise and fall; you don’t have to act on every swing.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cause and Effect<\/td>\n<td>Every cause has its effect.<\/td>\n<td>Put your effort into actions, not outcomes you can’t control.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Gender<\/td>\n<td>Everything has masculine and feminine sides.<\/td>\n<td>Little, beyond metaphor, and dated in its framing.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p><strong>How it compares to the real Hermetica.<\/strong> The <em>Corpus Hermeticum<\/em> (chapter 3) is religious: it’s about God, the soul’s fall, and its rebirth through divine knowledge. <em>The Kybalion<\/em> is practical psychology: it’s about mastering your moods and your circumstances. A few of its ideas have ancient roots, most clearly Correspondence, which comes from the Emerald Tablet. Most of the rest is New Thought.<\/p>\n<\/section>\n<section class=\"level2\" id=\"what-to-watch-for-13\">\n<h2>What to watch for<\/h2>\n<p><strong>The claim of age.<\/strong> <em>The Kybalion<\/em> says its teaching was passed down from Hermes in ancient Egypt. It wasn’t. Content that treats the book as ancient is repeating the book’s own marketing.<\/p>\n<p><strong>Physics words without physics.<\/strong> <em>The Kybalion<\/em>’s chapter on Vibration borrows the language of science without its content. That borrowing grew into today’s “raise your vibration” and “frequency” industry. If a teacher uses “frequency” or “energy” as a literal mechanism, ask what would be measured, and how.<\/p>\n<p><strong>The blame problem.<\/strong> If thoughts create reality, then illness, poverty, or tragedy can be blamed on the sufferer’s wrong thinking. This is the darkest side of the movement, and it’s still common in modern “manifesting” culture. Real life is shaped by many things no one controls.<\/p>\n<p><strong>Healing claims.<\/strong> Some New Thought and Christian Science followers have refused medical care in favor of mental or spiritual treatment, sometimes with tragic results. Positive thinking is not medicine.<\/p>\n<p><strong>None of this makes the book useless.<\/strong> Read as a 1908 manual of mental self-management, some of <em>The Kybalion<\/em>’s advice is sound, and several of its principles line up with well-tested techniques for handling emotions. The problem is the claim of ancient origin. Once you know that, you can keep what works.<\/p>\n<\/section>\n<section class=\"level2\" id=\"where-it-went-next-13\">\n<h2>Where it went next<\/h2>\n<p>New Thought became one of the most influential religious movements America ever produced, though few people know its name. Its ideas run through Wallace Wattles’s <em>The Science of Getting Rich<\/em> (1910), Napoleon Hill’s <em>Think and Grow Rich<\/em> (1937), Norman Vincent Peale’s <em>The Power of Positive Thinking<\/em> (1952), the bestseller <em>The Secret<\/em> (2006), and much of today’s self-help and “manifesting” content, as well as the prosperity gospel preached in some churches. <em>The Kybalion<\/em> itself has never gone out of print, and it’s the book most people mean today when they say “Hermetic.”<\/p>\n<\/section>\n<section class=\"level2\" id=\"read-it-free-13\">\n<h2>Read it free<\/h2>\n<ul>\n<li><em>The Kybalion<\/em> (1908): <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>. Read it next to <em>The Divine Pymander<\/em> (chapter 3) and the difference shows quickly.<\/li>\n<li>Ralph Waldo Trine, <em>In Tune with the Infinite<\/em> (1897), and William James, <em>The Varieties of Religious Experience<\/em> (1902), lectures 4 and 5: <a href=\"https://www.gutenberg.org\" rel=\"noopener\" target=\"_blank\">Project Gutenberg<\/a>.<\/li>\n<li>Atkinson, <em>Thought Vibration<\/em> (1906): <a href=\"https://www.gutenberg.org\" rel=\"noopener\" target=\"_blank\">Project Gutenberg<\/a> and <a href=\"https://sacred-texts.com\" rel=\"noopener\" target=\"_blank\">sacred-texts.com<\/a>.<\/li>\n<\/ul>\n<\/section>"}, {"id": "side-by-side", "kind": "back", "num": null, "title": "Side by Side", "dateline": "", "html": "<p>Every tradition in this guide claims a person can be changed. They disagree about what’s wrong to begin with, what the change is, and who gets to say it has happened. That last column matters most. A change that only the group can confirm is a change you can’t check for yourself.<\/p>\n<div class=\"table wide\">\n<div class=\"tablewrap\"><table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Tradition<\/th>\n<th>What’s wrong to begin with<\/th>\n<th>What the change is<\/th>\n<th>Who says it happened<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Pythagoreanism<\/td>\n<td>The soul is out of tune and caught in rebirth<\/td>\n<td>Purified by number, music, silence, and discipline<\/td>\n<td>The community, through stages of membership<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stoicism<\/td>\n<td>False judgments about what matters<\/td>\n<td>Living by reason, disturbed only by what is up to you<\/td>\n<td>You, by your own conduct; there are no ranks<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hermeticism<\/td>\n<td>The divine mind is asleep inside a body<\/td>\n<td>Rebirth through knowing God and self<\/td>\n<td>A teacher, in dialogue with a student<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Gnosticism<\/td>\n<td>A divine spark is trapped in a world made by a lesser power<\/td>\n<td>Awakening through saving knowledge<\/td>\n<td>The revealer, and the group of those who “know”<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Neoplatonism<\/td>\n<td>The soul has turned outward, away from its source<\/td>\n<td>Turning back; union with the One<\/td>\n<td>Your own experience: rare and brief<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Christian mysticism<\/td>\n<td>Self-will separates the soul from God<\/td>\n<td>Union with God by grace<\/td>\n<td>Spiritual directors and the church, judged by the fruit of a life<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Alchemy<\/td>\n<td>Matter, and for some the soul, is impure<\/td>\n<td>Refined into gold or the Stone<\/td>\n<td>The furnace: the result appears or it doesn’t<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kabbalah<\/td>\n<td>The world, and God’s presence in it, is broken<\/td>\n<td>Repair through right action<\/td>\n<td>The tradition and its law; repair is shared, not personal rank<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tarot<\/td>\n<td>Not knowing what’s ahead, or what’s inside<\/td>\n<td>Insight from the cards<\/td>\n<td>The reader, and the person being read for<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rosicrucians<\/td>\n<td>Learning and religion have gone stale<\/td>\n<td>A universal reform of knowledge and faith<\/td>\n<td>An invisible brotherhood that never appeared<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Freemasonry<\/td>\n<td>A rough, unshaped character<\/td>\n<td>Shaped into a true stone<\/td>\n<td>The lodge, by conferring degrees<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Theosophy<\/td>\n<td>Humanity is early on a long spiritual climb<\/td>\n<td>Progress through many lives toward the Masters<\/td>\n<td>The Masters, through letters only the leaders received<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Golden Dawn<\/td>\n<td>An unawakened higher self<\/td>\n<td>Ascent through grades on the Tree of Life<\/td>\n<td>The order’s officers, by grade<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>New Thought<\/td>\n<td>Wrong thinking causes illness and lack<\/td>\n<td>Right thinking brings health and success<\/td>\n<td>You alone; but failure gets blamed on your thinking<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<p><strong>What the table suggests.<\/strong> This is this guide’s own reading, not a settled finding. The traditions that check the change by conduct or by results (Stoicism, alchemy at its most literal, and Christian mysticism’s “by their fruits ye shall know them”) are the easiest to test. The ones that check it by rank (Pythagorean stages, Masonic degrees, Golden Dawn grades) or by an authority no one can question (the Rosicrucian brotherhood, the Theosophical Masters) are the easiest to turn into a ladder you’re always climbing. If you take up any of these practices, the most useful question is the plainest one: is my life actually different, in ways other people could notice?<\/p>"}]}</script>
<script>

(function () {
"use strict";

/* ---------- storage (per viewer, optional) ---------- */
var store = {
  get: function (k, d) { try { var v = localStorage.getItem("tb:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem("tb:" + k, JSON.stringify(v)); } catch (e) {} }

var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// guidance: "off" | "tones" | "voice"; background sound is never auto-started (needs a tap)
var guide = store.get("guide", store.get("sound", false) ? "tones" : "off");
var bgKind = "off";
var guideVol = store.get("gvol", 0.8), bgVol = store.get("bvol", 0.5);
var voiceName = store.get("voice", ""), voiceRate = store.get("rate", 0.85);

/* ---------- sound + wake lock ---------- */
var actx = null;
function ctx() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();

}
function chime(freq, len, force) {

  try {
    ctx();
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = "sine"; o.frequency.value = freq || 528;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.22 * guideVol), t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (len || 0.6));

/* voice: use the most natural voice the device has; the person can override it */
var NOVELTY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Eddy|Flo|Fred|Good News|Grandma|Grandpa|Hysterical|Jester|Junior|Kathy|Organ|Pipe Organ|Princess|Ralph|Reed|Rocko|Sandy|Shelley|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/i;
function voiceScore(v) {
  var n = v.name, sc = 0;
  if (/premium/i.test(n)) sc += 6;
  if (/enhanced/i.test(n)) sc += 4;
  if (/natural|neural|online/i.test(n)) sc += 4;          // Edge/Windows natural voices
  if (/^Google/i.test(n)) sc += 2;                         // Chrome's network voices
  if (/^(Ava|Zoe|Evan|Nathan|Samantha|Allison|Susan|Serena|Daniel|Karen|Moira|Tessa|Joelle|Noelle)/i.test(n)) sc += 1;
  if (/en[-_](US|GB|AU|IE|CA|NZ)/i.test(v.lang)) sc += 1;

}
function englishVoices() {

    return speechSynthesis.getVoices()
      .filter(function (v) { return /^en/i.test(v.lang) && !NOVELTY.test(v.name); })
      .sort(function (a, b) { return voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name); });

}
var voicePick = null;
function pickVoice() {
  if (voicePick) return voicePick;
  var vs = englishVoices();
  if (voiceName) for (var i = 0; i < vs.length; i++) if (vs[i].name === voiceName) return (voicePick = vs[i]);
  return (voicePick = vs[0] || null);
}
var voiceListeners = [];
function voicesChanged() { voicePick = null; voiceListeners.forEach(function (f) { try { f(); } catch (e) {} }); }
try {
  if (window.speechSynthesis) {
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", voicesChanged);
    else speechSynthesis.onvoiceschanged = voicesChanged;
    speechSynthesis.getVoices(); // asks the device to start loading its list
  }
} catch (e) {}
// iPhones hand over their voice list late, and sometimes never announce it: keep asking for a few seconds
function waitForDeviceVoices(done) {
  var tries = 0;
  (function again() {
    var n = englishVoices().length;
    if (n || tries++ > 16) { voicesChanged(); if (done) done(n); return; }
    setTimeout(again, 300);
  })();
}

/* ---------- built-in voices: recordings that ship with the app ---------- */
// Each spoken line was recorded once with Kokoro (an open-source voice, Apache 2.0)
// and packed into one file per voice. Lines not in the pack use the device's own voice.
var VOICES = {
  heart: { name: "Heart", desc: "Warm and steady", file: "voices/heart-1.bin" },
  michael: { name: "Michael", desc: "Low and calm", file: "voices/michael-1.bin" }
};
var voiceKind = store.get("vkind", "heart");
if (voiceKind !== "device" && !VOICES[voiceKind]) voiceKind = "heart";
var packs = {}, packLoads = {};
function phraseKey(t) { return String(t).replace(/ · /g, ", ").replace(/[“”]/g, "").replace(/…/g, ",").replace(/\s+/g, " ").trim(); }
function phraseId(t) { var h = 0x811c9dc5; for (var i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ("0000000" + h.toString(16)).slice(-8); }
function loadPack(kind, onProgress) {

  if (packLoads[kind]) return packLoads[kind];
  var v = VOICES[kind]; if (!v) return Promise.reject(new Error("no voice"));
  packLoads[kind] = fetch(v.file).then(function (r) {
    if (!r.ok) throw new Error("missing");
    var total = +r.headers.get("content-length") || 0;
    if (!r.body || !r.body.getReader || !onProgress) return r.arrayBuffer();
    var rd = r.body.getReader(), parts = [], got = 0;
    return (function pump() {

        parts.push(x.value); got += x.value.length; if (total) onProgress(got / total);
        return pump();
      });
    })();
  }).then(function (buf) {
    var n = new DataView(buf).getUint32(0, true);
    var index = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
    packs[kind] = { buf: buf, base: 4 + n, index: index, cache: {}, order: [] };
    return packs[kind];
  });
  packLoads[kind].catch(function () { delete packLoads[kind]; });
  return packLoads[kind];
}

var clip = null, clipToken = 0;
function decodeClip(p, id) {

    return ab;
  });
}
function playClip(kind, key) {

  clip = { src: null, pending: true };
  decodeClip(p, id).then(function (ab) {
    if (my !== clipToken) return;
    var c = ctx(), src = c.createBufferSource(), g = c.createGain();
    src.buffer = ab; g.gain.value = guideVol;
    src.connect(g); g.connect(c.destination);
    var me = { src: src, end: c.currentTime + ab.duration };

}
function deviceSay(key) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(key);
    var v = pickVoice(); if (v) u.voice = v;
    u.rate = voiceRate; u.pitch = 1; u.volume = guideVol;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function say(text, force) {
  if (guide !== "voice" && !force) return;
  if (COLLECT) { COLLECT.push(text); return; }
  var key = phraseKey(text);
  hush();
  if (voiceKind !== "device") {
    if (packHas(voiceKind, key)) { playClip(voiceKind, key); return; }
    if (!packs[voiceKind]) loadPack(voiceKind).catch(function () {});
  }

}
function speaking() {
  if (clip) return true;
  try { return !!(window.speechSynthesis && speechSynthesis.speaking); } catch (e) { return false; }
}
function hush() {
  clipToken++;
  if (clip) { try { if (clip.src) clip.src.stop(); } catch (e) {} clip = null; }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
}
// when collecting the list of lines to record, tools report what they would say
var COLLECT = null;
// one call for every cue: spoken words in voice mode, a tone in tones mode
function cue(text, freq, len) { if (guide === "voice") say(text); else chime(freq, len); }

/* background sound, generated here (no files) */
var bg = null;
function noiseBuffer(kind) {
  var c = ctx(), len = c.sampleRate * 6, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0), last = 0;
  for (var i = 0; i < len; i++) {
    var w = Math.random() * 2 - 1;
    if (kind === "rain") d[i] = w;
    else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  }
  // fade the loop seam
  for (var k = 0; k < 2000; k++) { var f = k / 2000; d[k] *= f; d[len - 1 - k] *= f; }
  return buf;
}
/* soft music, made here: slow chords with a few bell notes over them, never quite the same twice */
function startMusic(c) {
  var out = c.createGain(), base = 2.2, t0 = c.currentTime;
  out.gain.setValueAtTime(0.0001, t0);
  out.gain.exponentialRampToValueAtTime(Math.max(0.0002, base * bgVol), t0 + 4);
  out.connect(c.destination);
  // a simple room: a burst of fading noise used as the echo
  var len = Math.floor(c.sampleRate * 3.5), ir = c.createBuffer(2, len, c.sampleRate);
  for (var ch = 0; ch < 2; ch++) { var d = ir.getChannelData(ch); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  var room = c.createConvolver(); room.buffer = ir;
  var wet = c.createGain(); wet.gain.value = 0.5;
  var dry = c.createGain(); dry.gain.value = 0.6;
  var tone = c.createBiquadFilter(); tone.type = "lowpass"; tone.frequency.value = 2400;
  tone.connect(dry); tone.connect(room); room.connect(wet); dry.connect(out); wet.connect(out);
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  // chords in C major (as MIDI note numbers), and bell notes from the five-note scale above them
  var CHORDS = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 48, 57, 64], [43, 50, 59, 62], [40, 47, 55, 62], [41, 53, 57, 60]];
  var BELLS = [72, 74, 76, 79, 81, 84, 86, 88];
  var ci = 0, nextChord = t0 + 0.2, nextBell = t0 + 5;
  function pad(notes, t, dur) {
    notes.forEach(function (m, k) {
      var o = c.createOscillator(), g = c.createGain(), lvl = k === 0 ? 0.05 : 0.022;
      o.type = k === 0 ? "sine" : "triangle"; o.frequency.value = hz(m); o.detune.value = (Math.random() - 0.5) * 8;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(lvl, t + 5);
      g.gain.setValueAtTime(lvl, t + dur - 6); g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(tone); o.start(t); o.stop(t + dur + 0.1);
    });
  }
  function ding(m, t) {
    [[1, 0.045], [2, 0.012]].forEach(function (p) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = hz(m) * p[0];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(p[1], t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 4.5 / p[0]);
      o.connect(g); g.connect(tone); o.start(t); o.stop(t + 5);
    });
  }
  function bellNote() { return BELLS[Math.floor(Math.random() * BELLS.length)]; }
  // schedule 20 seconds ahead, so a slowed background tab doesn't leave gaps
  function ahead() {
    var until = c.currentTime + 20;
    while (nextChord < until) {
      var r = Math.random(); ci = r < 0.7 ? (ci + 1) % CHORDS.length : r < 0.85 ? (ci + 2) % CHORDS.length : ci;
      pad(CHORDS[ci], nextChord, 17); nextChord += 12;
    }
    while (nextBell < until) {
      ding(bellNote(), nextBell);
      if (Math.random() < 0.3) ding(bellNote(), nextBell + 0.6 + Math.random());
      nextBell += 3 + Math.random() * 6;
    }
  }
  ahead();
  return { out: out, nodes: [tone, room, wet, dry, out], base: base, timer: setInterval(ahead, 2000) };
}
function startBg(kind) {
  stopBg();
  if (kind === "off") return;
  if (kind === "music") {
    try { bg = startMusic(ctx()); bgKind = kind; } catch (e) { bg = null; bgKind = "off"; }
    return;
  }
  try {
    var c = ctx(), src = c.createBufferSource(), out = c.createGain(), nodes = [src, out];
    src.buffer = noiseBuffer(kind); src.loop = true;
    var base = { brown: 0.5, ocean: 0.55, rain: 0.09 }[kind], level = Math.max(0.0002, base * bgVol);
    var chain = src;
    if (kind === "rain") {
      var hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
      var lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5500;
      chain.connect(hp); hp.connect(lp); chain = lp; nodes.push(hp, lp);
    }
    if (kind === "ocean") {
      var lp2 = c.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.value = 700;
      var swell = c.createGain(); swell.gain.value = 0.55;
      var lfo = c.createOscillator(); lfo.frequency.value = 0.09;
      var depth = c.createGain(); depth.gain.value = 0.45;
      lfo.connect(depth); depth.connect(swell.gain); lfo.start();
      chain.connect(lp2); lp2.connect(swell); chain = swell; nodes.push(lp2, swell, lfo, depth);
    }
    chain.connect(out); out.connect(c.destination);
    out.gain.setValueAtTime(0.0001, c.currentTime);
    out.gain.exponentialRampToValueAtTime(level, c.currentTime + 2.5);
    src.start();
    bg = { out: out, nodes: nodes, base: base }; bgKind = kind;
  } catch (e) { bg = null; bgKind = "off"; }
}
function setBgVol(v) {
  bgVol = v; store.set("bvol", v);
  if (bg) try { bg.out.gain.cancelScheduledValues(actx.currentTime); bg.out.gain.setTargetAtTime(Math.max(0.0002, bg.base * v), actx.currentTime, 0.15); } catch (e) {}
}
function stopBg() {
  if (!bg) { bgKind = "off"; return; }
