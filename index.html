<meta name="theme-color" content="#1f2832" media="(prefers-color-scheme: dark)">

<style>
/* ==========================================================
   Trestleboard styles: one set, in one place.
   Text sizes: six steps (--t-*). Spacing: 4 / 8 / 12 / 16 / 24 / 32.
   Fonts are the device's own sans-serif (San Francisco on iPhone and
   Mac, Segoe UI on Windows), so nothing downloads and it works offline.
   ========================================================== */
:root {
  --paper: #e7ebef;
  --surface: #f4f6f8;
  --ink: #1b232c;
  --muted: #535f6d;
  --rule: #c3ccd6;
  --steel: #33607f;
  --steel-soft: #d6e1eb;
  --on-steel: #ffffff;
  --slate: #2b3541;
  --on-slate: #e8edf2;
  --on-slate-muted: #a9b5c2;
  --slate-mark: #93b4d2;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: var(--sans);
  --body: var(--sans);

  /* six text sizes */
  --t-title: 2rem;        /* 32: page titles */
  --t-head: 1.375rem;     /* 22: section headings */
  --t-card: 1.1875rem;    /* 19: card and row titles */
  --t-body: 1.0625rem;    /* 17: reading text */
  --t-small: 0.9375rem;   /* 15: hints, second lines */
  --t-tiny: 0.8125rem;    /* 13: small labels */

  /* spacing */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r: 12px; --r-s: 8px;
  --tap: 44px;
  --fs: var(--t-body);    /* reading size; the Aa control changes it */
  --tabs-h: 3.6rem;

  /* names the practice tools were written against */
  --bg: var(--paper); --brass: var(--steel); --brass-soft: var(--steel-soft); --on-brass: var(--on-steel); --mono: var(--body);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171d; --surface: #19212a; --ink: #dce3ea; --muted: #94a2b1; --rule: #2a3542;
    --steel: #8fb3d4; --steel-soft: #1d2a37; --on-steel: #12171d; --slate: #1f2832;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171d; --surface: #19212a; --ink: #dce3ea; --muted: #94a2b1; --rule: #2a3542;
  --steel: #8fb3d4; --steel-soft: #1d2a37; --on-steel: #12171d; --slate: #1f2832;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--slate); }
body {
  margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: var(--t-body); line-height: 1.55;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
body[data-size="s"] { --fs: 0.97rem; }
body[data-size="l"] { --fs: 1.22rem; }
[hidden] { display: none !important; }
a { color: var(--steel); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: var(--t-title); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: var(--t-head); }
h3 { font-size: var(--t-card); }
p { margin: 0; }
.label { font-family: var(--body); font-size: var(--t-tiny); font-weight: 600; color: var(--muted); }
.ev { font-family: var(--body); font-size: var(--t-tiny); font-weight: 600; color: var(--steel); white-space: nowrap; }
.empty, .gdesc, .phelp, .msg { color: var(--muted); font-size: var(--t-small); }
.msg:empty { display: none; }
.ico { display: inline-grid; place-items: center; flex: none; }
.ico svg { width: 100%; height: 100%; }
.chev { width: 0.95rem; height: 0.95rem; color: var(--muted); opacity: 0.6; }

/* ---------- shell: top bar, page, bottom tabs ---------- */
.top {
  position: sticky; top: 0; z-index: 6; display: block;
  background: var(--slate); color: var(--on-slate);
  padding: env(safe-area-inset-top, 0px) max(var(--s3), env(safe-area-inset-right, 0px)) 0 max(var(--s3), env(safe-area-inset-left, 0px));
}
.top-in { max-width: 40rem; margin: 0 auto; display: flex; align-items: center; gap: var(--s1); min-height: 52px; }
.top .brand { display: flex; align-items: center; gap: var(--s2); color: var(--on-slate); text-decoration: none; min-width: 0; min-height: var(--tap); padding: 0 var(--s1); }
.top .brand svg { width: 1.4rem; height: 1.4rem; color: var(--slate-mark); flex: none; }
.top .brand span { font-family: var(--display); font-size: var(--t-body); font-weight: 600; }
.top .ttl { font-family: var(--display); font-size: var(--t-card); font-weight: 600; flex: 1; padding: 0 var(--s1); }
.top .spacer { flex: 1; }
.tb {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s1);
  min-width: var(--tap); min-height: var(--tap); padding: 0 var(--s2);
  background: transparent; color: var(--on-slate); border: 0; border-radius: var(--r-s);
  font-size: var(--t-small); white-space: nowrap;
}
.tb .ico { width: 1.4rem; height: 1.4rem; }
.tb[aria-pressed="true"], .tb[aria-expanded="true"] { color: var(--slate-mark); }
.tb.backlink { color: var(--slate-mark); font-size: var(--t-body); padding-left: 0; min-width: 0; }
.tb.backlink .ico { width: 1.1rem; height: 1.1rem; }
.tb.aa { font-family: var(--display); font-size: var(--t-card); font-weight: 600; }
.progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--slate-mark); }
.sizepop { position: absolute; right: max(var(--s3), env(safe-area-inset-right, 0px)); top: calc(100% + var(--s2)); display: flex; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s1); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
.sizepop button { min-width: 52px; min-height: var(--tap); background: none; border: 0; border-radius: var(--r-s); color: var(--ink); font-family: var(--display); }
.sizepop button[aria-pressed="true"] { background: var(--steel-soft); color: var(--steel); }

.app {
  max-width: 40rem; margin: 0 auto; display: grid; gap: var(--s6);
  padding: var(--s5) max(var(--s4), env(safe-area-inset-right, 0px)) calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + var(--s6)) max(var(--s4), env(safe-area-inset-left, 0px));
}
.app > *, .prose > *, .prose section > * { min-width: 0; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-top: 1px solid var(--rule);
  padding: 0 max(var(--s2), env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(var(--s2), env(safe-area-inset-left, 0px));
}
.tabs a { position: relative; isolation: isolate; display: grid; justify-items: center; align-content: center; gap: 2px; height: var(--tabs-h); color: var(--muted); text-decoration: none; font-size: var(--t-tiny); font-weight: 600; transition: color 0.2s; }
.tabs a svg { width: 1.45rem; height: 1.45rem; transition: transform 0.25s; }
.tabs a[aria-current="page"] { color: var(--steel); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; z-index: -1; top: 0.35rem; left: 50%; width: 3.6rem; height: 1.85rem; margin-left: -1.8rem; border-radius: 1rem; background: var(--steel-soft); }
.tabs a.fresh::before { animation: pill 0.3s ease-out; }

/* ---------- headings and groups ---------- */
.group { display: grid; gap: var(--s2); scroll-margin-top: 4.5rem; }
.group > h2 { display: flex; align-items: center; gap: var(--s3); }
.group > h2 .gicon { width: 1.5rem; height: 1.5rem; }
.group > .gdesc { margin-top: calc(var(--s1) * -1); margin-bottom: var(--s1); }
.group > .label { margin-bottom: calc(var(--s1) * -1); }
.hello h1 { font-size: var(--t-title); }
.hello p { color: var(--muted); font-size: var(--t-small); margin-top: var(--s1); }

/* ---------- buttons: one filled main button, everything else outlined ---------- */
.go, .opt, .star {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--tap); border-radius: 999px; font-family: var(--body); text-decoration: none;
  transition: transform 0.12s, border-color 0.2s, background 0.2s, color 0.2s;
}
.go { background: var(--steel); color: var(--on-steel); border: 1px solid var(--steel); padding: 0 var(--s5); min-width: 9rem; font-size: var(--t-body); font-weight: 600; }
.go.ghost { background: transparent; color: var(--steel); }
.opt { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); padding: 0 var(--s4); font-size: var(--t-small); }
.opt[aria-pressed="true"] { border-color: var(--steel); background: var(--steel-soft); color: var(--ink); }
.go:active, .opt:active, .pick:active, .linkrow:active, .gtile:active, .pager a:active { transform: scale(0.985); }
.row { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: center; }
.row.left { justify-content: flex-start; }
.row.between { justify-content: space-between; align-items: center; }
.btnrow { display: flex; flex-wrap: wrap; gap: var(--s2); }
.icobtn { display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); flex: none; background: none; border: 0; border-radius: 50%; color: var(--steel); padding: 0; }
.icobtn .ico { width: 1.35rem; height: 1.35rem; }
.icobtn[aria-pressed="true"] { background: var(--steel-soft); }
.linkbtn { background: none; border: 0; color: var(--steel); font-size: var(--t-small); text-decoration: underline; text-underline-offset: 0.18em; text-decoration-thickness: 1px; min-height: var(--tap); padding: 0 var(--s2); }

/* ---------- rows: one look for everything you tap in a list ---------- */
.pick, .linkrow, .tipping > summary, .more > summary {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s3);
  width: 100%; min-height: 56px; padding: var(--s3) var(--s4); text-align: left;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--r);
  text-decoration: none; font-size: var(--t-body); transition: transform 0.12s, border-color 0.2s;
}
.pick:hover, .linkrow:hover, .gtile:hover { border-color: var(--steel); }
.pick .sit, .linkrow .t1 { display: block; }
.pick .nm, .linkrow small { display: block; font-size: var(--t-small); color: var(--muted); }
.pick .end { display: inline-flex; align-items: center; gap: var(--s2); }
.pick .pin { width: 0.95rem; height: 0.95rem; color: var(--steel); }
.links, .rows { display: grid; gap: var(--s2); }

/* fold-outs styled as rows */
.tipping, .more { display: grid; }
.tipping > summary, .more > summary { list-style: none; cursor: pointer; }
.tipping > summary::-webkit-details-marker, .more > summary::-webkit-details-marker { display: none; }
.tipping > summary .chev, .more > summary .chev { transform: rotate(90deg); transition: transform 0.2s; }
.tipping[open] > summary .chev, .more[open] > summary .chev { transform: rotate(-90deg); }
.tipping[open] > summary, .more[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.tipping > p { background: var(--surface); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 var(--r) var(--r); padding: 0 var(--s4) var(--s4); font-size: var(--t-small); }
.more > .tablewrap { border-top: 0; border-radius: 0 0 var(--r) var(--r); }
.prose .fold { margin: var(--s2) 0; }
.prose .fold > summary { font-weight: 600; }
.more > .foldbody { display: grid; gap: var(--s3); padding: var(--s4); background: var(--surface); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 var(--r) var(--r); }
.howto { margin-top: var(--s2); }
.howto > summary { min-height: var(--tap); padding: var(--s2) var(--s3); font-size: var(--t-small); }
.howto ol { margin: 0; padding: var(--s3) var(--s3) var(--s3) calc(var(--s3) + 1.2rem); display: grid; gap: var(--s1); font-size: var(--t-small); color: var(--muted); background: var(--surface); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 var(--r) var(--r); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s3); }
.card h2 { font-size: var(--t-card); }

/* the Watch, offered on the home page: the one slate card there */
.wpromo { background: var(--slate); color: var(--on-slate); border: 0; padding: var(--s5); gap: var(--s4); }
.wpromo-top { display: flex; align-items: center; gap: var(--s3); }
.wpromo .emb.tile { width: 2.8rem; height: 2.8rem; background: transparent; color: var(--slate-mark); border-color: color-mix(in srgb, var(--on-slate-muted) 45%, transparent); }
.wpromo .emb.tile svg { width: 1.5rem; height: 1.5rem; }
.wpromo .label { color: var(--slate-mark); }
.wpromo h2 { font-size: var(--t-head); }
.wpromo p { color: color-mix(in srgb, var(--on-slate) 82%, var(--slate)); }
.wpromo .go { background: var(--slate-mark); color: var(--slate); border-color: var(--slate-mark); }
.wpromo .opt { background: transparent; color: var(--on-slate); border-color: color-mix(in srgb, var(--on-slate-muted) 45%, transparent); }

/* a line for today */
.linecard { gap: var(--s3); }
.linecard .quote { margin: 0; border: 0; padding: 0; font-style: italic; font-size: var(--t-card); line-height: 1.45; }
.linecard .qrow { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: calc(var(--s2) * -1); }
.linecard cite { font-style: normal; font-size: var(--t-tiny); color: var(--muted); }
.linecard .icobtn { margin-right: calc(var(--s2) * -1); }
.linecard .linkrow { background: var(--paper); }
.minis .gtile { background: transparent; }
.minis .emb svg { width: 1.35rem; height: 1.35rem; }

/* how are you: eight even tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
.gtile {
  display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); column-gap: var(--s2); align-items: center; align-content: start;
  padding: var(--s3) var(--s3) var(--s3) var(--s4); min-height: 72px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r);
  color: var(--ink); text-decoration: none; transition: transform 0.1s, border-color 0.15s;
}
.gtile .gicon { width: 1.4rem; height: 1.4rem; }
.gtile .tname { font-family: var(--display); font-size: var(--t-body); font-weight: 600; line-height: 1.25; }
.gtile .thint { grid-column: 1 / -1; font-size: var(--t-tiny); color: var(--muted); line-height: 1.35; margin-top: var(--s1); }
.gicon { display: inline-grid; place-items: center; color: var(--steel); flex: none; }
.gicon svg { width: 100%; height: 100%; }

/* closing */
.ending { text-align: center; display: grid; gap: var(--s2); justify-items: center; padding-top: var(--s2); }
.ending .ico { width: 1.6rem; height: 1.6rem; color: var(--steel); }
.ending .ico svg { width: 100%; height: 100%; }
.ending h2 { font-size: var(--t-card); }
.ending p { color: var(--muted); max-width: 30rem; font-size: var(--t-small); }

/* ---------- one group ---------- */
.g-head { display: grid; gap: var(--s2); }
.g-head .gicon { width: 2.4rem; height: 2.4rem; }
.g-head p { color: var(--muted); }
.chip { color: var(--ink); }

/* ---------- practice page ---------- */
.p-head { display: grid; gap: var(--s2); }
.p-head .num { font-family: var(--display); color: var(--steel); font-size: var(--t-small); font-weight: 600; }
.p-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); font-size: var(--t-small); color: var(--muted); }
.p-meta .dotsep { opacity: 0.6; }
.when { font-size: var(--t-body); }
.methodbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3) var(--s4) var(--s4); display: grid; gap: var(--s2); }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-right: calc(var(--s2) * -1); }
.mhead h2, .fields dt, .subhead { font-family: var(--body); font-size: var(--t-body); font-weight: 600; line-height: 1.3; }
.methodbox .mtext { display: grid; gap: var(--s2); }
.apptip { font-size: var(--t-small); color: var(--muted); border-top: 1px solid var(--rule); padding-top: var(--s2); }
.tool { background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--steel); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s4); justify-items: center; text-align: center; }
.tool > * { max-width: 100%; }
.tool.lit { animation: lit 1.6s ease-out; }
.fields { margin: 0; display: grid; gap: var(--s5); }
.fields > div { display: grid; gap: var(--s1); }
.fields dd { margin: 0; display: block; }
.fields dd > * + * { margin-top: var(--s2); }
.fields dd blockquote { margin-top: var(--s2); margin-bottom: var(--s2); }
.fields .img dd { font-style: italic; }
.fields .hole { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3) var(--s4); }
.fields .src dd { color: var(--muted); font-size: var(--t-small); }
blockquote { margin: 0; padding-left: var(--s3); border-left: 2px solid var(--steel); font-style: italic; }

/* rating */
.rate { display: grid; gap: var(--s3); }
.rate .scale { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); gap: var(--s2); align-items: center; }
.rate .scale .label { font-size: var(--t-small); }
.rate .nums { display: flex; gap: var(--s2); }
.rate .num { width: var(--tap); height: var(--tap); padding: 0; min-width: 0; border-radius: 50%; font-size: var(--t-body); }
.rate .saverow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-top: var(--s1); }

/* ---------- practice tools ---------- */
.chips { display: grid; gap: var(--s3); width: 100%; }
.chips .grp { display: grid; gap: var(--s2); }
.stage { width: 13rem; height: 13rem; display: grid; place-items: center; position: relative; transition: width 0.4s ease, height 0.4s ease; }
.stage.idle { width: 8.5rem; height: 8.5rem; }
.stage svg { width: 100%; height: 100%; overflow: visible; }
.ring { fill: none; stroke: var(--rule); stroke-width: 1; }
.orb { fill: var(--steel); opacity: 0.85; }
.sq { fill: none; stroke: var(--rule); stroke-width: 2.5; }
.sq-side { fill: none; stroke: var(--steel); stroke-width: 4; stroke-linecap: round; opacity: 0; }
.sq-side.on { opacity: 1; }
.dot { fill: var(--steel); }
.phase { font-family: var(--display); font-size: var(--t-head); font-weight: 600; min-height: 1.7rem; }
.sub:empty { display: none; }
.sub { font-size: var(--t-small); color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.3rem; }
.big { font-family: var(--display); font-size: 4rem; font-weight: 300; line-height: 1; color: var(--steel); font-variant-numeric: tabular-nums; min-height: 4rem; }
.big.clock { font-size: 4rem; }
.bar { width: min(16rem, 100%); height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--steel); }
.note { width: 100%; display: grid; gap: var(--s3); text-align: left; }
.note label { display: grid; gap: var(--s1); }
.note input { font: inherit; font-size: var(--t-body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-s); padding: var(--s2) var(--s3); min-height: var(--tap); width: 100%; min-width: 0; }
.saved { font-size: var(--t-tiny); color: var(--muted); min-height: 1rem; }
.tap { width: 10rem; height: 10rem; border-radius: 50%; border: 2px solid var(--steel); background: var(--steel-soft); font-family: var(--display); font-size: 3.5rem; font-weight: 300; color: var(--ink); font-variant-numeric: tabular-nums; }
.tap:active { transform: scale(0.97); }
.result { font-size: var(--t-body); min-height: 1.6rem; }

.x { display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); background: none; border: 0; color: var(--muted); padding: 0; }

/* routine page */
.rsteps { margin: 0; padding-left: 1.4rem; display: grid; gap: var(--s1); color: var(--muted); font-size: var(--t-small); }
.rsteps li.now { color: var(--ink); font-weight: 600; }

.rbody { display: grid; gap: var(--s4); }
.rname { font-size: var(--t-head); }

/* ---------- sound settings: a sheet that slides up ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 15; background: rgba(8, 12, 18, 0.45); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; max-height: 86vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); color: var(--ink); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
  padding: var(--s2) max(var(--s4), env(safe-area-inset-right, 0px)) calc(var(--s5) + env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px));
}
.sheet-in { max-width: 40rem; margin: 0 auto; display: grid; gap: var(--s4); }
.sheet-head { position: sticky; top: calc(var(--s2) * -1); z-index: 1; display: flex; align-items: center; justify-content: space-between; background: var(--paper); padding-top: var(--s2); }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s4); }
.psec { display: grid; gap: var(--s3); }

.psec-h .emb svg { width: 1.1rem; height: 1.1rem; }
.psec .row { justify-content: flex-start; }
.pgroup { display: grid; gap: var(--s2); }
.pgroup .row { justify-content: flex-start; }
.vbox { display: grid; gap: var(--s3); }
.voices { display: grid; gap: var(--s2); }
.vbtn { display: grid; grid-template-columns: 1.3rem minmax(0, 1fr) auto; align-items: center; gap: var(--s3); width: 100%; text-align: left; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s2) var(--s3); min-height: 52px; transition: border-color 0.2s, background 0.2s; }
.vbtn .ck { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 1.5px solid var(--muted); }

.vstatus:empty { display: none; }
.devbox { display: grid; gap: var(--s3); padding-left: var(--s3); border-left: 2px solid var(--rule); }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) 3rem; gap: var(--s1) var(--s3); align-items: center; }
.slider .label { grid-column: 1 / -1; }
.slider input { width: 100%; min-width: 0; min-height: var(--tap); accent-color: var(--steel); }
.sval { font-size: var(--t-tiny); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- dim screen: always dark ---------- */
.dim { position: fixed; inset: 0; z-index: 10; background: #05070b; color: #8a7a55; display: grid; place-content: center; justify-items: center; gap: var(--s4); text-align: center;
  padding: max(var(--s5), env(safe-area-inset-top, 0px)) max(var(--s4), env(safe-area-inset-right, 0px)) max(var(--s5), env(safe-area-inset-bottom, 0px)) max(var(--s4), env(safe-area-inset-left, 0px)); }
.dim-big { font-family: var(--display); font-size: var(--t-title); font-weight: 300; max-width: 20ch; min-height: 3rem; }
.dim-sub { font-size: var(--t-head); color: #5c5240; font-variant-numeric: tabular-nums; min-height: 2rem; }
.dim-x { font-size: var(--t-small); background: transparent; color: #5c5240; border: 1px solid #2a2619; border-radius: 999px; padding: 0 var(--s5); min-height: var(--tap); margin-top: var(--s6); }

/* ---------- Read: contents ---------- */
.cover { background: var(--slate); color: var(--on-slate); display: grid; gap: var(--s2); padding: var(--s4) var(--s5); border-radius: var(--r); }

.toc { display: grid; gap: var(--s6); }

.toc-group .gnote { font-size: var(--t-small); color: var(--muted); margin-bottom: var(--s2); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); }
.toc li a { display: grid; grid-template-columns: 1.9rem minmax(0, 1fr) auto; column-gap: var(--s2); align-items: center; min-height: 52px; padding: var(--s2) 0; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); transition: background 0.2s; }
.toc li a:active { background: var(--steel-soft); }
.toc li a:not(:has(.n)) { grid-template-columns: minmax(0, 1fr) auto; }
.toc .n { font-family: var(--display); color: var(--steel); font-size: var(--t-small); font-weight: 600; font-variant-numeric: tabular-nums; }

.readbar { display: grid; gap: var(--s1); margin-bottom: var(--s2); }
.readbar .track { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.readbar .track i { display: block; height: 100%; background: var(--steel); border-radius: 2px; }
.readbar small { font-size: var(--t-tiny); color: var(--muted); }

/* ---------- Read: one page ---------- */
.prose { font-size: var(--fs); line-height: 1.6; display: grid; gap: var(--s4); }
.prose .ch-label { display: block; font-family: var(--body); font-size: var(--t-tiny); font-weight: 600; color: var(--steel); }

.prose .timeline li { padding: 0.4rem 0 0.4rem 1.1rem; position: relative; }
.prose .timeline li::before { content: ""; position: absolute; left: -0.3rem; top: 0.95rem; width: 0.55rem; height: 0.55rem; background: var(--paper); border: 1px solid var(--steel); transform: rotate(45deg); }

/* tables become stacked cards on narrow screens (JS adds .stack and data-label) */
@media (max-width: 36rem) {

/* emblems: one small line drawing per tradition (used once, at the top of a chapter) */

.gloss .letter::before { display: none; }
.search { font: inherit; font-size: var(--t-body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-s); padding: var(--s2) var(--s3); min-height: var(--tap); width: 100%; }

/* page turner (Read pages and practice pages) */
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
.app > .pager { margin-top: calc(var(--s5) * -1); }
.pager a, .pager button { display: grid; gap: 2px; align-content: center; min-height: 64px; padding: var(--s3) var(--s4); border: 1px solid var(--rule); border-radius: var(--r); text-decoration: none; color: var(--ink); background: var(--surface); text-align: left; font: inherit; }

.pager .next .label { color: var(--slate-mark); }
.pager .t { font-family: var(--display); font-size: var(--t-body); font-weight: 600; line-height: 1.25; }
.pager .home { grid-column: 1 / -1; justify-self: center; border: 0; background: none; color: var(--steel); padding: 0 var(--s3); min-height: var(--tap); font-size: var(--t-small); }
@media (max-width: 30rem) { .pager { grid-template-columns: 1fr; } .pager .next { grid-column: 1; } }

/* ---------- My Log ---------- */
.chartbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s3); }
.legend { display: flex; gap: var(--s4); font-size: var(--t-tiny); color: var(--muted); }

.k { width: 0.7rem; height: 0.7rem; border-radius: 50%; display: inline-block; }
.k.before { background: var(--surface); border: 2px solid var(--muted); }
.k.after { background: var(--steel); }
.scaleh { display: flex; justify-content: space-between; font-size: var(--t-tiny); color: var(--muted); padding: 0 6px; }
.crow { display: grid; gap: 6px; padding-top: var(--s3); border-top: 1px solid var(--rule); }
.crow .ctop { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
.crow .cname { font-size: var(--t-small); }
.crow .cname small { color: var(--muted); font-size: var(--t-tiny); }
.crow .cval { font-size: var(--t-small); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.crow .cval.down { color: var(--steel); font-weight: 600; }
.ctrack { position: relative; height: 16px; margin: 0 6px; }
.ctrack::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--rule); border-radius: 1px; }
.ctrack .cline { position: absolute; top: 6px; height: 4px; background: var(--steel); opacity: 0.45; border-radius: 2px; }
.ctrack .cdot { position: absolute; top: 2px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; }
.ctrack .cdot.b { background: var(--surface); border: 2px solid var(--muted); }
.ctrack .cdot.a { background: var(--steel); border: 2px solid var(--surface); }
.log { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
.log td, .log th { text-align: left; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--rule); }
.log tr:last-child td { border-bottom: 0; }
.log th { font-size: var(--t-tiny); color: var(--muted); font-weight: 600; }
.log td.nums { font-variant-numeric: tabular-nums; white-space: nowrap; }
.down { color: var(--steel); }
.filepick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* ---------- welcome (first open) ---------- */
html.locked, html.locked body { overflow: hidden; }
.welcome { position: fixed; inset: 0; z-index: 20; background: var(--slate); color: var(--on-slate); overflow-y: auto; display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + var(--s6)) max(var(--s4), env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + var(--s6)) max(var(--s4), env(safe-area-inset-left, 0px)); }
.w-in { width: 100%; max-width: 25rem; display: grid; gap: var(--s5); justify-items: center; text-align: center; }
.w-mark { width: 4rem; height: 4rem; color: var(--slate-mark); }
.w-mark svg { width: 100%; height: 100%; }
.welcome h1 { font-size: var(--t-title); }
.w-lede { color: var(--on-slate-muted); font-size: var(--t-body); max-width: 22rem; }
.w-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s4); text-align: left; width: 100%; }
.w-list li { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: var(--s3); align-items: start; }
.w-ic { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; color: var(--slate-mark); border: 1px solid color-mix(in srgb, var(--on-slate-muted) 40%, transparent); }
.w-ic svg { width: 1.3rem; height: 1.3rem; }
.w-list b { display: block; font-family: var(--display); font-weight: 600; font-size: var(--t-body); color: var(--on-slate); }
.w-list li > span:last-child > span { color: var(--on-slate-muted); font-size: var(--t-small); line-height: 1.4; }
.w-note { color: var(--on-slate-muted); font-size: var(--t-small); font-style: italic; }
.welcome .go { background: var(--slate-mark); color: var(--slate); border-color: var(--slate-mark); min-width: 12rem; }

/* ---------- small practices and the Watch ---------- */
.wp > .foldbody .wfrom blockquote, .wstage .wfrom blockquote { margin: var(--s2) 0; }
.wshort { font-size: var(--t-body); }
.wp > summary .sit { display: block; }
.wp > summary .nm { display: block; font-size: var(--t-small); color: var(--muted); }
.wstage .saved:empty { display: none; }
.foldbody .subhead { margin-top: var(--s2); }
.lensbox { display: grid; gap: var(--s2); text-align: left; }
.lensq { font-size: var(--t-card); font-weight: 600; line-height: 1.35; }
.lenstag { display: flex; align-items: center; gap: var(--s2); }
.wday { display: flex; align-items: center; gap: var(--s3); color: var(--on-slate-muted); font-size: var(--t-small); }
.wday .emb.tile { background: transparent; color: var(--slate-mark); border-color: color-mix(in srgb, var(--on-slate-muted) 45%, transparent); }
.wwhy > summary { cursor: pointer; color: var(--steel); font-size: var(--t-small); min-height: var(--tap); display: flex; align-items: center; }
.wwhy .foldbody { display: grid; gap: var(--s2); font-size: var(--t-small); color: var(--muted); }
.wtoday { gap: var(--s5); }
.wtoday .grp { display: grid; gap: var(--s2); }
.dayrev { margin-top: var(--s2); }

/* the Watch's screen: slate, like a player, with what's on now in the middle */
.wstage { background: var(--slate); color: var(--on-slate); border-radius: var(--r); padding: var(--s4) var(--s5); display: grid; grid-template-rows: auto 1fr auto; gap: var(--s4); min-height: min(34rem, 62vh); }
.wtop { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.wstage .label { color: var(--slate-mark); }
.wstage .wclock { color: var(--on-slate-muted); font-variant-numeric: tabular-nums; }
.wmid { display: grid; gap: var(--s3); align-content: center; min-width: 0; }
.wtitle { font-size: var(--t-head); line-height: 1.3; }
.wtitle.sm { font-size: var(--t-card); }
.wtext { font-size: 1.125rem; line-height: 1.6; }
.wsub { font-size: var(--t-small); color: var(--on-slate-muted); margin-top: calc(var(--s2) * -1); }
.wquote { margin: 0; border: 0; padding: 0; font-size: 1.3rem; line-height: 1.5; font-style: italic; }
.wstage cite { font-style: normal; font-size: var(--t-tiny); color: var(--on-slate-muted); margin-top: calc(var(--s2) * -1); }
.wgo { display: inline-flex; align-items: center; gap: var(--s1); justify-self: start; min-height: var(--tap); color: var(--slate-mark); text-decoration: none; font-size: var(--t-small); font-weight: 600; }
.wgo .chev { color: var(--slate-mark); opacity: 1; }
.wplan { margin: 0; padding-left: 1.1rem; display: grid; gap: var(--s2); color: color-mix(in srgb, var(--on-slate) 82%, var(--slate)); }
.wplan li::marker { color: var(--slate-mark); }
.worb { width: 10rem; height: 10rem; justify-self: center; }
.worb svg { width: 100%; height: 100%; overflow: visible; }
.worb ~ * { text-align: center; }
.wstage .ring { stroke: color-mix(in srgb, var(--on-slate-muted) 45%, transparent); }
.wstage .orb { fill: var(--slate-mark); opacity: 0.8; }
.wcount { font-size: 3.5rem; font-weight: 300; line-height: 1; color: var(--slate-mark); font-variant-numeric: tabular-nums; }
.wstage .opt { background: transparent; color: var(--on-slate); border-color: color-mix(in srgb, var(--on-slate-muted) 45%, transparent); }
.wstage .opt[aria-pressed="true"] { background: color-mix(in srgb, var(--slate-mark) 25%, transparent); border-color: var(--slate-mark); color: var(--on-slate); }
.wstage .wwhy > summary { color: var(--slate-mark); }
.wstage .wwhy .foldbody { color: var(--on-slate-muted); }
.wstage blockquote { border-left-color: var(--slate-mark); }
.wstage .saved { color: var(--on-slate-muted); }
.wstage .list li { background: transparent; border-color: color-mix(in srgb, var(--on-slate-muted) 35%, transparent); }
.wstage .list li span small { color: var(--slate-mark); }
.wstage .x { color: var(--on-slate-muted); }
.wstage .note input { background: transparent; color: var(--on-slate); border-color: color-mix(in srgb, var(--on-slate-muted) 45%, transparent); }
.wfoot { display: grid; gap: var(--s2); }
.wbar { height: 3px; background: color-mix(in srgb, var(--on-slate-muted) 25%, transparent); border-radius: 2px; overflow: hidden; }
.wbar i { display: block; height: 100%; width: 0; background: var(--slate-mark); }
.wnext { font-size: var(--t-tiny); color: var(--on-slate-muted); }
.app > .wstage + .btnrow { margin-top: calc(var(--s5) * -1); }

/* ---------- motion, skipped when the phone asks for less ---------- */
.app > * { animation: rise 0.38s ease-out backwards; }
.app > :nth-child(2) { animation-delay: 0.04s; } .app > :nth-child(3) { animation-delay: 0.08s; }
.app > :nth-child(4) { animation-delay: 0.12s; } .app > :nth-child(n+5) { animation-delay: 0.16s; }
.icobtn.pop { animation: pop 0.35s ease-out; }
.group.flash > h2 { animation: flash 1.6s ease-out; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: sheetup 0.28s ease-out; }
  .sheet-back { animation: wfade 0.2s ease-out; }
  .welcome { animation: wfade 0.5s ease-out both; }
  .w-in > * { animation: wrise 0.6s ease-out both; }
  .w-in > *:nth-child(1) { animation-delay: 0.1s; }
  .w-in > *:nth-child(2) { animation-delay: 0.25s; }
  .w-in > *:nth-child(3) { animation-delay: 0.4s; }
  .w-in > *:nth-child(4) { animation-delay: 0.55s; }
  .w-in > *:nth-child(n+5) { animation-delay: 0.7s; }
  .welcome.leaving { opacity: 0; transition: opacity 0.35s ease; }
  .wstage.turn .wmid > * { animation: wfade 0.8s ease-out; }
  .wstage.lit { animation: lit 1.6s ease-out; }
  .wbar i { transition: width 1s linear; }
}
@media (prefers-reduced-motion: reduce) {
  .app > *, .tabs a.fresh::before, .icobtn.pop, .tool.lit, .coin.spin { animation: none; }
  .go:active, .opt:active, .pick:active, .linkrow:active, .gtile:active, .pager a:active { transform: none; }
  .stage { transition: none; }
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes pill { from { transform: scaleX(0.4); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
@keyframes pop { 50% { transform: scale(1.15); } }
@keyframes lit { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--steel) 55%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
@keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(1440deg); } }
@keyframes flash { 0%, 40% { color: var(--steel); } 100% { color: inherit; } }
@keyframes sheetup { from { transform: translateY(100%); } }
@keyframes wfade { from { opacity: 0; } }
@keyframes wrise { from { opacity: 0; transform: translateY(10px); } }

<script type="application/json" id="book">{"preface": "<h2>Preface<\/h2>\n<p>In a Masonic lodge the trestleboard is the board where the master lays out the designs for the day’s work. This is a trestleboard of that kind: twenty-four small designs, each borrowed from an old tradition and each built around something you do with your body.<\/p>\n<p>It started with <em>The Kybalion<\/em>. The book claims to pass on ancient Hermetic teaching. It doesn’t: it was published in Chicago in 1908 and belongs to the American New Thought movement, most likely written by William Walker Atkinson. Still, it points back at traditions that are real, and following its threads leads to Freemasonry, alchemy, Kabbalah, Neoplatonism, the Stoics, and the Christian mystics. All of them claim that a person can be changed by practice. This app asks a narrower question: what does each practice actually do, and can you use it this afternoon?<\/p>\n<h2 class=\"second\">How the Practices Are Built<\/h2>\n<ol class=\"built\">\n<li><strong>The method comes first.<\/strong> Every practice tells you what to do before it tells you where the idea came from. The history is still there, after the instructions.<\/li>\n<li><strong>Cues outside you.<\/strong> “When you notice you’re tense” is a weak trigger, because noticing your own inner state is often the hard part. Practices here fire on things you can’t miss: sitting down, standing up, a doorway, a timer.<\/li>\n<li><strong>Any kind of name works.<\/strong> Not everyone can put a feeling into words on the spot. Where a practice asks you to name something, a body word (“hot,” “tight”) or a number does the same job.<\/li>\n<li><strong>Your senses get a say.<\/strong> Anything involving cold, held breath, or close attention to the body comes with an alternative.<\/li>\n<li><strong>Outside tools belong in the method.<\/strong> Timers, sticky notes, and a drafts folder hold what memory and willpower don’t hold well. Using them is the practice, not a shortcut around it.<\/li>\n<li><strong>Few at once, and rotation is fine.<\/strong> Start with four. When one goes stale, swap it for another in the same group. A practice becomes useful when your body does it before you remember to.<\/li>\n<\/ol>\n<div class=\"rules\">\n<p><strong>The filter.<\/strong> Supernatural claims are set aside, neither affirmed nor attacked. Each practice page says what the practice probably does to attention, breath, or the body, and says plainly how much research stands behind that: a lot, a little, or none. Even good research only shows what tends to happen across a group of people, not what will happen for you. Your own log is the better test.<\/p>\n<p><strong>The symbols stay.<\/strong> The images and old names make a practice memorable and give it weight, and that weight is what gets you to do it. Hold the symbol fully while knowing it is a symbol.<\/p>\n<p><strong>Nothing is for sale.<\/strong> Every source here is free or public domain. You don’t need a higher degree to use any of this.<\/p>\n<\/div>\n<div class=\"stop\">\n<h3>Past the tipping point<\/h3>\n<p>These practices live in the space before overload, while you can still choose what to do. Past that point, the work is simpler: less input. A darker, quieter room, earplugs or headphones, steady pressure, no questions. Keep a small kit within reach (earplugs, sunglasses, something for your hands), and come back to the board afterward.<\/p>\n<\/div>", "sections": [{"n": "I", "name": "Starting", "desc": "For the start of the day or of a task. These build a base before anything asks something of you.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 46 H56\"/><path d=\"M18 46 A14 14 0 0 1 46 46\"/><path d=\"M32 16 V22\"/><path d=\"M14 26 L18 30\"/><path d=\"M50 26 L46 30\"/><path d=\"M20 54 H44\"/><\/g><\/svg>", "ids": [1, 2, 3], "key": "starting", "hint": "Can't get going"}, {"n": "II", "name": "Foggy", "desc": "Low energy is hard to think your way out of. These use movement and a sharp start to wake the body up first.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 22 C18 18 24 26 32 22 S46 18 54 22\"/><path d=\"M10 34 C18 30 24 38 32 34 S46 30 54 34\"/><path d=\"M10 46 C18 42 24 50 32 46 S46 42 54 46\"/><\/g><\/svg>", "ids": [4, 5, 6], "key": "foggy", "hint": "Heavy, slow, unfocused"}, {"n": "III", "name": "Too Much", "desc": "Overload is a capacity problem, and often a sensory one. These cut the input first, then sort what's left.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 12 H54 L38 32 V50 L26 56 V32 Z\"/><\/g><\/svg>", "ids": [7, 8, 9], "key": "too-much", "hint": "Too much coming in"}, {"n": "IV", "name": "Heated", "desc": "The few seconds between something happening and your reaction. Everything here buys time.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 6 C34 18 48 24 48 38 A16 16 0 0 1 16 38 C16 30 20 26 24 22 C24 30 28 32 30 32 C28 22 30 14 32 6 Z\"/><path d=\"M32 54 A7 7 0 0 1 25 46 C25 41 29 39 32 34 C35 39 39 41 39 46 A7 7 0 0 1 32 54 Z\"/><\/g><\/svg>", "ids": [10, 11, 12], "key": "heated", "hint": "About to react"}, {"n": "V", "name": "Looping", "desc": "Rumination, and the stories about yourself that grow out of it. These step back from the thought instead of arguing with it.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M48 22 A20 20 0 1 0 52 36\"/><path d=\"M50 10 L48 22 L36 20\"/><\/g><\/svg>", "ids": [13, 14, 15], "key": "looping", "hint": "Same thoughts circling"}, {"n": "VI", "name": "Deciding", "desc": "For decisions that stall. Each one makes the choice concrete, then closes it.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M32 58 V36\"/><path d=\"M32 36 L16 16\"/><path d=\"M32 36 L48 16\"/><path d=\"M10 18 L16 16 L18 22\"/><path d=\"M46 22 L48 16 L54 18\"/><\/g><\/svg>", "ids": [16, 17, 18], "key": "deciding", "hint": "Stuck on a choice"}, {"n": "VII", "name": "People", "desc": "Staying steady in friction, getting the time you need to think, and knowing where your obligations end.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"22\" cy=\"22\" r=\"7\"/><circle cx=\"43\" cy=\"22\" r=\"7\"/><path d=\"M8 52 C8 40 14 34 22 34 S36 40 36 52\"/><path d=\"M34 37 C37 35 40 34 43 34 C51 34 57 40 57 52\"/><\/g><\/svg>", "ids": [19, 20, 21], "key": "people", "hint": "Friction with someone"}, {"n": "VIII", "name": "Winding Down", "desc": "Clean breaks between parts of the day, and a clean stop at the end of it. Switching is often harder than either task on its own.", "svg": "<svg aria-hidden=\"true\" viewBox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M42 10 A22 22 0 1 0 54 40 A18 18 0 0 1 42 10 Z\"/><path d=\"M50 14 V20\"/><path d=\"M47 17 H53\"/><\/g><\/svg>", "ids": [22, 23, 24], "key": "winding-down", "hint": "Switching or ending the day"}], "entries": {"1": {"n": 1, "name": "The Foundation Stone", "trad": "Freemasonry", "when": "You sit down to start the day or a block of work. Sitting down is the cue, so there’s nothing to remember.", "image": "A squared block set into the ground, true on every face.", "method": "Feet flat, hands flat on the table. Press down with about a fifth of your strength for 10 seconds. Breathe normally. Standing up? Press your palms into a wall instead.", "why": "Steady pressure through hands and feet feeds proprioception, your sense of your body’s position and effort. Many people find that kind of firm input settling, and it gives a short, clear signal that the work has begun. Nobody has studied this exact practice.", "hole": "George Washington laid the cornerstone of the U.S. Capitol in 1793 in a full Masonic ceremony, wearing an apron. Nobody knows where that stone is now. Searches, including one with metal detectors, have never turned it up.", "source": "At a Masonic cornerstone ceremony, the first stone is laid in the northeast corner and tested with the square, level, and plumb. Every later course is measured from it."}, "2": {"n": 2, "name": "The Ashlar’s Blueprint", "trad": "Freemasonry", "when": "You can’t get yourself to start, especially on something that begins from nothing.", "image": "A faint grid laid over a rough stone, showing where the first strike lands.", "method": "Trace a square on the table with one finger and tap its center. Write the very first physical action on a sticky note, small enough to finish in under two minutes (“open the file,” “write the title”). Stick it where you’ll see it. Start a 2-minute timer and do only that. If you keep going after it rings, good. If you stop, you still started.", "why": "Naming a concrete first step is close to what researchers call an implementation intention: a plan in the form “when X happens, I will do Y.” Many studies find these plans help people follow through, though newer and larger studies find a smaller effect than the early ones did. The note holds the step so your working memory doesn’t have to, and the timer makes the time visible.", "hole": "Medieval stonemasons cut a personal mark into each stone they finished, probably so their work could be counted for pay. Those masons’ marks are still visible in old cathedrals and castles, and historians use them to track which crews worked where.", "source": "The trestleboard is where the master draws the designs before any stone is cut. The rough ashlar is shaped only after the plan exists."}, "3": {"n": 3, "name": "Vessel Expansion", "trad": "Lurianic Kabbalah", "when": "You have a calm moment. This one is training, not rescue.", "image": "A glass vessel softened in the kiln and slowly widened, so it holds more once it cools.", "method": "<p>Breathe along with something outside you instead of watching your breath: the pacer below, a slow song, or walking (in for 4 steps, out for 5). About 5 seconds in, 5 to 6 out, for 2 to 5 minutes. If paying attention to your breath makes you more anxious, stop and use a practice that doesn’t involve breathing, like The Foundation Stone.<\/p>", "why": "Breathing near six breaths a minute raises heart rate variability, a measure of how flexibly the nervous system shifts between activation and rest. Practiced regularly while calm, it’s one of the better-supported ways to recover faster under load, though most studies are small.", "hole": "A 2001 study in the <em>British Medical Journal<\/em> found that saying the rosary in Latin, and reciting certain yoga mantras, both slowed people’s breathing to almost exactly six breaths a minute. Two unrelated traditions landed on the same rhythm.", "source": "In Lurianic Kabbalah the <em>kelim<\/em> are the vessels that receive divine light. A vessel’s capacity sets how much it can hold before it breaks (see The Shattering of the Vessels)."}, "4": {"n": 4, "name": "The Common Gavel", "trad": "Freemasonry · Alchemy", "when": "Focus drops and your body feels heavy.", "image": "A hammer taking the corners off a rough block, one strike per rep.", "method": "Pick your number now, so there’s nothing to decide later: for example, 10 pushups (wall pushups count) or 20 squats. When focus drops, do that number, then start the next task before you sit back down.", "why": "Brief exercise raises heart rate, blood flow, and arousal. Studies of short bursts of exercise find small short-term gains in attention and self-control. The lift fades, so use it right away.", "hole": "The gavel has a partner. The Entered Apprentice’s other working tool is the twenty-four-inch gauge, which the ritual uses to divide the day into three equal parts: eight hours for service and devotion, eight for work, eight for rest and sleep. A daily schedule, handed over as a ruler.", "source": "In the Entered Apprentice degree, the common gavel breaks the rough corners off the stone, explained as divesting the mind of “all the vices and superfluities of life.” Alchemy’s parallel is <em>calcination<\/em>, heat that burns off whatever isn’t needed."}, "5": {"n": 5, "name": "The Plumb Line", "trad": "Freemasonry", "when": "You stand up from your desk or seat. Standing is the cue, because a slump is often invisible from the inside.", "image": "A plumb bob hanging from the crown of your head, straight down the spine.", "method": "Each time you stand up, stack ears over shoulders over hips, knees soft, and take three slow breaths through the nose. If standing still feels wrong, rock heel to toe or bounce lightly on your heels instead. Moving counts.", "why": "An upright frame makes breathing easier and tends to raise alertness, though research on posture and mood is mixed and the effects are small. Rhythmic movement like rocking is one of the oldest ways people settle themselves. Don’t lock your knees while standing still; it can make you lightheaded.", "hole": "The Masonic plumb comes straight out of Amos 7:8: <blockquote>“Behold, I will set a plumbline in the midst of my people Israel.”<\/blockquote> In the prophet it’s a test the people fail. In the lodge it became a personal standard you carry yourself.", "source": "The plumb tests whether a wall stands true to vertical. In the Fellowcraft degree it stands for rectitude: walking upright before God and man."}, "6": {"n": 6, "name": "The Cloud of Forgetting", "trad": "Christian mysticism", "when": "You’re stalled because you keep thinking about the whole task instead of doing the next piece.", "image": "Everything you were turning over sinking behind a cloud, leaving one word in front of you.", "method": "Pick one short word: “now,” “this,” “go.” Breathe in. On the exhale, say the word, count down 5-4-3-2-1, and do the smallest physical piece of the task. If you want a jolt first, pick what your senses like: cold water on the face, a cold drink, a minute outside, or one loud song.", "why": "Cold water on the face sets off part of the diving reflex, which actually slows the heart; therapists use it to calm strong emotion, not to wake people up. What likely helps here is the sudden change of sensation, which breaks the stall. The word and the countdown separate doing from planning, the same idea as The Ashlar’s Blueprint. Nobody has studied either as a way to get started.", "hole": "The anonymous author opens the book by asking that it go only to readers committed to contemplation, and that they read it all the way through instead of in pieces, so no part is taken out of context. Fair warning to anyone reading this page on its own.", "source": "<em>The Cloud of Unknowing<\/em>, an anonymous 14th-century English text, tells the contemplative to put a “cloud of forgetting” between themselves and every other thought, and to hold a single short word, since “the shorter it is the better.”"}, "7": {"n": 7, "name": "Tzimtzum", "trad": "Lurianic Kabbalah", "when": "Too much is coming in at once: noise, light, people, messages.", "image": "Light drawing back to a point, leaving a cool, empty space in the middle of your chest.", "method": "Cut input first. Close your eyes or fix them on one plain spot. Put in earplugs or headphones if you have them. Then breathe out long and slow through pursed lips, and let the next breath come on its own. Three rounds. No holding.", "why": "When overload is sensory, the fastest fix is less input. Heart rate dips on every out-breath, so long exhales slow it overall, and the quiet gives you room to choose what to deal with first. Cutting input is common sense more than research; the long-exhale part has some research behind it.", "hole": "Isaac Luria, the 16th-century teacher behind this idea, wrote almost nothing down. He taught in Safed for about two years and died in 1572, around age 38. Most of what is known about his system comes from his student Hayyim Vital. Vital’s main book, <em>Etz Chaim<\/em>, passed around in handwritten copies for close to two centuries and was first printed in 1782.", "source": "Luria taught that the Infinite, <em>Ein Sof<\/em>, withdrew itself to leave an empty space in which a finite world could exist. Creation begins with contraction."}, "8": {"n": 8, "name": "The Shattering of the Vessels", "trad": "Lurianic Kabbalah", "when": "A plan has fallen apart without warning.", "image": "A rigid clay jar cracking under light, its pieces gathered into something wider.", "method": "Rub your palms together for 5 seconds. Cup them over your closed eyes without pressing, 10 to 20 seconds. Then write two lines: what changed, and the new plan for the next hour. Rough is fine. If others are affected, tell them the new plan.", "why": "Covering the eyes shuts out what you see for a moment; that this calms you is a reasonable guess, not a studied effect. Putting the change into words (affect labeling) tends to reduce its emotional charge in lab studies. A sudden change often hurts most because of the open question it leaves, and a written next step closes that question fast.", "hole": "The scholar Gershom Scholem argued that the image of broken vessels and scattered sparks spread so quickly because Jewish communities were still absorbing the 1492 expulsion from Spain. A myth about a broken world gave a broken world a meaning. Later scholars have pushed back on how tight that link is.", "source": "In Luria’s account, the first vessels couldn’t contain the light poured into them and broke. Sparks scattered, and the work of the world is gathering them back (<em>tikkun<\/em>; see Raising the Sparks). The breaking is part of the story, not a failure of it."}, "9": {"n": 9, "name": "The Law of Containment", "trad": "Hermeticism", "when": "Many tasks are competing for your attention.", "image": "Flying debris freezing in midair and dropping into a box with a heavy lid.", "method": "Draw a thick square on a sticky note and write the three things that matter most inside it. Put it where you can’t miss it: the edge of the screen, the back of your phone. Everything else goes on one list in one place. Pick one fixed time today to look at that list.", "why": "Writing open tasks down takes them out of working memory. In one set of experiments, Masicampo and Baumeister (2011) found that making a specific plan for unfinished goals cut the intrusive thoughts those goals cause. The box stays visible because out of sight is often out of mind.", "hole": "The Kybalion is signed “Three Initiates,” who were never named. It was published by the Yogi Publication Society, a Chicago press closely tied to Atkinson, the same one that put out his books under the pen name “Yogi Ramacharaka.”", "source": "The Kybalion’s first principle: <blockquote>“THE ALL is MIND; the Universe is Mental.”<\/blockquote> The usable part is that you set the frame you work inside."}, "10": {"n": 10, "name": "The Tyler’s Sword", "trad": "Freemasonry · Stoicism", "when": "A reaction is about to fire.", "image": "A guard at your mind’s door, sword across the frame, asking the visitor’s name.", "method": "Freeze for 3 seconds. Unclench your jaw, let the tongue drop, shift your weight back onto your heels. Then name the visitor in whatever form comes: a feeling word (“anger”), a body word (“hot,” “tight,” “buzzing”), or a number from 1 to 5. Then decide whether it gets in.", "why": "The pause breaks the automatic link between trigger and response. In brain-imaging studies, naming an emotion quiets the amygdala, the part of the brain that sounds the alarm. Those studies used emotion words; body words and numbers are a reasonable stand-in but haven’t been tested the same way.", "hole": "The usual explanation for the word “tyler” is the tiler, the worker who closes up a building by laying its roof. Nobody can see in once the tiles are on. The word “cowan,” for the outsider the Tyler keeps out, comes from Scots, where it meant a dry-stone builder who never learned the trade properly.", "source": "The Tyler guards the lodge door with a drawn sword. Epictetus, a Stoic teacher of the first century AD, gives the same post to the mind. He tells his students to stop a vivid impression at the door and say, in effect: wait a moment, let me see what you are and what you stand for, let me test you (<em>Discourses<\/em> 2.18)."}, "11": {"n": 11, "name": "The Law of Neutralization", "trad": "Hermeticism · Rhythm", "when": "Frustration is climbing and you have a minute.", "image": "Stepping off the swinging weight onto the fixed point it hangs from.", "method": "Box breathing, traced with a finger. Draw a square on any surface: up one side breathing in for 4, across the top holding for 4, down breathing out for 4, across the bottom holding for 4. Three or four rounds. If the holds feel tight, shorten them to 2 or use The Inner Statue instead.", "why": "Slow, paced breathing shifts the body toward its rest branch. Counting gives the mind a task, and tracing moves your focus out to the fingertip. A 2023 Stanford study (Balban and colleagues: 108 people, five minutes a day for a month) found box breathing helped mood, and the cyclic sigh in The Inner Statue helped a little more. That is one study, and a small one.", "hole": "Versions of box breathing are taught in military and police training as “tactical breathing,” as a way to steady the hands and voice under pressure. The Kybalion’s pendulum and the firing range ended up at the same square.", "source": "The Kybalion’s Principle of Rhythm says everything swings like a pendulum. Its “Law of Neutralization” is to rise above the swing and let it pass underneath you."}, "12": {"n": 12, "name": "Gevurah’s Restraint", "trad": "Kabbalah", "when": "You’re about to say, send, or do something you can’t take back.", "image": "An iron gate dropping between the impulse and the act.", "method": "For messages, set one rule: a heated reply never gets written in the reply box. Write it in a notes app or drafts folder instead, and don’t send it until a fixed later time (an hour, or the next morning). Schedule-send works too. In person: press your tongue to the roof of your mouth, palms together, and count down slowly from 10.", "why": "Urges tend to rise, peak, and fall within minutes. A delay with something to do during it lets the peak pass before you act; addiction research calls this “urge surfing.” Friction built into your setup holds better than resisting in the moment.", "hole": "Several sefirot take their names from one verse, 1 Chronicles 29:11: <blockquote>“Thine, O LORD, is the greatness, and the power, and the glory, and the victory, and the majesty.”<\/blockquote> In Hebrew those are <em>gedullah<\/em>, <em>gevurah<\/em>, <em>tiferet<\/em>, <em>netzach<\/em>, and <em>hod<\/em>. It’s the same verse behind the closing line many Christians add to the Lord’s Prayer.", "source": "<em>Gevurah<\/em> (“strength,” also called <em>Din<\/em>, judgment) is the sefirah of restraint. (The sefirot are ten qualities of God in Kabbalah, drawn as a diagram called the Tree of Life.) On the Tree it balances <em>Chesed<\/em>, lovingkindness. Without restraint, even generosity has no shape."}, "13": {"n": 13, "name": "The Inner Statue", "trad": "Neoplatonism", "when": "Frustration is turning into a story about who you are: “I always…,” “I’m the kind of person who…”", "image": "A crust cracking off a statue. The crust is dirt on the marble, not the marble.", "method": "Two quick inhales through the nose (the second tops off the first), then one long, slow exhale through the mouth. On the exhale, shake your hands out hard and drop your shoulders. Two or three rounds.", "why": "This is the physiological, or cyclic, sigh. In the 2023 Stanford study (see The Law of Neutralization), five minutes a day of it lifted mood more than the other breathing methods or mindfulness meditation did. That is one study of about a hundred people over a month. The second inhale is thought to reopen collapsed air sacs in the lungs, and the long exhale slows the heart.", "hole": "For a man who told people to chisel their statue, Plotinus refused to have his own likeness made. His student Porphyry writes that he seemed ashamed of having a body, and that a painter had to sneak into lectures and draw him from memory.", "source": "Plotinus, a philosopher of the third century AD, in <em>Ennead<\/em> I.6: <blockquote>“Never cease chiselling your statue.”<\/blockquote> You don’t become good by adding to yourself. You cut away what isn’t you, the way a sculptor clears marble until the figure shows."}, "14": {"n": 14, "name": "The Apophatic Cut", "trad": "Mysticism · <em>Via negativa<\/em>", "when": "The same thoughts keep circling.", "image": "A chisel working in the dark. The form is found by what gets removed.", "method": "Each time the thought comes back, tap thumb to index finger and say silently, “Not now. At [time].” Write the thought as one line on a list. At that time, give the list 10 minutes. If something still matters, make one plan for it.", "why": "A loop often keeps running because it’s afraid of being forgotten. A written place and a set time answer that. The practice combines cognitive defusion (treating a thought as an event you notice, not an order you follow) with scheduled “worry time,” which has some research support for cutting rumination.", "hole": "“Pseudo” is in the name for a reason. The author wrote as Dionysius the Areopagite, the Athenian Paul converts in Acts 17:34. The church accepted that for roughly a thousand years. Renaissance scholars like Lorenzo Valla and Erasmus doubted it, and in 1895 two scholars, Hugo Koch and Joseph Stiglmayr, settled the question: the writings borrow passages from Proclus, a philosopher who died in AD 485.", "source": "Apophatic theology, set out by Pseudo-Dionysius around 500 AD, approaches God only by saying what God is <em>not<\/em>, stripping away every image until nothing false remains."}, "15": {"n": 15, "name": "Mental Transmutation", "trad": "Hermeticism · Polarity", "when": "You’re stuck in one charged state and want out of it.", "image": "A lead ball in your fist turning to light as your fingers open.", "method": "Clench your fist hard for 5 seconds. Open it wide and look up at the highest point in the room. Then pick the physical opposite of what your body is doing: still to walking, hunched to open, fast to slow, loud to quiet. Do one small thing from that side.", "why": "Tensing and releasing makes the release easier to feel, the same principle as Kenosis. Physical opposites are easier to find than emotional ones, and acting on the body tends to pull the feeling along. This is close to “opposite action,” a skill from Dialectical Behavior Therapy (DBT, a well-studied skills-based therapy). DBT as a whole has good support; this one skill on its own has been studied much less.", "hole": "The idea is far older than Hermes. Around 500 BC, the Greek philosopher Heraclitus wrote that the road up and the road down are one and the same, and that cold things grow warm and warm things cool. The Kybalion’s Principle of Polarity owes a lot to that old idea, retold in New Thought vocabulary.", "source": "The Principle of Polarity says opposites are <blockquote>“identical in nature, but different in degree.”<\/blockquote> Hot and cold sit on one scale. The Kybalion’s method is to move along it by attending to the opposite pole."}, "16": {"n": 16, "name": "Distillation", "trad": "Alchemy", "when": "You have too many options and keep circling them.", "image": "Muddy water boiling, clear drops collecting in a clean glass.", "method": "List the options on one sheet. Before looking closely, pick one rule to cut by: cheapest, closest, fastest, or first available. Apply it and keep the winner. If two are still tied, flip a coin and notice whether you feel relief or disappointment at the result. That reaction is your answer. If no rule fits, cross out half the list fast, without weighing, circle one of what’s left, and tear it off.", "why": "The research on “choice overload” is real but inconsistent. What helps more reliably is shrinking the set and making the decision feel closed. A rule picked in advance is probably as quick as a guess but feels more earned, so the re-checking stops. That last part is a reasonable idea, not a research finding.", "hole": "“Alcohol” comes from the Arabic <em>al-kuḥl<\/em>, the fine black powder used as eyeliner. Alchemists stretched it to mean the finest, most refined essence of anything, and eventually the essence of wine. Distilled drinks are called “spirits” from a related alchemical habit of calling a vapor a spirit.", "source": "Distillation heats a mixture until the volatile essence rises and condenses apart from the residue. To the alchemists it was the separation of the subtle from the gross."}, "17": {"n": 17, "name": "The Principle of Cause", "trad": "Hermeticism · Cause and Effect", "when": "You’re stuck because you’re afraid of choosing wrong.", "image": "The cue ball, not the scattering rack.", "method": "Draw a dot labeled A (now) and a dot labeled B (decided). Connect them with one firm line. Under the line, write the single action that starts it. Then write a review date: “Good enough for now. I’ll check again on ___.” If it helps, say out loud, “I am the cause.”", "why": "The effect is mostly framing. It moves attention from the outcome, which you can’t control, to the action, which you can. The review date is simply true, and a choice you can revisit is less frightening to make.", "hole": "The sharpest version of this idea came from someone with almost no control at all. Epictetus was born a slave, was lame in one leg, and taught the dichotomy of control (what is up to you, what isn’t) after being freed. His lectures survive only because a student wrote them down.", "source": "<blockquote>“Every Cause has its Effect; every Effect has its Cause.”<\/blockquote> The Kybalion says most people are carried along as effects of other wills and circumstances, while the master acts as a cause."}, "18": {"n": 18, "name": "The Middle Pillar", "trad": "Kabbalah · Golden Dawn reading", "when": "You’re torn between two extremes, such as total control or letting everything go.", "image": "Standing in the space between two pillars, one light and one dark.", "method": "Say both extremes out loud. Put your hands palm-down on your thighs and slide them up until they meet at the center of your chest. Then write a middle option with numbers in it: “For the next 7 days, I’ll do ___, this much, at this time.”", "why": "Mostly symbolic. The gesture cues you to stop thinking in either/or. “Find the middle” is too vague to act on; numbers and an end date turn the third option into an experiment instead of a permanent identity.", "hole": "Lodge pillars usually carry two globes on top, one of the earth and one of the heavens. Those are a Masonic addition. 1 Kings 7 describes the tops of Boaz and Jachin as bowl-shaped capitals wrapped in chainwork, pomegranates, and lily work.", "source": "The Tree of Life has three columns: Severity, Mercy, and the Middle Pillar of balance running through <em>Tiferet<\/em> (harmony). Masonry has its own pair, Boaz and Jachin, the pillars at the porch of Solomon’s Temple. The Golden Dawn, a Victorian magical order, later turned the Middle Pillar into a named exercise."}, "19": {"n": 19, "name": "The Trowel", "trad": "Freemasonry", "when": "A conversation is heating up.", "image": "Mortar filling the gaps between rough stones.", "method": "Press thumb and forefinger together out of sight. Lower your voice, slow down, and ask one real question before your next point. Eye contact is optional; looking at the table is fine. If you need time to think, use a set phrase: “I want to answer this properly. Can I come back to you in an hour?” For hard topics, it’s fine to ask to continue in writing.", "why": "People tend to match each other’s pace and volume without meaning to, so slowing down usually slows the other person too. Fast spoken conflict rewards whoever answers quickest, not whoever is right. Asking for time, or for writing, moves the conversation to ground where you can say what you mean.", "hole": "The trowel has a dark side in English. In Shakespeare’s <em>As You Like It<\/em>, Celia mocks an overdone line as “laid on with a trowel,” meaning spread on far too thick. The phrase later came to mean heavy flattery. The same tool that binds the stones can also bury them.", "source": "In the Master Mason degree, the trowel is used “to spread the cement of brotherly love and affection,” binding separate stones into one structure."}, "20": {"n": 20, "name": "The Principle of Correspondence", "trad": "Hermeticism · Correspondence", "when": "Someone is acting unreasonably and it feels personal.", "image": "Zooming out from street level to a satellite view of a weather system. A storm is weather, not an insult.", "method": "Let your gaze go wide to the whole room rather than the person’s face. Then think of two or three possible reasons for the behavior, instead of settling on one. If it matters, ask them. If what they did is actually unfair, you’re allowed to say so.", "why": "Guessing what’s happening inside someone else is tiring, and misreads run in both directions between people whose minds work differently (the double empathy problem). Holding several guesses is a form of cognitive reappraisal (deliberately looking at a situation another way), one of the best-studied ways of handling emotions. The wide gaze is often said to calm you down, but there is little research behind that part. Reframing a situation isn’t the same as excusing it.", "hole": "The oldest surviving versions of the Emerald Tablet, a short alchemical text, are in Arabic, from around the 8th or 9th century, not ancient Egypt. Isaac Newton made his own English translation of it, and wrote a commentary, in among his alchemical notebooks.", "source": "<blockquote>“As above, so below; as below, so above.”<\/blockquote> The Kybalion’s version of a line from the Emerald Tablet. Patterns repeat at every scale."}, "21": {"n": 21, "name": "The Cable-Tow", "trad": "Freemasonry", "when": "Someone is asking more than you can give, or you’re about to say yes just to avoid friction.", "image": "A rope of measured length. Past its end, you are not bound.", "method": "<p>Extend one arm to its full reach and notice where it ends. Bring the hand back to your chest. Then use a script you wrote in advance. The default is delay:<\/p>\n<p>“Let me check and get back to you by ___.”<\/p>\n<p>Later, one of: “Here’s what I can do: ___.” or “I can’t take that on.”<\/p>", "why": "Mostly symbolic, plus a pause and a prepared answer. A fast answer is the hardest kind to give honestly, so the script makes delay the default. A limit is part of an obligation, not a failure of it. You are enough at the length you have.", "hole": "Some older Masonic writers gave the cable-tow a literal length, often said to be about three miles: how far a brother was expected to travel to attend lodge. The modern reading, the reach of your ability, is a lot more forgiving.", "source": "A Mason’s obligation to answer a call for help holds “if within the length of my cable-tow,” traditionally read as within the reach of your ability."}, "22": {"n": 22, "name": "Solve et Coagula", "trad": "Alchemy", "when": "You’re switching from one part of the day to another.", "image": "Vapor condensing and settling into the shape of a new vessel.", "method": "For switches you know are coming, set a warning timer: one at 10 minutes, one at 2. Before you leave the task, write a one-line parking note: where you stopped and what comes next. At the doorway, put both palms on the frame and press for 3 seconds. Breathe out. Step through on the inhale.", "why": "Warnings make a switch predictable, and the parking note lets you stop without fear of losing the thread. Research on “attention residue” (part of your mind staying on the task you just left) found, in one set of studies, that a quick written note on where to pick up reduced that drag. Some memory studies also find that walking through a doorway acts as an “event boundary” that files away what came before, though not every study has found it.", "hole": "The most famous place the phrase appears is the arms of the Baphomet drawn by the French occultist Éliphas Lévi in 1856: SOLVE on one forearm, COAGULA on the other. A diagram of alchemical balance that later got cast as a devil.", "source": "<em>Solve et coagula<\/em>, “dissolve and coagulate,” is alchemy’s basic cycle: break a substance down, then let it set in a new form. One phase has to end cleanly for the next to take shape."}, "23": {"n": 23, "name": "Raising the Sparks", "trad": "Lurianic Kabbalah · Pythagoreanism", "when": "You brush your teeth at night. Hooking it onto something you already do every night is what makes it happen.", "image": "Gathering sparks from a dark floor and returning them to one fire.", "method": "Keep a small notebook by the sink or the bed. Take 60 seconds. Write one thing you finished today (anything counts, including eating a real meal) and cross it out. Write one line for anything unfinished, and when you’ll come back to it. Close the notebook and say, “The work is set down.”", "why": "Unfinished tasks tend to pull at attention, and a written plan for them seems to quiet that pull (see The Law of Containment). The famous version of this idea, the Zeigarnik effect, says we <em>remember<\/em> unfinished tasks better; a 2025 review of nearly a century of studies found that part doesn’t hold up, though people do reliably want to get back to unfinished tasks. One small sleep-lab study (Scullin and colleagues, 2018, 57 people) found that writing a short to-do list at bedtime helped people fall asleep faster.", "hole": "“Tikkun olam,” repairing the world, is now mostly used to mean social justice. The phrase is much older than Luria: it appears in the Mishnah, the early collection of Jewish law (around AD 200), as a legal term, for rules adjusted “for the sake of repairing the world.” Luria made it cosmic, and the 20th century made it political.", "source": "After the shattering (see The Shattering of the Vessels), sparks of light lie scattered, and each right action lifts one back toward its source. The Pythagorean <em>Golden Verses<\/em> keep a nightly review for the same hour: <blockquote>“Never suffer sleep to close thy eyelids, after thy going to bed, till thou hast examined by thy reason all thy actions of the day. Wherein have I done amiss? What have I done? What have I omitted that I ought to have done?”<\/blockquote>"}, "24": {"n": 24, "name": "Kenosis", "trad": "Christian mysticism", "when": "You’re lying down to sleep and your mind is still running.", "image": "Armor unbuckled one piece at a time until nothing is left to carry.", "method": "<p>Lie on your back. Tense your feet for 5 seconds, release for 10. Move upward: calves, thighs, hands, shoulders, face. Let each release finish before moving on.<\/p>\n<p>If tensing doesn’t land, try steady weight instead: a weighted or heavy blanket. If your mind keeps running, give it something low-stakes to hold: brown noise, or an audiobook you’ve heard before.<\/p>", "why": "Progressive muscle relaxation has good evidence for lowering anxiety and shortening time to sleep. One Swedish trial found weighted blankets improved sleep in adults with insomnia alongside depression, bipolar disorder, anxiety, or ADHD. Evidence for background noise is thin; keep it if it works.", "hole": "The physician Edmund Jacobson built the original version in the 1920s. It covered dozens of muscle groups and took months of training to learn. The ten-minute version used today is a shortcut later therapists made from it.", "source": "<em>Kenosis<\/em>, “self-emptying,” comes from Philippians 2:7, where Christ “emptied himself.” The mystics read it as setting down self-will. Here it means setting down the role of the one who does things, for the night."}}, "threads": "<p>The traditions in the Field Guide weren’t sealed off from each other. They borrowed, copied, and misread one another for two thousand years. Here are the main lines that run through these pages.<\/p>\n<ul class=\"threads\">\n<li><span class=\"path\">Plotinus → Pseudo-Dionysius → The Cloud of Unknowing<\/span><p>Plotinus’s One, beyond every description, became the Christian God approached by negation. The <em>Cloud<\/em> author also made an English version of Dionysius’s <em>Mystical Theology<\/em>. The Cloud of Forgetting, The Inner Statue, and The Apophatic Cut are one family.<\/p><\/li>\n<li><span class=\"path\">Corpus Hermeticum → Florence, 1463 → Casaubon, 1614 → The Kybalion, 1908<\/span><p>Cosimo de’ Medici had Marsilio Ficino set aside his Plato translation to translate the newly found Hermetic texts first, because they were thought to be older than Moses. In 1614 Isaac Casaubon showed from their Greek that they were written in the early Christian era. The Kybalion borrowed the prestige of the name three centuries after it had been dated.<\/p><\/li>\n<li><span class=\"path\">Kabbalah → Christian Cabala → Golden Dawn → The Middle Pillar<\/span><p>Renaissance Christian scholars took up Kabbalah as a hidde
