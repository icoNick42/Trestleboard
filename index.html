<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trestleboard</title>
<meta name="description" content="Twenty-four practices from old traditions, a field guide to where they came from, and a log of what works for you.">
<meta name="theme-color" content="#2b3541" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2832" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trestleboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { display: flex; align-items: center; gap: 0.6rem; }
.brand svg { width: 1.6rem; height: 1.6rem; color: var(--brass); flex: none; }
.brand span { font-family: var(--display); font-size: 1.15rem; }
.chip-btn { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; background: var(--surface); border: 1px solid var(--rule); padding: 0.45rem 0.7rem; cursor: pointer; }
.chip-btn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }

/* Home */
.hello h1 { font-size: clamp(1.9rem, 7vw, 2.4rem); }
.hello p { color: var(--muted); margin-top: 0.4rem; }
.starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.group { display: grid; gap: 0.5rem; }
.group h2 { font-size: 1.2rem; display: flex; gap: 0.6rem; align-items: baseline; }
.group h2 .n { font-family: var(--mono); font-size: 0.8rem; color: var(--brass); }
.pick { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 0.6rem; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--rule); padding: 0.75rem 0.85rem; cursor: pointer; min-height: 3.4rem; }
.pick:hover { border-color: var(--brass); }
.pick .no { font-family: var(--mono); font-size: 0.8rem; color: var(--brass); font-variant-numeric: tabular-nums; }
.pick .sit { display: block; }
.pick .nm { display: block; font-size: 0.85rem; color: var(--muted); }
.pick .arrow { color: var(--brass); font-family: var(--mono); }
.starters .pick { grid-template-columns: 2rem minmax(0, 1fr); }
.starters .pick .arrow { display: none; }
@media (max-width: 520px) { .starters { grid-template-columns: 1fr; } }
.tipping { background: var(--brass-soft); padding: 0.9rem 1rem; display: grid; gap: 0.3rem; font-size: 0.97rem; }
.tipping strong { font-weight: 600; }

/* Practice */
.back { justify-self: start; background: none; border: 0; padding: 0.3rem 0; cursor: pointer; font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brass); }
.p-head { display: grid; gap: 0.35rem; }
.p-head .num { font-family: var(--mono); color: var(--brass); font-size: 0.9rem; }
.p-head h1 { font-size: clamp(1.9rem, 7vw, 2.5rem); }
.p-meta { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; }
.when { font-size: 1.05rem; }
.tool { background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--brass); padding: 1.25rem 1rem; display: grid; gap: 1rem; justify-items: center; text-align: center; }
.tool > * { max-width: 100%; }
.text { display: grid; gap: 1rem; }
.text dl { margin: 0; display: grid; gap: 0.9rem; }
.text dt { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.text dd { margin: 0.2rem 0 0; }
.text .method dd { font-size: 1.05rem; }
.text .from dd { color: var(--muted); font-size: 0.95rem; }

/* Tool parts */
.stage { width: 13rem; height: 13rem; display: grid; place-items: center; position: relative; }
.stage svg { width: 100%; height: 100%; overflow: visible; }
.ring { fill: none; stroke: var(--rule); stroke-width: 1; }
.orb { fill: var(--brass); opacity: 0.85; }
.sq { fill: none; stroke: var(--rule); stroke-width: 2.5; }
.sq-side { fill: none; stroke: var(--brass); stroke-width: 4; stroke-linecap: round; opacity: 0; }
.sq-side.on { opacity: 1; }
.dot { fill: var(--brass); }
.phase { font-family: var(--display); font-size: 1.6rem; min-height: 2.1rem; }
.sub { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.3rem; }
.big { font-family: var(--display); font-size: 4.5rem; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; min-height: 4.5rem; }
.bar { width: min(16rem, 100%); height: 4px; background: var(--rule); }
.bar i { display: block; height: 100%; width: 0; background: var(--brass); }
.go { font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; background: var(--brass); color: var(--on-brass); border: 1px solid var(--brass); padding: 0.8rem 1.6rem; cursor: pointer; min-width: 9rem; }
.go.ghost { background: transparent; color: var(--brass); }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
.opt { font-family: var(--mono); font-size: 0.78rem; background: var(--bg); border: 1px solid var(--rule); padding: 0.45rem 0.75rem; cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); }
.note { width: 100%; display: grid; gap: 0.7rem; text-align: left; }
.note label { display: grid; gap: 0.25rem; }
.note input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); padding: 0.6rem 0.7rem; width: 100%; min-width: 0; }
.saved { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); min-height: 1rem; }
.tap { width: 10rem; height: 10rem; border-radius: 50%; border: 2px solid var(--brass); background: var(--brass-soft); font-family: var(--display); font-size: 3.5rem; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.tap:active { transform: scale(0.97); }
.chips { display: grid; gap: 0.6rem; width: 100%; }
.chips .grp { display: grid; gap: 0.35rem; }
.result { font-size: 1.05rem; min-height: 1.6rem; }
.script { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.6rem; align-items: center; text-align: left; background: var(--bg); border: 1px solid var(--rule); padding: 0.7rem 0.8rem; }
.script p { font-style: italic; }
.list { width: 100%; list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; text-align: left; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.6rem; align-items: center; background: var(--bg); border: 1px solid var(--rule); padding: 0.5rem 0.7rem; }
.list li span small { display: block; font-family: var(--mono); font-size: 0.72rem; color: var(--brass); }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-family: var(--mono); padding: 0.2rem 0.4rem; }
.coin { width: 8rem; height: 8rem; border-radius: 50%; border: 3px double var(--brass); display: grid; place-items: center; font-family: var(--display); font-size: 1.1rem; padding: 0.6rem; background: var(--brass-soft); }
.coin.spin { animation: spin 0.9s ease-out; }
@keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(1440deg); } }
@media (prefers-reduced-motion: reduce) { .coin.spin { animation: none; } }

/* Rating + log */
.rate { display: grid; gap: 0.7rem; border-top: 1px solid var(--rule); padding-top: 1.25rem; }
.rate h2 { font-size: 1.2rem; }
.rate .scale { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 0.6rem; align-items: center; }
.rate .row { justify-content: flex-start; }
.rate .opt { min-width: 2.6rem; }
.log { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.log td, .log th { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--rule); }
.log th { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.log td.nums { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.down { color: var(--brass); }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); }
.empty { color: var(--muted); font-size: 0.95rem; }

/* Sound panel */
.topwrap { display: grid; gap: 0.75rem; }
.panel { background: var(--surface); border: 1px solid var(--rule); padding: 1rem; display: grid; gap: 1rem; }
.pgroup { display: grid; gap: 0.4rem; }
.pgroup .row { justify-content: flex-start; }
.phelp { color: var(--muted); font-size: 0.9rem; }

/* Dim screen: always dark, whatever the theme */
.dim { position: fixed; inset: 0; z-index: 10; background: #05070b; color: #8a7a55; display: grid; place-content: center; justify-items: center; gap: 1.2rem; text-align: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dim-big { font-family: var(--display); font-size: clamp(1.8rem, 8vw, 2.6rem); max-width: 20ch; min-height: 3rem; }
.dim-sub { font-family: var(--mono); font-size: 1.4rem; color: #5c5240; font-variant-numeric: tabular-nums; min-height: 2rem; }
.dim-x { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; background: transparent; color: #5c5240; border: 1px solid #2a2619; padding: 0.7rem 1.2rem; cursor: pointer; margin-top: 2rem; }

.slider { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 3rem; gap: 0.6rem; align-items: center; }
.slider input { width: 100%; min-width: 0; accent-color: var(--brass); }
.sval { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
.vrow select { font: inherit; font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); padding: 0.5rem; min-width: 0; width: 100%; }
@media (max-width: 480px) { .slider { grid-template-columns: minmax(0, 1fr) 3rem; } .slider .label { grid-column: 1 / -1; } }

/* v4: cards, check-in, routines, calendar, plan, chart */
.card { background: var(--surface); border: 1px solid var(--rule); padding: 1rem; display: grid; gap: 0.75rem; }
.card h2 { font-size: 1.25rem; }
.card.today { border-top: 3px solid var(--brass); }
.quote { margin: 0; font-style: italic; font-size: 1.12rem; display: grid; gap: 0.4rem; }
.quote cite { font-style: normal; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--muted); }
.row.left { justify-content: flex-start; }
.row.between { justify-content: space-between; align-items: center; }
.checkin { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.9rem; }
.big-opt { font-family: var(--body); font-size: 0.98rem; letter-spacing: 0; padding: 0.5rem 0.85rem; background: var(--surface); }
.group.flash > h2 { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { color: var(--brass); } 100% { color: inherit; } }
.group { scroll-margin-top: 1rem; }
.routines { display: grid; gap: 0.5rem; }
.pick.routine { grid-template-columns: minmax(0, 1fr) auto; }
.star { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.04em; background: var(--surface); border: 1px solid var(--rule); color: var(--muted); padding: 0.4rem 0.7rem; cursor: pointer; }
.star[aria-pressed="true"] { color: var(--brass); border-color: var(--brass); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.3rem; max-width: 22rem; }
.cal .dow { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); text-align: center; }
.cal .day { aspect-ratio: 1; display: grid; place-items: center; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); border: 1px solid transparent; font-variant-numeric: tabular-nums; max-width: 100%; }
.cal .day.on { background: var(--brass); color: var(--on-brass); border-radius: 50%; }
.cal .day.today { border-color: var(--brass); border-radius: 50%; }
.pdots { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.pd { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 1px solid var(--rule); background: var(--bg); }
.pd.on { background: var(--brass); border-color: var(--brass); }
.pd.now { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--brass); }
.rsteps { margin: 0; padding-left: 1.4rem; display: grid; gap: 0.3rem; color: var(--muted); }
.rsteps li.now { color: var(--ink); font-weight: 600; }
.rsteps li.done { text-decoration: line-through; text-decoration-color: var(--rule); }
.rsteps.plan li.now { font-weight: 400; color: var(--ink); }
.rbody { display: grid; gap: 1.1rem; }
.rname { font-size: 1.7rem; }
.clock { font-size: 4rem; }
.more summary { cursor: pointer; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brass); padding: 0.3rem 0; }
.more[open] summary { margin-bottom: 0.5rem; }
.chartbox { background: var(--surface); border: 1px solid var(--rule); padding: 0.8rem; display: grid; gap: 0.4rem; }
.legend { display: flex; gap: 1rem; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
.k { width: 0.7rem; height: 0.7rem; border-radius: 50%; display: inline-block; }
.k.before { background: var(--surface); border: 2px solid var(--muted); }
.k.after { background: var(--brass); }
.dumb { width: 100%; height: auto; display: block; }
.dumb .grid { stroke: var(--rule); stroke-width: 1; }
.dumb .axis { fill: var(--muted); font-family: var(--mono); font-size: 8px; }
.dumb .rowlab { fill: var(--ink); font-family: var(--body); font-size: 10px; }
.dumb .conn { stroke: var(--brass); stroke-width: 2; opacity: 0.5; }
.dumb .pt-before { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
.dumb .pt-after { fill: var(--brass); stroke: var(--surface); stroke-width: 2; }
.dumb .hitbox { fill: transparent; }
.dumb .hit:hover .hitbox { fill: var(--brass-soft); }

/* ===== Trestleboard app: slate-and-blue theme =====
   Fonts are the phone's own (Optima for titles, Iowan Old Style for reading on iPhone),
   so nothing has to download and the app looks the same with no internet. */
:root {
  --paper: #e7ebef;
  --surface: #f4f6f8;
  --ink: #1b232c;
  --muted: #535f6d;
  --rule: #c3ccd6;
  --steel: #33607f;
  --steel-soft: #d6e1eb;
  --on-steel: #ffffff;
  --slate: #2b3541;
  --on-slate: #e8edf2;
  --on-slate-muted: #a9b5c2;
  --slate-mark: #93b4d2;
  --display: "Optima", "Candara", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --body: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --fs: 1.0625rem;
  --tabs-h: 3.6rem;
  /* names the practice tools were written against */
  --bg: var(--paper);
  --brass: var(--steel);
  --brass-soft: var(--steel-soft);
  --on-brass: var(--on-steel);
  --mono: var(--body);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171d; --surface: #19212a; --ink: #dce3ea; --muted: #94a2b1; --rule: #2a3542;
    --steel: #8fb3d4; --steel-soft: #1d2a37; --on-steel: #12171d; --slate: #1f2832;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171d; --surface: #19212a; --ink: #dce3ea; --muted: #94a2b1; --rule: #2a3542;
  --steel: #8fb3d4; --steel-soft: #1d2a37; --on-steel: #12171d; --slate: #1f2832;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--slate); }
body {
  margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 1.0625rem; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
body[data-size="s"] { --fs: 0.97rem; }
body[data-size="l"] { --fs: 1.22rem; }
[hidden] { display: none !important; }
a { color: var(--steel); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
.label { font-family: var(--body); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ev { font-family: var(--body); font-size: 0.75rem; color: var(--steel); letter-spacing: 0.05em; white-space: nowrap; font-weight: 600; }

/* ----- shell: top bar, content, bottom tabs ----- */
.top {
  position: sticky; top: 0; z-index: 6;
  background: var(--slate); color: var(--on-slate);
  padding: calc(env(safe-area-inset-top, 0px) + 0.55rem) max(16px, env(safe-area-inset-right, 0px)) 0.55rem max(16px, env(safe-area-inset-left, 0px));
}
.top-in { max-width: 40rem; margin: 0 auto; display: flex; align-items: center; gap: 0.6rem; min-height: 2.4rem; }
.top .brand { display: flex; align-items: center; gap: 0.55rem; color: var(--on-slate); text-decoration: none; min-width: 0; }
.top .brand svg { width: 1.5rem; height: 1.5rem; color: var(--slate-mark); flex: none; }
.top .brand span { font-family: var(--display); font-size: 1.15rem; letter-spacing: 0.08em; text-transform: uppercase; }
.top .where { flex: 1; min-width: 0; font-size: 0.88rem; color: var(--on-slate-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .where b { color: var(--on-slate); font-weight: 600; }
.top .spacer { flex: 1; }
.tb { background: transparent; color: var(--on-slate); border: 1px solid color-mix(in srgb, var(--on-slate-muted) 45%, transparent); border-radius: 4px; padding: 0.35rem 0.7rem; font-size: 0.82rem; min-height: 2.2rem; white-space: nowrap; }
.tb[aria-pressed="true"], .tb[aria-expanded="true"] { border-color: var(--slate-mark); color: var(--slate-mark); }
.tb.backlink { border: 0; padding-left: 0; color: var(--slate-mark); font-size: 0.95rem; }
.size { display: flex; flex: none; }
.size .tb { border-radius: 0; margin-left: -1px; padding-inline: 0.55rem; font-family: var(--display); }
.size .tb:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.size .tb:last-child { border-radius: 0 4px 4px 0; }
.size .tb[aria-pressed="true"] { background: color-mix(in srgb, var(--slate-mark) 22%, transparent); }
.progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--slate-mark); }
.panelwrap:empty { display: none; }
.panelwrap .panel { color: var(--ink); }

.app {
  max-width: 40rem; margin: 0 auto; display: grid; gap: 1.5rem;
  padding: 1.25rem max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 2.5rem) max(16px, env(safe-area-inset-left, 0px));
}
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-top: 1px solid var(--rule);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.tabs a { display: grid; justify-items: center; align-content: center; gap: 0.15rem; height: var(--tabs-h); color: var(--muted); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.tabs a svg { width: 1.45rem; height: 1.45rem; }
.tabs a[aria-current="page"] { color: var(--steel); }

/* ----- shared pieces ----- */
.back { justify-self: start; background: none; border: 0; padding: 0.2rem 0; color: var(--steel); font-size: 0.95rem; }
.card { background: var(--surface); border: 1px solid var(--rule); padding: 1rem; display: grid; gap: 0.75rem; }
.card h2 { font-size: 1.25rem; }
.group { display: grid; gap: 0.5rem; scroll-margin-top: 4.5rem; }
.group > h2 { font-size: 1.2rem; display: flex; gap: 0.6rem; align-items: center; }
.group > h2 .n { font-family: var(--display); font-size: 0.9rem; color: var(--steel); min-width: 1.6rem; }
.group > h2 svg { width: 1.6rem; height: 1.6rem; color: var(--steel); flex: none; }
.group > .gdesc { color: var(--muted); font-size: 0.92rem; margin-top: -0.25rem; }
.empty { color: var(--muted); font-size: 0.95rem; }

/* today card: a slate tablet, like the Field Guide's title page */
.today {
  background: var(--slate); color: var(--on-slate); border: 0;
  outline: 1px solid color-mix(in srgb, var(--on-slate-muted) 35%, transparent); outline-offset: -7px;
  padding: 1.5rem 1.25rem 1.3rem; gap: 0.9rem;
}
.today .label { color: var(--slate-mark); }
.card.today { border: 0; }
.today .quote { border-left: 0; padding-left: 0; margin: 0; font-style: italic; font-size: 1.18rem; line-height: 1.45; display: grid; gap: 0.5rem; }
.today .quote cite { font-style: normal; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--on-slate-muted); }
.today .go { background: var(--slate-mark); color: var(--slate); border-color: var(--slate-mark); }
.today .opt { background: transparent; color: var(--on-slate); border-color: color-mix(in srgb, var(--on-slate-muted) 55%, transparent); }

.hello h1 { font-size: clamp(1.7rem, 7vw, 2.2rem); }
.hello p { color: var(--muted); margin-top: 0.35rem; }

/* ----- practice page ----- */
.p-head { display: grid; gap: 0.35rem; }
.p-head .num { font-family: var(--display); color: var(--steel); font-size: 1rem; }
.p-head h1 { font-size: clamp(1.9rem, 7vw, 2.5rem); }
.p-meta { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; align-items: center; }
.when { font-size: 1.08rem; }
.methodbox { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--steel); padding: 1rem; display: grid; gap: 0.7rem; }
.methodbox .mtext { display: grid; gap: 0.6rem; font-size: 1.05rem; }
.apptip { font-size: 0.92rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 0.6rem; }
.fields { margin: 0; display: grid; gap: 1rem; }
.fields dt { margin-bottom: 0.2rem; }
.fields dd { margin: 0; display: grid; gap: 0.5rem; }
.fields .img dd { font-style: italic; }
.fields .hole { background: var(--steel-soft); padding: 0.85rem 0.95rem; }
.fields .src dd { color: var(--muted); font-size: 0.97rem; }
blockquote { margin: 0; padding-left: 0.9rem; border-left: 2px solid var(--steel); font-style: italic; }
.links { display: grid; gap: 0.4rem; }
.linkrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.6rem; background: var(--surface); border: 1px solid var(--rule); padding: 0.7rem 0.85rem; text-decoration: none; color: var(--ink); }
.linkrow small { display: block; color: var(--muted); font-size: 0.82rem; }
.linkrow .arrow { color: var(--steel); }

/* ----- read tab ----- */
.toc { display: grid; gap: 1.8rem; }
.toc-group { display: grid; gap: 0.3rem; }
.toc-group h2 { font-size: 0.85rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--steel); font-weight: 600; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); }
.toc-group .gnote { font-size: 0.88rem; color: var(--muted); padding: 0.4rem 0 0.2rem; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; }
.toc li a { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 0.1rem 0.6rem; align-items: baseline; padding: 0.6rem 0; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); }
.toc .n { font-family: var(--display); color: var(--steel); }
.toc .t { font-weight: 600; }
.toc .d { grid-column: 2; color: var(--muted); font-size: 0.86rem; font-style: italic; }
.toc .seen .n::after { content: " ✓"; font-size: 0.7rem; color: var(--muted); }
.cover { background: var(--slate); color: var(--on-slate); display: grid; gap: 0.6rem; padding: 1.4rem 1.25rem; outline: 1px solid color-mix(in srgb, var(--on-slate-muted) 35%, transparent); outline-offset: -7px; }
.cover h1 { font-size: 1.5rem; letter-spacing: 0.04em; }
.cover p { color: var(--on-slate-muted); font-size: 0.95rem; }
.cover .row { justify-content: flex-start; }
.cover .go { background: var(--slate-mark); color: var(--slate); border-color: var(--slate-mark); }

/* ----- reading pages ----- */
.prose { font-size: var(--fs); line-height: 1.65; display: grid; gap: 1rem; }
.prose .ch-label { display: block; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--steel); font-weight: 600; margin-bottom: 0.4rem; font-family: var(--body); }
.prose > h1 { font-size: clamp(1.75rem, 7vw, 2.4rem); letter-spacing: 0.02em; padding-bottom: 0.9rem; border-bottom: 1px solid var(--rule); }
.prose .dateline { color: var(--muted); font-style: italic; margin-top: -0.3rem; }
.prose section { display: grid; gap: 1rem; }
.prose h2 { font-size: 1.22rem; letter-spacing: 0.03em; margin-top: 1.4rem; }
.prose h3 { font-size: 1.12rem; margin-top: 1rem; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.45rem; }
.prose li::marker { color: var(--steel); }
.prose strong { font-weight: 600; }
.prose .lede::first-letter { font-family: var(--display); color: var(--steel); float: left; font-size: 3.2em; line-height: 0.85; padding: 0.06em 0.12em 0 0; }
.prose .glance { background: var(--slate); color: var(--on-slate); padding: 1rem 1.15rem; font-size: 0.92em; line-height: 1.55; display: grid; gap: 0.3rem; }
.prose .glance::before { content: "At a glance"; font-family: var(--display); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--slate-mark); }
.prose .glance strong { color: var(--slate-mark); }
.prose .timeline ul { list-style: none; padding: 0; gap: 0; border-left: 1px solid var(--steel); margin-left: 0.3rem; }
.prose .timeline li { padding: 0.4rem 0 0.4rem 1.1rem; position: relative; }
.prose .timeline li::before { content: ""; position: absolute; left: -0.3rem; top: 0.95rem; width: 0.55rem; height: 0.55rem; background: var(--paper); border: 1px solid var(--steel); transform: rotate(45deg); }
.prose .timeline strong { display: block; color: var(--steel); font-family: var(--display); letter-spacing: 0.05em; font-size: 0.9em; }
.prose .tablewrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 0.88em; line-height: 1.45; }
.prose .wide table { min-width: 40rem; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--rule); }
.prose thead th { background: var(--slate); color: var(--on-slate); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; border-bottom: 0; }
.prose td:first-child { font-weight: 600; color: var(--steel); }
.prose tr:last-child td { border-bottom: 0; }
/* pieces carried over from the Trestleboard book */
.prose .rules, .prose .casefile { display: grid; gap: 0.75rem; padding: 1.1rem 1.2rem; background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--steel); }
.prose .stop { display: grid; gap: 0.6rem; padding: 1.1rem 1.2rem; background: var(--steel-soft); }
.prose .built { display: grid; gap: 0.6rem; }
.prose .threads { list-style: none; padding: 0; gap: 1.1rem; }
.prose .threads li { display: grid; gap: 0.3rem; }
.prose .threads .path { font-size: 0.8rem; letter-spacing: 0.04em; color: var(--steel); font-weight: 600; }
.prose .pairs { display: grid; gap: 0.8rem; margin: 0; }
.prose .pairs > div { display: grid; gap: 0.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--rule); }
.prose .pairs > div:last-child { border-bottom: 0; }
.prose .pairs dt { font-weight: 600; }
.prose .pairs dd { margin: 0; }
.prose .pairs .ex { display: block; color: var(--muted); font-size: 0.94em; margin-top: 0.25rem; }
.prose .cliches { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
.prose .cliches li { background: var(--surface); border: 1px solid var(--rule); padding: 0.55rem 0.8rem; font-style: italic; }
.prose .cliches li span { display: block; font-style: normal; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.2rem; }
@media (max-width: 30rem) { .prose .cliches { grid-template-columns: 1fr; } }
.prose .shelf { list-style: none; padding: 0; gap: 0.9rem; }
.prose .shelf li span { display: block; color: var(--muted); font-size: 0.95em; }
.prose .ev { font-size: 0.8em; }
.gloss { display: grid; gap: 0.85rem; }
.gloss p strong { font-weight: 600; }
.gloss .from { color: var(--muted); font-size: 0.85em; }
.search { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); padding: 0.65rem 0.75rem; width: 100%; border-radius: 4px; }
.ending { text-align: center; display: grid; gap: 0.5rem; justify-items: center; padding-top: 1rem; }
.ending svg { width: 2.4rem; height: 2.4rem; color: var(--steel); }
.ending h2 { font-size: 1.25rem; }
.ending p { color: var(--muted); max-width: 30rem; font-size: 0.95rem; }

.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
.pager a { display: grid; gap: 0.2rem; padding: 0.85rem 0.95rem; border: 1px solid var(--rule); text-decoration: none; color: var(--ink); background: var(--surface); }
.pager a.next { text-align: right; grid-column: 2; background: var(--slate); color: var(--on-slate); border-color: var(--slate); }
.pager a.next .label { color: var(--slate-mark); }
.pager .t { font-family: var(--display); font-size: 1.02rem; line-height: 1.25; }
.pager .home { grid-column: 1 / -1; justify-self: center; border: 0; background: none; color: var(--steel); padding: 0.4rem; }
@media (max-width: 30rem) { .pager { grid-template-columns: 1fr; } .pager a.next { grid-column: 1; } }

/* ----- my log ----- */
.btnrow { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.filepick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.msg { font-size: 0.9rem; color: var(--muted); }
.msg:empty { display: none; }
.top .ttl { font-family: var(--display); font-size: 1.2rem; letter-spacing: 0.06em; flex: 1; }

.top { display: block; }

</style>
</head>

<script type="application/json" id="book">{"preface": "<h2>Preface<\/h2>\n<p>In a Masonic lodge the trestleboard is the board where the master lays out the designs for the day’s work. This is a trestleboard of that kind: twenty-four small designs, each borrowed from an old tradition and each built around something you do with your body.<\/p>\n<p>It started with <em>The Kybalion<\/em>. The book claims to pass on ancient Hermetic teaching. It doesn’t: it was published in Chicago in 1908 and belongs to the American New Thought movement, most likely written by William Walker Atkinson. Still, it points back at traditions that are real, and following its threads leads to Freemasonry, alchemy, Kabbalah, Neoplatonism, the Stoics, and the Christian mystics. All of them claim that a person can be changed by practice. This book asks a narrower question: what does each practice actually do, and can you use it this afternoon?<\/p>\n<h2 class=\"second\">How This Book Is Built<\/h2>\n<ol class=\"built\">\n<li><strong>The method comes first.<\/strong> Every entry tells you what to do before it tells you where the idea came from. The history is still there, after the instructions.<\/li>\n<li><strong>Cues outside you.<\/strong> “When you notice you’re tense” is a weak trigger, because noticing your own inner state is often the hard part. Practices here fire on things you can’t miss: sitting down, standing up, a doorway, a timer.<\/li>\n<li><strong>Any kind of name works.<\/strong> Not everyone can put a feeling into words on the spot. Where a practice asks you to name something, a body word (“hot,” “tight”) or a number does the same job.<\/li>\n<li><strong>Your senses get a say.<\/strong> Anything involving cold, held breath, or close attention to the body comes with an alternative.<\/li>\n<li><strong>Outside tools belong in the method.<\/strong> Timers, sticky notes, and a drafts folder hold what memory and willpower don’t hold well. Using them is the practice, not a shortcut around it.<\/li>\n<li><strong>Few at once, and rotation is fine.<\/strong> Start with four. When one goes stale, swap it for another in the same section.<\/li>\n<\/ol>\n<div class=\"rules\">\n<p><strong>The filter.<\/strong> Supernatural claims are set aside, neither affirmed nor attacked. Each entry says what the practice does to attention, breath, or the body, and marks how good the evidence is for the <em>method<\/em>: <span class=\"ev\"><b>●●●<\/b><\/span> supported by solid research, <span class=\"ev\"><b>●●○<\/b><\/span> plausible with some evidence, <span class=\"ev\"><b>●○○<\/b><\/span> symbolic, working through meaning and attention.<\/p>\n<p><strong>The symbols stay.<\/strong> The images and old names make a practice memorable and give it weight, and that weight is what gets you to do it. Hold the symbol fully while knowing it is a symbol.<\/p>\n<p><strong>Nothing is for sale.<\/strong> Every source here is free or public domain. You don’t need a higher degree to use any of this.<\/p>\n<\/div>\n<div class=\"stop\">\n<h3>Past the tipping point<\/h3>\n<p>These practices live in the space before overload, while you can still choose what to do. Past that point, the work is simpler: less input. A darker, quieter room, earplugs or headphones, steady pressure, no questions. Keep a small kit within reach (earplugs, sunglasses, something for your hands), and come back to the board afterward.<\/p>\n<\/div>", "sections": [{"n": "I", "name": "Opening the Work", "desc": "For the start of the day or a task. These build a base before anything asks you for something.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-linejoin=\"round\" stroke-width=\"2.5\"><path d=\"M32 10 L54 21 L32 32 L10 21 Z\"><\/path><path d=\"M10 21 V45 L32 56 L54 45 V21\"><\/path><path d=\"M32 32 V56\"><\/path><\/g><\/svg>", "ids": [1, 2, 3]}, {"n": "II", "name": "Clearing the Fog", "desc": "Lethargy is hard to think your way out of. These use movement and a sharp start to raise your level of arousal.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.5\"><path d=\"M14 8 H50\"><\/path><path d=\"M32 8 V38\"><\/path><path d=\"M24 38 H40 L32 56 Z\"><\/path><\/g><\/svg>", "ids": [4, 5, 6]}, {"n": "III", "name": "When Everything Arrives at Once", "desc": "Overload is a capacity problem, and often a sensory one. These cut input first, then sort.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><circle cx=\"32\" cy=\"32\" r=\"22\"><\/circle><circle cx=\"32\" cy=\"32\" r=\"11\" stroke-dasharray=\"3 4\"><\/circle><\/g><circle cx=\"32\" cy=\"32\" fill=\"currentColor\" r=\"3\"><\/circle><\/svg>", "ids": [7, 8, 9]}, {"n": "IV", "name": "The Hot Moment", "desc": "The few seconds between something happening and your reaction. Everything here buys time.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.5\"><path d=\"M32 6 L36 14 V44 H28 V14 Z\"><\/path><path d=\"M20 44 H44\"><\/path><path d=\"M32 44 V56\"><\/path><circle cx=\"32\" cy=\"58\" r=\"2\"><\/circle><\/g><\/svg>", "ids": [10, 11, 12]}, {"n": "V", "name": "The Loop", "desc": "Rumination, and the stories about yourself that grow out of it. These step back from the thought instead of arguing with it.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2.5\"><path d=\"M32 32 m0 -4 a4 4 0 1 1 -4 4 a8 8 0 1 1 8 8 a12 12 0 1 1 -12 -12 a16 16 0 1 1 16 16\"><\/path><path d=\"M50 10 L14 54\"><\/path><\/g><\/svg>", "ids": [13, 14, 15]}, {"n": "VI", "name": "Choosing", "desc": "For decisions that stall. The common thread is making a choice concrete and closed.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-linejoin=\"round\" stroke-width=\"2.5\"><path d=\"M8 56 H56\"><\/path><path d=\"M8 10 H56\"><\/path><rect height=\"42\" width=\"8\" x=\"11\" y=\"14\"><\/rect><rect height=\"42\" width=\"8\" x=\"45\" y=\"14\"><\/rect><rect fill=\"currentColor\" fill-opacity=\"0.25\" height=\"42\" width=\"8\" x=\"28\" y=\"14\"><\/rect><\/g><\/svg>", "ids": [16, 17, 18]}, {"n": "VII", "name": "Other People", "desc": "Staying steady in friction, getting the time you need to think, and knowing where your obligations end.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.5\"><path d=\"M10 40 L32 14 L54 40 Z\"><\/path><path d=\"M32 40 V48\"><\/path><rect height=\"12\" rx=\"2\" width=\"8\" x=\"28\" y=\"48\"><\/rect><\/g><\/svg>", "ids": [19, 20, 21]}, {"n": "VIII", "name": "Closing the Day", "desc": "Boundaries between parts of the day, and a clean stop at the end of it. Switching is often harder than either task on its own.", "svg": "<svg aria-hidden=\"true\" viewbox=\"0 0 64 64\"><g fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.5\"><path d=\"M14 56 V20 A18 18 0 0 1 50 20 V56\"><\/path><path d=\"M6 56 H58\"><\/path><path d=\"M22 56 A10 10 0 0 1 42 56\"><\/path><\/g><\/svg>", "ids": [22, 23, 24]}], "entries": {"1": {"n": 1, "name": "The Foundation Stone", "trad": "Freemasonry", "ev": 2, "when": "You sit down to start the day or a block of work. Sitting down is the cue, so there’s nothing to remember.", "image": "A squared block set into the ground, true on every face.", "method": "Feet flat, hands flat on the table. Press down with about a fifth of your strength for 10 seconds. Breathe normally. Standing up? Press your palms into a wall instead.", "why": "Steady pressure through hands and feet feeds proprioception, your sense of your body’s position and effort. Many people find that kind of firm input settling, and it gives a short, clear signal that the work has begun.", "hole": "George Washington laid the cornerstone of the U.S. Capitol in 1793 in a full Masonic ceremony, wearing an apron. Nobody knows where that stone is now. Searches, including one with metal detectors, have never turned it up.", "source": "At a Masonic cornerstone ceremony, the first stone is laid in the northeast corner and tested with the square, level, and plumb. Every later course is measured from it."}, "2": {"n": 2, "name": "The Ashlar’s Blueprint", "trad": "Freemasonry", "ev": 3, "when": "You can’t get yourself to start, especially on something that begins from nothing.", "image": "A faint grid laid over a rough stone, showing where the first strike lands.", "method": "Trace a square on the table with one finger and tap its center. Write the very first physical action on a sticky note, small enough to finish in under two minutes (“open the file,” “write the title”). Stick it where you’ll see it. Start a 2-minute timer and do only that. If you keep going after it rings, good. If you stop, you still started.", "why": "Naming a concrete first step is a form of implementation intention (“when X, I will do Y”), one of the more reliable findings on getting past the friction of starting. The note holds the step so your working memory doesn’t have to, and the timer makes the time visible.", "hole": "Medieval stonemasons cut a personal mark into each stone they finished, often so they could be paid by the piece. Those masons’ marks are still visible in old cathedrals and castles, and historians use them to track which crews worked where.", "source": "The trestleboard is where the master draws the designs before any stone is cut. The rough ashlar is shaped only after the plan exists."}, "3": {"n": 3, "name": "Vessel Expansion", "trad": "Lurianic Kabbalah", "ev": 3, "when": "You have a calm moment. This one is training, not rescue.", "image": "A glass vessel softened in the kiln and slowly widened, so it holds more once it cools.", "method": "<p>Breathe along with something outside you instead of watching your breath: the pacer below, a slow song, or walking (in for 4 steps, out for 5). About 5 seconds in, 5 to 6 out, for 2 to 5 minutes. If focusing on breath makes you more anxious, stop and try entry 11 instead.<\/p>", "why": "Breathing near six breaths a minute raises heart rate variability, a measure of how flexibly the nervous system shifts between activation and rest. Practiced regularly while calm, it’s one of the better-supported ways to recover faster under load.", "hole": "A 2001 study in the <em>British Medical Journal<\/em> found that saying the rosary in Latin, and reciting certain yoga mantras, both slowed people’s breathing to almost exactly six breaths a minute. Two unrelated traditions landed on the same rhythm.", "source": "In Lurianic Kabbalah the <em>kelim<\/em> are the vessels that receive divine light. A vessel’s capacity sets how much it can hold before it breaks (see 8)."}, "4": {"n": 4, "name": "The Common Gavel", "trad": "Freemasonry · Alchemy", "ev": 3, "when": "Focus drops and your body feels heavy.", "image": "A hammer taking the corners off a rough block, one strike per rep.", "method": "Pick your number now, so there’s nothing to decide later: for example, 10 pushups (wall pushups count) or 20 squats. When focus drops, do that number, then start the next task before you sit back down.", "why": "Brief exercise raises heart rate, blood flow, and arousal. Studies find small to moderate short-term gains in attention and impulse control. The lift fades, so use it right away.", "hole": "The gavel has a partner. The Entered Apprentice’s other working tool is the twenty-four-inch gauge, which the ritual uses to divide the day into three equal parts: eight hours for service and devotion, eight for work, eight for rest and sleep. A daily schedule, handed over as a ruler.", "source": "In the Entered Apprentice degree, the common gavel breaks the rough corners off the stone, explained as divesting the mind of “all the vices and superfluities of life.” Alchemy’s parallel is <em>calcination<\/em>, heat that burns off whatever isn’t needed."}, "5": {"n": 5, "name": "The Plumb Line", "trad": "Freemasonry", "ev": 2, "when": "You stand up from your desk or seat. Standing is the cue, because a slump is often invisible from the inside.", "image": "A plumb bob hanging from the crown of your head, straight down the spine.", "method": "Each time you stand up, stack ears over shoulders over hips, knees soft, and take three slow breaths through the nose. If standing still feels wrong, rock heel to toe or bounce lightly on your heels instead. Moving counts.", "why": "An upright frame makes breathing easier and tends to raise alertness, though research on posture and mood is mixed and the effects are small. Rhythmic movement like rocking is one of the oldest ways people settle themselves. Don’t lock your knees while standing still; it can make you lightheaded.", "hole": "The Masonic plumb comes straight out of Amos 7:8: <blockquote>“Behold, I will set a plumbline in the midst of my people Israel.”<\/blockquote> In the prophet it’s a test the people fail. In the lodge it became a personal standard you carry yourself.", "source": "The plumb tests whether a wall stands true to vertical. In the Fellowcraft degree it stands for rectitude: walking upright before God and man."}, "6": {"n": 6, "name": "The Cloud of Forgetting", "trad": "Christian mysticism", "ev": 2, "when": "You’re stalled because you keep thinking about the whole task instead of doing the next piece.", "image": "Everything you were turning over sinking behind a cloud, leaving one word in front of you.", "method": "Pick one short word: “now,” “this,” “go.” Breathe in. On the exhale, say the word, count down 5-4-3-2-1, and do the smallest physical piece of the task. If you want a jolt first, pick what your senses like: cold water on the face, a cold drink, a minute outside, or one loud song.", "why": "Cold water on the face sets off part of the diving reflex, giving a quick jolt of alertness. The word and the countdown separate doing from planning, the same lever as entry 2.", "hole": "The anonymous author opens the book by asking that it go only to readers committed to contemplation, and that they read it all the way through instead of in pieces, so no part is taken out of context. Fair warning to anyone reading this entry on its own.", "source": "<em>The Cloud of Unknowing<\/em>, an anonymous 14th-century English text, tells the contemplative to put a “cloud of forgetting” between themselves and every other thought, and to hold a single short word, “the shorter the better.”"}, "7": {"n": 7, "name": "Tzimtzum", "trad": "Lurianic Kabbalah", "ev": 2, "when": "Too much is coming in at once: noise, light, people, messages.", "image": "Light drawing back to a point, leaving a cool, empty space in the middle of your chest.", "method": "Cut input first. Close your eyes or fix them on one plain spot. Put in earplugs or headphones if you have them. Then breathe out long and slow through pursed lips, and let the next breath come on its own. Three rounds. No holding.", "why": "When overload is sensory, the fastest fix is less input. Heart rate dips on every out-breath, so long exhales slow it overall, and the quiet gives you room to choose what to deal with first.", "hole": "Isaac Luria wrote almost nothing down. He taught in Safed for about two years and died in 1572, around age 38. Nearly everything known about his system comes from his student Hayyim Vital, whose writings circulated in manuscript for decades before being printed.", "source": "Luria taught that the Infinite, <em>Ein Sof<\/em>, withdrew itself to leave an empty space in which a finite world could exist. Creation begins with contraction."}, "8": {"n": 8, "name": "The Shattering of the Vessels", "trad": "Lurianic Kabbalah", "ev": 2, "when": "A plan has fallen apart without warning.", "image": "A rigid clay jar cracking under light, its pieces gathered into something wider.", "method": "Rub your palms together for 5 seconds. Cup them over your closed eyes without pressing, 10 to 20 seconds. Then write two lines: what changed, and the new plan for the next hour. Rough is fine. If others are affected, tell them the new plan.", "why": "Covering the eyes gives the stress response a short break. Putting the change into words (affect labeling) reduces its charge. A sudden change often hurts most because of the open question it leaves, and a written next step closes that question fast.", "hole": "The scholar Gershom Scholem argued that the image of broken vessels and scattered sparks spread so quickly because Jewish communities were still absorbing the 1492 expulsion from Spain. A myth about a broken world gave a broken world a meaning. Later scholars have pushed back on how tight that link is.", "source": "In Luria’s account, the first vessels couldn’t contain the light poured into them and broke. Sparks scattered, and the work of the world is gathering them back (<em>tikkun<\/em>, see 23). The breaking is part of the story, not a failure of it."}, "9": {"n": 9, "name": "The Law of Containment", "trad": "Hermeticism", "ev": 3, "when": "Many tasks are competing for your attention.", "image": "Flying debris freezing in midair and dropping into a box with a heavy lid.", "method": "Draw a thick square on a sticky note and write the three things that matter most inside it. Put it where you can’t miss it: the edge of the screen, the back of your phone. Everything else goes on one list in one place. Pick one fixed time today to look at that list.", "why": "Writing open tasks down takes them out of working memory. Masicampo and Baumeister (2011) found that making a specific plan for unfinished goals cut the intrusive thoughts those goals cause. The box stays visible because out of sight is often out of mind.", "hole": "The Kybalion is signed “Three Initiates,” who were never named. It was published by the Yogi Publication Society, which was Atkinson’s own press, the same one that put out his books under the pen name “Yogi Ramacharaka.”", "source": "The Kybalion’s first principle: <blockquote>“THE ALL is MIND; the Universe is Mental.”<\/blockquote> The usable part is that you set the frame you work inside."}, "10": {"n": 10, "name": "The Tyler’s Sword", "trad": "Freemasonry · Stoicism", "ev": 2, "when": "A reaction is about to fire.", "image": "A guard at your mind’s door, sword across the frame, asking the visitor’s name.", "method": "Freeze for 3 seconds. Unclench your jaw, let the tongue drop, shift your weight back onto your heels. Then name the visitor in whatever form comes: a feeling word (“anger”), a body word (“hot,” “tight,” “buzzing”), or a number from 1 to 5. Then decide whether it gets in.", "why": "The pause breaks the automatic link between trigger and response. In brain-imaging studies, naming an emotion damps the brain’s alarm signal. Those studies used emotion words; body words and numbers are a reasonable stand-in but haven’t been tested the same way.", "hole": "The usual explanation for the word “tyler” is the tiler, the worker who closes up a building by laying its roof. Nobody can see in once the tiles are on. The word “cowan,” for the outsider the Tyler keeps out, comes from Scots, where it meant a dry-stone builder who never learned the trade properly.", "source": "The Tyler guards the lodge door with a drawn sword. Epictetus gives the same post to the mind: <blockquote>“Impression, wait for me a little. Let me see what you are, and what you represent. Let me test you.” (<em>Discourses<\/em> 2.18)<\/blockquote>"}, "11": {"n": 11, "name": "The Law of Neutralization", "trad": "Hermeticism · Rhythm", "ev": 3, "when": "Frustration is climbing and you have a minute.", "image": "Stepping off the swinging weight onto the fixed point it hangs from.", "method": "Box breathing, traced with a finger. Draw a square on any surface: up one side breathing in for 4, across the top holding for 4, down breathing out for 4, across the bottom holding for 4. Three or four rounds. If the holds feel tight, shorten them to 2 or use entry 13 instead.", "why": "Slow, paced breathing shifts the body toward its rest branch. Counting gives the mind a task, and tracing moves your focus out to the fingertip. A 2023 Stanford study comparing techniques found box breathing helped, and the cyclic sigh in entry 13 helped slightly more.", "hole": "Box breathing is taught in military and police training under the name “tactical breathing,” as a way to steady the hands and voice under pressure. The Kybalion’s pendulum and the firing range ended up at the same square.", "source": "The Kybalion’s Principle of Rhythm says everything swings like a pendulum. Its “Law of Neutralization” is to rise above the swing and let it pass underneath you."}, "12": {"n": 12, "name": "Gevurah’s Restraint", "trad": "Kabbalah", "ev": 2, "when": "You’re about to say, send, or do something you can’t take back.", "image": "An iron gate dropping between the impulse and the act.", "method": "For messages, set one rule: a heated reply never gets written in the reply box. Write it in a notes app or drafts folder instead, and don’t send it until a fixed later time (an hour, or the next morning). Schedule-send works too. In person: press your tongue to the roof of your mouth, palms together, and count down slowly from 10.", "why": "Urges rise, peak, and fall within minutes. A delay with something to do during it lets the peak pass before you act; addiction research calls this “urge surfing.” Friction built into your setup holds better than resisting in the moment.", "hole": "Several sefirot take their names from one verse, 1 Chronicles 29:11: <blockquote>“Thine, O LORD, is the greatness, and the power, and the glory, and the victory, and the majesty.”<\/blockquote> In Hebrew those are <em>gedullah<\/em>, <em>gevurah<\/em>, <em>tiferet<\/em>, <em>netzach<\/em>, and <em>hod<\/em>. It’s the same verse behind the closing line many Christians add to the Lord’s Prayer.", "source": "<em>Gevurah<\/em> (“strength,” also called <em>Din<\/em>, judgment) is the sefirah of restraint. On the Tree of Life it balances <em>Chesed<\/em>, lovingkindness. Without restraint, even generosity has no shape."}, "13": {"n": 13, "name": "The Inner Statue", "trad": "Neoplatonism", "ev": 3, "when": "Frustration is turning into a story about who you are: “I always…,” “I’m the kind of person who…”", "image": "A crust cracking off a statue. The crust is dirt on the marble, not the marble.", "method": "Two quick inhales through the nose (the second tops off the first), then one long, slow exhale through the mouth. On the exhale, shake your hands out hard and drop your shoulders. Two or three rounds.", "why": "This is the physiological, or cyclic, sigh. In the 2023 Stanford study, five minutes a day of it improved mood and lowered resting breathing rate more than mindfulness meditation did. The second inhale reopens collapsed air sacs, and the long exhale slows the heart.", "hole": "For a man who told people to chisel their statue, Plotinus refused to have his own likeness made. His student Porphyry writes that he seemed ashamed of having a body, and that a painter had to sneak into lectures and draw him from memory.", "source": "Plotinus, <em>Ennead<\/em> I.6: <blockquote>“Never cease chiselling your statue.”<\/blockquote> You don’t become good by adding to yourself. You cut away what isn’t you, the way a sculptor clears marble until the figure shows."}, "14": {"n": 14, "name": "The Apophatic Cut", "trad": "Mysticism · <em>Via negativa<\/em>", "ev": 3, "when": "The same thoughts keep circling.", "image": "A chisel working in the dark. The form is found by what gets removed.", "method": "Each time the thought comes back, tap thumb to index finger and say silently, “Not now. At [time].” Write the thought as one line on a list. At that time, give the list 10 minutes. If something still matters, make one plan for it.", "why": "A loop often keeps running because it’s afraid of being forgotten. A written place and a set time answer that. The practice combines cognitive defusion (treating a thought as an event you notice, not an order you follow) with scheduled “worry time,” which has some research support for cutting rumination.", "hole": "“Pseudo” is in the name for a reason. The author wrote as Dionysius the Areopagite, the Athenian Paul converts in Acts 17:34. The church accepted that for roughly a thousand years, until Renaissance scholars like Lorenzo Valla and Erasmus noticed the writings depend on philosophers who lived centuries after Paul.", "source": "Apophatic theology, set out by Pseudo-Dionysius around 500 AD, approaches God only by saying what God is <em>not<\/em>, stripping away every image until nothing false remains."}, "15": {"n": 15, "name": "Mental Transmutation", "trad": "Hermeticism · Polarity", "ev": 2, "when": "You’re stuck in one charged state and want out of it.", "image": "A lead ball in your fist turning to light as your fingers open.", "method": "Clench your fist hard for 5 seconds. Open it wide and look up at the highest point in the room. Then pick the physical opposite of what your body is doing: still to walking, hunched to open, fast to slow, loud to quiet. Do one small thing from that side.", "why": "Tensing and releasing makes the release easier to feel, the same principle as entry 24. Physical opposites are easier to find than emotional ones, and acting on the body tends to pull the feeling along. This is close to “opposite action” from Dialectical Behavior Therapy, which has decent support.", "hole": "The idea is far older than Hermes. Around 500 BC, Heraclitus wrote that the road up and the road down are one and the same, and that cold things grow warm and warm things cool. The Kybalion’s Principle of Polarity is Heraclitus with New Thought vocabulary.", "source": "The Principle of Polarity says opposites are <blockquote>“identical in nature, but different in degree.”<\/blockquote> Hot and cold sit on one scale. The Kybalion’s method is to move along it by attending to the opposite pole."}, "16": {"n": 16, "name": "Distillation", "trad": "Alchemy", "ev": 2, "when": "You have too many options and keep circling them.", "image": "Muddy water boiling, clear drops collecting in a clean glass.", "method": "List the options on one sheet. Before looking closely, pick one rule to cut by: cheapest, closest, fastest, or first available. Apply it and keep the winner. If two are still tied, flip a coin and notice whether you feel relief or disappointment at the result. That reaction is your answer.", "why": "The research on “choice overload” is real but inconsistent. What helps more reliably is shrinking the set and making the decision feel closed. A rule picked in advance is as fast as a guess, but it’s a rule, so the choice feels earned and the re-checking stops.", "hole": "“Alcohol” comes from the Arabic <em>al-kuḥl<\/em>, the fine black powder used as eyeliner. Alchemists stretched it to mean the finest, most refined essence of anything, and eventually the essence of wine. Distilled drinks are still called “spirits” for the same reason.", "source": "Distillation heats a mixture until the volatile essence rises and condenses apart from the residue. To the alchemists it was the separation of the subtle from the gross."}, "17": {"n": 17, "name": "The Principle of Cause", "trad": "Hermeticism · Cause and Effect", "ev": 1, "when": "You’re stuck because you’re afraid of choosing wrong.", "image": "The cue ball, not the scattering rack.", "method": "Draw a dot labeled A (now) and a dot labeled B (decided). Connect them with one firm line. Under the line, write the single action that starts it. Then write a review date: “Good enough for now. I’ll check again on ___.”", "why": "The effect is mostly framing. It moves attention from the outcome, which you can’t control, to the action, which you can. The review date is simply true, and a choice you can revisit is less frightening to make.", "hole": "The sharpest version of this idea came from someone with almost no control at all. Epictetus was born a slave, was lame in one leg, and taught the dichotomy of control (what is up to you, what isn’t) after being freed. His lectures survive only because a student wrote them down.", "source": "<blockquote>“Every Cause has its Effect; every Effect has its Cause.”<\/blockquote> The Kybalion says most people are carried along as effects of other wills and circumstances, while the master acts as a cause."}, "18": {"n": 18, "name": "The Middle Pillar", "trad": "Kabbalah · Golden Dawn reading", "ev": 1, "when": "You’re torn between two extremes, such as total control or letting everything go.", "image": "Standing in the space between two pillars, one light and one dark.", "method": "Say both extremes out loud. Put your hands palm-down on your thighs and slide them up until they meet at the center of your chest. Then write a middle option with numbers in it: “For the next 7 days, I’ll do ___, this much, at this time.”", "why": "Mostly symbolic. The gesture cues you to stop thinking in either/or. “Find the middle” is too vague to act on; numbers and an end date turn the third option into an experiment instead of a permanent identity.", "hole": "Lodge pillars usually carry two globes on top, one of the earth and one of the heavens. Those are a Masonic addition. 1 Kings 7 describes the tops of Boaz and Jachin as bowl-shaped capitals wrapped in chainwork, pomegranates, and lily work.", "source": "The Tree of Life has three columns: Severity, Mercy, and the Middle Pillar of balance running through <em>Tiferet<\/em> (harmony). Masonry has its own pair, Boaz and Jachin, the pillars at the porch of Solomon’s Temple. The Golden Dawn later turned the Middle Pillar into a named exercise."}, "19": {"n": 19, "name": "The Trowel", "trad": "Freemasonry", "ev": 2, "when": "A conversation is heating up.", "image": "Mortar filling the gaps between rough stones.", "method": "Press thumb and forefinger together out of sight. Lower your voice, slow down, and ask one real question before your next point. Eye contact is optional; looking at the table is fine. If you need time to think, use a set phrase: “I want to answer this properly. Can I come back to you in an hour?” For hard topics, it’s fine to ask to continue in writing.", "why": "People tend to match each other’s pace and volume, so slowing down usually slows the other person too. Fast spoken conflict rewards whoever answers quickest, not whoever is right. Asking for time, or for writing, moves the conversation to ground where you can say what you mean.", "hole": "The trowel has a dark side in English. In <em>As You Like It<\/em>, Celia mocks a speech as “laid on with a trowel,” meaning flattery spread far too thick. The same tool that binds the stones can also bury them.", "source": "In the Master Mason degree, the trowel is used “to spread the cement of brotherly love and affection,” binding separate stones into one structure."}, "20": {"n": 20, "name": "The Principle of Correspondence", "trad": "Hermeticism · Correspondence", "ev": 2, "when": "Someone is acting unreasonably and it feels personal.", "image": "Zooming out from street level to a satellite view of a weather system. A storm is weather, not an insult.", "method": "Let your gaze go wide to the whole room rather than the person’s face. Then think of two or three possible reasons for the behavior, instead of settling on one. If it matters, ask them. If what they did is actually unfair, you’re allowed to say so.", "why": "Guessing what’s happening inside someone else is tiring, and misreads run in both directions between people whose minds work differently (the double empathy problem). Holding several guesses is a form of cognitive reappraisal, one of the best-studied emotion regulation strategies there is. Reframing a situation isn’t the same as excusing it.", "hole": "The oldest surviving versions of the Emerald Tablet are in Arabic, from around the 8th or 9th century, not ancient Egypt. Isaac Newton made his own English translation of it, and wrote a commentary, in among his alchemical notebooks.", "source": "<blockquote>“As above, so below; as below, so above.”<\/blockquote> The Kybalion’s version of a line from the Emerald Tablet. Patterns repeat at every scale."}, "21": {"n": 21, "name": "The Cable-Tow", "trad": "Freemasonry", "ev": 1, "when": "Someone is asking more than you can give, or you’re about to say yes just to avoid friction.", "image": "A rope of measured length. Past its end, you are not bound.", "method": "<p>Extend one arm to its full reach and notice where it ends. Bring the hand back to your chest. Then use a script you wrote in advance. The default is delay:<\/p>\n<p>“Let me check and get back to you by ___.”<\/p>\n<p>Later, one of: “Here’s what I can do: ___.” or “I can’t take that on.”<\/p>", "why": "Mostly symbolic, plus a pause and a prepared answer. A fast answer is the hardest kind to give honestly, so the script makes delay the default. A limit is part of an obligation, not a failure of it.", "hole": "Some older Masonic writers gave the cable-tow a literal length, often said to be about three miles: how far a brother was expected to travel to attend lodge. The modern reading, the reach of your ability, is a lot more forgiving.", "source": "A Mason’s obligation to answer a call for help holds “if within the length of my cable-tow,” traditionally read as within the reach of your ability."}, "22": {"n": 22, "name": "Solve et Coagula", "trad": "Alchemy", "ev": 2, "when": "You’re switching from one part of the day to another.", "image": "Vapor condensing and settling into the shape of a new vessel.", "method": "For switches you know are coming, set a warning timer: one at 10 minutes, one at 2. Before you leave the task, write a one-line parking note: where you stopped and what comes next. At the doorway, put both palms on the frame and press for 3 seconds. Breathe out. Step through on the inhale.", "why": "Warnings make a switch predictable, and the parking note lets you stop without fear of losing the thread. Research on “attention residue” found that a quick written note on where to pick up reduced the drag of the unfinished task. Walking through a doorway also acts as an “event boundary” in memory.", "hole": "The most famous place the phrase appears is the arms of the Baphomet drawn by Éliphas Lévi in 1856: SOLVE on one forearm, COAGULA on the other. A diagram of alchemical balance that later got cast as a devil.", "source": "<em>Solve et coagula<\/em>, “dissolve and coagulate,” is alchemy’s basic cycle: break a substance down, then let it set in a new form. One phase has to end cleanly for the next to take shape."}, "23": {"n": 23, "name": "Raising the Sparks", "trad": "Lurianic Kabbalah · Pythagoreanism", "ev": 3, "when": "You brush your teeth at night. Hooking it onto something you already do every night is what makes it happen.", "image": "Gathering sparks from a dark floor and returning them to one fire.", "method": "Keep a small notebook by the sink or the bed. Take 60 seconds. Write one thing you finished today (anything counts, including eating a real meal) and cross it out. Write one line for anything unfinished, and when you’ll come back to it. Close the notebook and say, “The work is set down.”", "why": "Unfinished tasks keep pulling at attention (the Zeigarnik effect), and a written plan for them quiets that pull (see 9). One sleep-lab study (Scullin, 2018) found that writing a short to-do list at bedtime helped people fall asleep faster.", "hole": "“Tikkun olam,” repairing the world, is now mostly used to mean social justice. The phrase is much older than Luria: it appears in the Mishnah as a legal term, for rules adjusted “for the sake of repairing the world.” Luria made it cosmic, and the 20th century made it political.", "source": "After the shattering (8), sparks of light lie scattered, and each right action lifts one back toward its source. The Pythagorean <em>Golden Verses<\/em> keep a nightly review for the same hour: <blockquote>“Wherein have I done amiss? What have I done? What have I omitted that I ought to have done?”<\/blockquote>"}, "24": {"n": 24, "name": "Kenosis", "trad": "Christian mysticism", "ev": 3, "when": "You’re lying down to sleep and your mind is still running.", "image": "Armor unbuckled one piece at a time until nothing is left to carry.", "method": "<p>Lie on your back. Tense your feet for 5 seconds, release for 10. Move upward: calves, thighs, hands, shoulders, face. Let each release finish before moving on.<\/p>\n<p>If tensing doesn’t land, try steady weight instead: a weighted or heavy blanket. If your mind keeps running, give it something low-stakes to hold: brown noise, or an audiobook you’ve heard before.<\/p>", "why": "Progressive muscle relaxation has good evidence for lowering anxiety and shortening time to sleep. One Swedish trial found weighted blankets improved sleep in adults with a range of psychiatric conditions. Evidence for background noise is thin; keep it if it works.", "hole": "The physician Edmund Jacobson built the original version in the 1920s. It covered dozens of muscle groups and took months of training to learn. The ten-minute version used today is a shortcut later therapists made from it.", "source": "<em>Kenosis<\/em>, “self-emptying,” comes from Philippians 2:7, where Christ “emptied himself.” The mystics read it as setting down self-will. Here it means setting down the role of the one who does things, for the night."}}, "threads": "<p>The traditions in this book weren’t sealed off from each other. They borrowed, copied, and misread one another for two thousand years. Here are the main lines that run through these pages.<\/p>\n<ul class=\"threads\">\n<li><span class=\"path\">Plotinus → Pseudo-Dionysius → The Cloud of Unknowing<\/span><p>Plotinus’s One, beyond every description, became the Christian God approached by negation. The <em>Cloud<\/em> author also made an English version of Dionysius’s <em>Mystical Theology<\/em>. Entries 6, 13, and 14 are one family.<\/p><\/li>\n<li><span class=\"path\">Corpus Hermeticum → Florence, 1463 → Casaubon, 1614 → The Kybalion, 1908<\/span><p>Cosimo de’ Medici had Marsilio Ficino set aside his Plato translation to translate the newly found Hermetic texts first, because they were thought to be older than Moses. In 1614 Isaac Casaubon showed from their Greek that they were written in the early Christian era. The Kybalion borrowed the prestige of the name three centuries after it had been dated.<\/p><\/li>\n<li><span class=\"path\">Kabbalah → Christian Cabala → Golden Dawn → The Middle Pillar<\/span><p>Renaissance Christian scholars took up Kabbalah as a hidden key to their own scripture. The Hermetic Order of the Golden Dawn, founded in London in 1888, built its whole grade system on the Tree of Life. Israel Regardie published the Middle Pillar exercise as a book in 1938.<\/p><\/li>\n<li><span class=\"path\">Working stonemasons → Grand Lodge, 1717 → Golden Dawn<\/span><p>Lodges of actual builders slowly filled with gentlemen who never cut stone, and in 1717 four London lodges formed the first Grand Lodge. All three founders of the Golden Dawn were Freemasons, which is why its rituals feel familiar to anyone who has seen a lodge.<\/p><\/li>\n<li><span class=\"path\">The Stoics → the monasteries<\/span><p>Early Christian monks found Epictetus close enough to their own practice that they adapted the <em>Enchiridion<\/em> for monastic use, swapping some pagan names for Christian ones. The Stoic pause in entry 10 survived the fall of Rome inside the church.<\/p><\/li>\n<li><span class=\"path\">New Thought → The Kybalion, and further<\/span><p>New Thought taught that the mind shapes outer reality. It gave us the Kybalion, much of modern self-help, and, by several historians’ reading, part of the root system of the prosperity gospel’s “positive confession.” Its best idea (attention shapes experience) and its worst (if you suffer, you didn’t believe hard enough) came out of the same box.<\/p><\/li>\n<\/ul>", "fineprint": "<p>Every tradition in this book has also been used to hold people in place. So have churches, political movements, wellness companies, and families. The tools of control are older than any one group and look the same everywhere, which means you can learn to read them once and recognize them anywhere.<\/p>\n<p>Even this book’s epigraph is a gate. It says wisdom stays closed except to the right ears. Read every line like that as a question: who decides whose ears count?<\/p>\n<h3>The short list<\/h3>\n<p>These are the signs that a teacher, group, or text is working as a hook:<\/p>\n<ul>\n<li>You are told you are not enough yet, and the next level, book, or degree will fix that.<\/li>\n<li>The real knowledge is always one step further in, behind payment, rank, or an oath.<\/li>\n<li>There’s urgency: now or never, inside or lost.<\/li>\n<li>Doubt is treated as a flaw in you instead of a question to be answered.<\/li>\n<li>Everyone outside is asleep, profane, deceived, or lost.<\/li>\n<li>Questions get a label instead of an answer: rebellion, pride, the flesh, the ego, low vibration.<\/li>\n<li>The group’s founding story can’t be checked, or checking it is discouraged.<\/li>\n<li>Leaving costs you your people, not just your membership.<\/li>\n<li>Your sense of who you are starts to depend on staying in.<\/li>\n<\/ul>\n<h3>The longer checklist<\/h3>\n<p>In 1961 the psychiatrist Robert Jay Lifton published a study of “thought reform” based on interviews with people who had been through Chinese re-education programs. He named eight features of what he called totalist environments. They have since been applied to religious groups, cults, and high-control organizations of every kind. Any healthy group shows a trace of one or two. The warning sign is most of them, at full strength, together.<\/p>\n<dl class=\"pairs\">\n<div><dt>Milieu control<\/dt><dd>Controlling what information gets in, and who you talk to.<span class=\"ex\">Approved books only; outside media, friends, or family treated as dangerous.<\/span><\/dd><\/div>\n<div><dt>Mystical manipulation<\/dt><dd>Planned experiences presented as spontaneous signs from above.<span class=\"ex\">An emotional peak is staged, then pointed to as proof the group is right.<\/span><\/dd><\/div>\n<div><dt>Demand for purity<\/dt><dd>An impossible standard, so everyone always falls short.<span class=\"ex\">Constant guilt keeps people working and keeps them dependent on the group for relief.<\/span><\/dd><\/div>\n<div><dt>Cult of confession<\/dt><dd>Members expose their failings, and the information becomes leverage.<span class=\"ex\">Public testimony of sins; what you confessed comes back up when you disagree.<\/span><\/dd><\/div>\n<div><dt>Sacred science<\/dt><dd>The doctrine is final, total, and beyond question.<span class=\"ex\">Questioning the teaching is the same as questioning God, nature, or truth itself.<\/span><\/dd><\/div>\n<div><dt>Loading the language<\/dt><dd>Special words and stock phrases that end thinking.<span class=\"ex\">Lifton coined “thought-terminating cliché” here. Examples below.<\/span><\/dd><\/div>\n<div><dt>Doctrine over person<\/dt><dd>When your experience conflicts with the teaching, your experience is wrong.<span class=\"ex\">“If it isn’t working, the problem is your heart, not the teaching.”<\/span><\/dd><\/div>\n<div><dt>Dispensing of existence<\/dt><dd>Outsiders are less real, less saved, or less worthy.<span class=\"ex\">Former members become cautionary tales, or simply stop being mentioned.<\/span><\/dd><\/div>\n<\/dl>\n<p>A newer, simpler grid is Steven Hassan’s BITE model: does the group control your <strong>B<\/strong>ehavior, the <strong>I<\/strong>nformation you can access, your <strong>T<\/strong>houghts, and your <strong>E<\/strong>motions? Four questions, easy to carry around.<\/p>\n<h3>Thought-terminating phrases<\/h3>\n<p>A thought-terminating phrase sounds wise, ends the conversation, and can’t be answered without seeming to attack the speaker. Every tradition grows its own. Some that show up across religious, esoteric, and self-help settings:<\/p>\n<ul class=\"cliches\">\n<li>“That’s just your flesh talking.”<span>Religious<\/span><\/li>\n<li>“Doubt is a door the devil walks through.”<span>Religious<\/span><\/li>\n<li>“You’ll understand when you’re further along.”<span>Esoteric<\/span><\/li>\n<li>“Your resistance is your ego.”<span>Esoteric<\/span><\/li>\n<li>“It didn’t work because you didn’t believe enough.”<span>New Thought<\/span><\/li>\n<li>“You attracted this.”<span>Self-help<\/span><\/li>\n<li>“Everything happens for a reason.”<span>Everywhere<\/span><\/li>\n<li>“Trust the process.”<span>Everywhere<\/span><\/li>\n<\/ul>\n<p>The test is simple. After the phrase is said, is your question answered, or just closed? A real answer still works after you ask “how do you know?”<\/p>\n<div class=\"casefile\">\n<h3>Check the claim against its own source<\/h3>\n<p>Groups often make claims about their own sources: this book is ancient, this ritual goes back to Solomon, this translation is perfect. Those claims can be checked, and the place to start is the source itself. A few from this book’s own territory:<\/p>\n<ul>\n<li><strong>The Kybalion<\/strong> claims ancient Egyptian teaching. It was written in Chicago in 1908.<\/li>\n<li><strong>Pseudo-Dionysius<\/strong> claimed to be Paul’s convert. He wrote about 500 years later.<\/li>\n<li><strong>The Golden Dawn<\/strong> claimed its charter came from a German adept named Anna Sprengel. Most historians think she never existed and the letters were forged.<\/li>\n<li><strong>Freemasonry<\/strong> traces its story to the builders of Solomon’s Temple. The documented history starts in 17th-century Britain.<\/li>\n<\/ul>\n<p>The same method works on a claim many readers grew up with: that the King James Version is the one perfect English Bible, and every other translation is corrupt. Read what the KJV itself says.<\/p>\n<ul>\n<li>The 1611 edition opens with a long preface, “The Translators to the Reader.” In it the translators say they never set out to make a bad translation good, but “to make a good one better.”<\/li>\n<li>They defend the earlier English Bibles directly, saying that “the very meanest translation of the Bible in English… containeth the word of God, nay, is the word of God.”<\/li>\n<li>They printed alternative readings in the margins, thousands of them, and argued that “variety of Translations is profitable for the finding out of the sense of the Scriptures.”<\/li>\n<li>The 1611 edition included the Apocrypha between the Testaments.<\/li>\n<li>The KJV most people read today is mostly Benjamin Blayney’s 1769 Oxford revision, with updated spelling, punctuation, and corrections. Earlier printings had errors, the most famous being the 1631 “Wicked Bible,” which left “not” out of “Thou shalt not commit adultery.” The printers were fined.<\/li>\n<\/ul>\n<p>None of this is an argument against the KJV, which is one of the great works of the English language. The point is the method. The translators themselves held a more modest view of their work than many who later defended it. When a group tells you what a source says, read the source.<\/p>\n<\/div>\n<h3>Hooks that fit certain minds<\/h3>\n<p>Hooks aren’t one-size-fits-all. Some fit particular kinds of minds very well, and it helps to know which ones are shaped for yours.<\/p>\n<dl class=\"pairs\">\n<div><dt>If you love a complete system<\/dt><dd>Esoteric orders and strict doctrines are detailed, internally consistent, and full of lore. That can feel like finally f
