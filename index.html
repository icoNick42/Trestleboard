  nav.appendChild(E[id - 1] ? h("button", { class: "opt", type: "button", onclick: function () { location.hash = "#/p/" + (id - 1); } }, ["← " + BOOK.entries[id - 1].name]) : h("span"));
  if (E[id + 1]) nav.appendChild(h("button", { class: "opt", type: "button", onclick: function () { location.hash = "#/p/" + (id + 1); } }, [BOOK.entries[id + 1].name + " →"]));
  app.appendChild(nav);
}

/* ---------- Read: contents ---------- */
function readHome() {
  topbar({ sound: false, title: "Read" }); tabs("read");
  var seen = store.get("seen", {}), last = store.get("last", null);
  if (last && READ_BY[last]) {
    var lr = READ_BY[last];
    app.appendChild(h("div", { class: "cover" }, [
      h("span", { class: "label", style: "color:var(--slate-mark)" }, ["Pick up where you left off"]),
      h("h1", { html: (lr.num ? "Chapter " + lr.num + ": " : "") + niceTitle(lr.title) }),
      h("div", { class: "row" }, [h("a", { class: "go", href: "#/read/" + last, style: "text-decoration:none" }, ["Continue reading"])])
    ]));
  }
  function row(r) {
    var a = h("a", { href: "#/read/" + r.id, class: seen[r.id] ? "seen" : "" }, [
      h("span", { class: "n" }, [r.num ? String(r.num) : "·"]),
      h("span", { class: "t", html: niceTitle(r.title) }),
      r.dateline ? h("span", { class: "d" }, [r.dateline]) : null
    ]);
    return h("li", null, [a]);
  }
  var toc = h("nav", { class: "toc", "aria-label": "Contents" });
  toc.appendChild(h("div", { class: "toc-group" }, [
    h("h2", null, ["The Trestleboard"]),
    h("p", { class: "gnote" }, ["The 24 practices themselves are in the Practices tab."]),
    h("ol", null, READ.filter(function (r) { return r.group === "tb"; }).map(row))
  ]));
  toc.appendChild(h("div", { class: "toc-group" }, [
    h("h2", null, ["A Field Guide to the Western Mysteries"]),
    h("p", { class: "gnote" }, ["Fourteen traditions, from Pythagoras to The Kybalion. About five minutes a chapter; read them in any order."]),
    h("ol", null, READ.filter(function (r) { return r.group === "fg"; }).map(row))
  ]));
  toc.appendChild(h("div", { class: "toc-group" }, [
    h("h2", null, ["At the back"]),
    h("ol", null, READ.filter(function (r) { return r.group === "back"; }).map(row))
  ]));
  app.appendChild(toc);
}

/* ---------- Read: one page ---------- */
function linkChapters(html) {
  // "(Ch. 8)" and "(Ch. 11, 13)" in the glossary become links
  return html.replace(/\(Ch\. ([\d, ]+)\)/g, function (m, nums) {
    return "(" + nums.split(/,\s*/).map(function (n, i) {
      var c = CH_BY_NUM[+n]; if (!c) return n;
      return (i === 0 ? "Ch. " : "") + '<a href="#/read/' + c.id + '">' + n + "</a>";
    }).join(", ") + ")";
  });
}
function glossaryBody() {
  var wrap = h("div", { class: "prose" });
  var q = h("input", { class: "search", type: "search", placeholder: "Find a word", "aria-label": "Find a word", autocomplete: "off" });
  var list = h("div", { class: "gloss" });
  var rows = BOOK.glossary.map(function (g) {
    var p = h("p", { html: "<strong>" + g.term + ":</strong> " + linkChapters(g.def) + (g.src === "tb" && g.group ? ' <span class="from">(' + g.group + ")</span>" : "") });
    list.appendChild(p);
    return { el: p, text: (g.term + " " + g.def).toLowerCase().replace(/<[^>]+>/g, "") };
  });
  q.addEventListener("input", function () {
    var v = q.value.trim().toLowerCase();
    rows.forEach(function (r) { r.el.hidden = v && r.text.indexOf(v) < 0; });
  });
  wrap.appendChild(h("p", { class: "empty" }, ["Every unfamiliar word from the practices and the Field Guide, in one list. Chapter numbers are links."]));
  wrap.appendChild(q); wrap.appendChild(list);
  return wrap;
}
function shelfBody() {
  var wrap = h("div", { class: "prose" });
  wrap.appendChild(h("h2", { style: "margin-top:0" }, ["The books behind the practices"]));
  wrap.appendChild(h("ul", { class: "shelf", html: BOOK.tbShelf.map(function (li) { return "<li>" + li + "</li>"; }).join("") }));
  var rest = h("div", { class: "prose", html: BOOK.fgShelf });
  wrap.appendChild(rest);
  return wrap;
}
function readerView(id) {
  var r = READ_BY[id];
  var where = r.group === "fg" && r.num ? "<b>Chapter " + r.num + "</b> of 14 · " + niceTitle(r.title) : "<b>" + niceTitle(r.title) + "</b>";
  topbar({ back: ["Read", "#/read"], sound: false, size: true, progress: true, where: where }); tabs("read");
  store.set("last", id);
  var seen = store.get("seen", {}); seen[id] = true; store.set("seen", seen);

  var head = h("h1", null, []);
  var label = r.group === "tb" ? "The Trestleboard" : r.group === "fg" ? (r.num ? "Chapter " + r.num : "A Field Guide to the Western Mysteries") : "At the back";
  head.appendChild(h("span", { class: "ch-label" }, [label]));
  head.appendChild(h("span", { html: niceTitle(r.title) }));
  var art = h("article", { class: "prose" }, [head]);
  if (r.dateline) art.appendChild(h("p", { class: "dateline" }, [r.dateline]));
  if (r.special === "glossary") art.appendChild(glossaryBody());
  else if (r.special === "shelf") art.appendChild(shelfBody());
  else art.appendChild(h("div", { class: "prose", html: r.html }));

  // practices that come from this tradition
  var ps = CH_PRACTICES[id];
  if (ps) {
    art.appendChild(h("section", { class: "group" }, [
      h("h2", null, ["Try it"]),
      h("p", { class: "gdesc" }, ["Practices in the Trestleboard that come from this tradition."]),
      h("div", { class: "links" }, ps.map(function (n) {
        return h("a", { class: "linkrow", href: "#/p/" + n }, [h("span", null, [h("small", null, [two(n) + " · " + E[n].sit]), h("span", null, [BOOK.entries[n].name])]), h("span", { class: "arrow", "aria-hidden": "true" }, ["→"])]);
      }))
    ]));
  }
  app.appendChild(art);

  var prev = READ[r.i - 1], next = READ[r.i + 1];
  var pager = h("nav", { class: "pager", "aria-label": "Page navigation" });
  if (prev) pager.appendChild(h("a", { class: "prev", href: "#/read/" + prev.id }, [h("span", { class: "label" }, ["Previous"]), h("span", { class: "t", html: niceTitle(prev.title) })]));
  if (next) pager.appendChild(h("a", { class: "next", href: "#/read/" + next.id }, [h("span", { class: "label" }, ["Next"]), h("span", { class: "t", html: niceTitle(next.title) })]));
  pager.appendChild(h("a", { class: "home", href: "#/read" }, ["Back to contents"]));
  app.appendChild(pager);
}
function onScroll() {
  var bar = document.getElementById("progress"); if (!bar) return;
  var hgt = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (hgt > 0 ? Math.min(100, (window.scrollY / hgt) * 100) : 0) + "%";
}
window.addEventListener("scroll", onScroll, { passive: true });

/* ---------- My Log ---------- */
function backupData() {
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("tb:") === 0) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return { app: "trestleboard", version: 1, saved: new Date().toISOString(), data: data };
}
function saveBackup(msg) {
  var json = JSON.stringify(backupData(), null, 1);
  var name = "trestleboard-backup-" + dayKey() + ".json";
  var file = null;
  try { file = new File([json], name, { type: "application/json" }); } catch (e) {}
  // On iPhone the share sheet has "Save to Files"; elsewhere this downloads the file
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: "Trestleboard backup" })
      .then(function () { msg.textContent = "Backup saved."; })
      .catch(function (err) { if (err && err.name !== "AbortError") download(); });
    return;
  }
  download();
  function download() {
    try {
      var url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      var a = h("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      msg.textContent = "Backup file saved as " + name + ".";
    } catch (e) { msg.textContent = "Couldn't save a file here."; }
  }
}
function restoreBackup(file, msg) {
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var b = JSON.parse(rd.result);
      if (!b || b.app !== "trestleboard" || !b.data) throw new Error("not ours");
      var keys = Object.keys(b.data);
      keys.forEach(function (k) { if (k.indexOf("tb:") === 0) localStorage.setItem(k, b.data[k]); });
      msg.textContent = "Restored " + keys.length + " saved items from " + (b.saved || "").slice(0, 10) + ".";
      setTimeout(render, 900);
    } catch (e) { msg.textContent = "That file isn't a Trestleboard backup."; }
  };
  rd.readAsText(file);
}
function clock12(t) { if (!t) return ""; var p = t.split(":"), hr = +p[0]; return ((hr % 12) || 12) + ":" + p[1] + (hr < 12 ? " am" : " pm"); }
function logView() {
  topbar({ sound: false, title: "My Log" }); tabs("log");
  var log = store.get("log", []);
  var box = h("section", { class: "group" }, [h("h2", null, ["How the practices are working"])]);
  if (!log.length) {
    box.appendChild(h("p", { class: "empty" }, ["After a practice, rate how you felt before and after (1 settled, 5 overloaded) at the bottom of its page. Your ratings show up here. Keep what reliably moves the number; drop what doesn't, however good its symbol is."]));
  } else {
    box.appendChild(h("p", { class: "empty" }, ["Each line runs from your average before to your average after. Longer lines pointing left are the practices that work for you."]));
    box.appendChild(logChart(log));
    var rows = log.slice(-20).reverse().map(function (r) {
      var d = r.a - r.b;
      return h("tr", null, [h("td", { class: "nums" }, [r.d]), h("td", null, [BOOK.entries[r.n].name]), h("td", { class: "nums" + (d < 0 ? " down" : "") }, [r.b + " → " + r.a])]);
    });
    box.appendChild(h("details", { class: "more" }, [h("summary", null, ["Recent entries"]),
      h("div", { class: "tablewrap" }, [h("table", { class: "log" }, [h("thead", null, [h("tr", null, [h("th", null, ["Date"]), h("th", null, ["Practice"]), h("th", null, ["Before → after"])])]), h("tbody", null, rows)])])]));
  }
  app.appendChild(box);

  // parked thoughts from entry 14
  var parked = store.get("park", []);
  if (parked.length) {
    app.appendChild(h("section", { class: "group" }, [
      h("h2", null, ["Parked thoughts"]),
      h("p", { class: "gdesc" }, ["From The Apophatic Cut. Clear them there once you've looked at them."]),
      h("ul", { class: "list" }, parked.map(function (it) { return h("li", null, [h("span", null, [h("small", null, ["At " + clock12(it.at)]), it.t]), h("span")]); })),
      h("a", { href: "#/p/14" }, ["Open The Apophatic Cut"])
    ]));
  }

  // backup
  var msg = h("p", { class: "msg", "aria-live": "polite" });
  var input = h("input", { class: "filepick", type: "file", accept: "application/json,.json", id: "restore-file" });
  input.addEventListener("change", function () { if (input.files && input.files[0]) restoreBackup(input.files[0], msg); input.value = ""; });
  app.appendChild(h("section", { class: "card" }, [
    h("h2", null, ["Back up"]),
    h("p", null, ["Everything you save here (ratings, notes, pinned practices, parked thoughts, settings) lives only on this phone. A backup file keeps a copy somewhere safe, like your Files app or iCloud Drive."]),
    h("div", { class: "btnrow" }, [
      h("button", { class: "go", type: "button", onclick: function () { saveBackup(msg); } }, ["Save a backup"]),
      h("button", { class: "opt", type: "button", onclick: function () { input.click(); } }, ["Restore from a backup"])
    ]),
    input, msg
  ]));

  if (log.length) {
    var clr = h("button", { class: "opt", type: "button", style: "justify-self:start" }, ["Clear log"]);
    clr.addEventListener("click", function () {
      if (clr.dataset.sure) { store.set("log", []); render(); return; }
      clr.dataset.sure = "1"; clr.textContent = "Tap again to clear";
    });
    app.appendChild(clr);
  }
}

/* ---------- routines and timer keep their own views; give them the right bars ---------- */
var _routineView = routineView, _timerView = timerView;
routineView = function (k) { _routineView(k); topbar({ back: ["Practices", "#/"], sound: true }); tabs("practice"); var b = app.querySelector(".back"); if (b) b.remove(); };
timerView = function () { _timerView(); topbar({ back: ["Practices", "#/"], sound: true }); tabs("practice"); var b = app.querySelector(".back"); if (b) b.remove(); };

/* ---------- router ---------- */
function render() {
  stopActive(); closeDim(); onDone = null; panelOpen = false;
  app.innerHTML = ""; topEl.innerHTML = "";
  var hsh = location.hash.replace(/^#\/?/, ""), m;
  if ((m = /^p\/(\d{1,2})$/.exec(hsh)) && E[+m[1]]) practiceView(+m[1]);
  else if ((m = /^r\/(\w+)$/.exec(hsh)) && ROUTINES[m[1]]) routineView(m[1]);
  else if (hsh === "timer") timerView();
  else if (hsh === "read") readHome();
  else if ((m = /^read\/([\w-]+)$/.exec(hsh)) && READ_BY[m[1]]) readerView(m[1]);
  else if (hsh === "log") logView();
  else homeView();
  window.scrollTo(0, 0); onScroll();
}
document.body.setAttribute("data-size", store.get("size", "m"));
window.addEventListener("hashchange", render);
render();

/* ---------- offline: keep a copy of the app on the phone ---------- */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}

})();
