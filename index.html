var EVERY = [
  { id: "attention", name: "Prosoche", plain: "Attention check", trad: "Stoicism", tier: "s", cue: "Any time, especially when nothing is wrong",
    short: "Three questions: Where is my attention? What am I actually doing? Is this up to me?",
    how: "Answer each in a word or two, then carry on. You don’t have to change anything. The point is that you looked.",
    why: "Most practices in this app wait for a bad moment. This one runs when nothing is wrong, so the habit of noticing is already in use when something is. The third question is Epictetus’s split between what is up to you and what isn’t (see The Principle of Cause). There’s no research on this exact exercise; it leans on the general finding that habits form through many repetitions in the same setting (one well-known study, Lally and colleagues, 2010, found a median of 66 days).",
    from: "<em>Prosochē</em> is Greek for attention. Epictetus gives it a whole chapter (Discourses 4.12, “On Attention”): attention you let slip can’t simply be picked back up whenever you like. The historian Pierre Hadot treated this steady watchfulness as the basic Stoic spiritual attitude." },
  { id: "threshold", name: "The Threshold", plain: "Doorway breath", trad: "Freemasonry · Jewish custom", tier: "s", cue: "Walking through a doorway",
    short: "At the next doorway, take one slow breath out before you step through.",
    how: "Pick the doors you pass most often. Each time, slow down for one long exhale, then step through. If you forget, the next door is another chance.",
    why: "This is an if-then plan: “when I reach a door, I breathe out.” Tying a habit to a cue you can’t miss is one of the better-supported tricks in behavior research; a 2006 review of 94 studies (Gollwitzer and Sheeran) found a medium-to-large effect on following through, strongest for starting a behavior. Doorways also act as natural mental boundaries: in lab studies (Radvansky and colleagues, 2011), walking through one made people slightly more likely to forget what they had just been doing.",
    from: "Thresholds are guarded places in old practice. In a Masonic lodge the candidate is stopped at the door and admitted only after a challenge. In many Jewish homes a mezuzah, a small case holding verses from Deuteronomy, is fixed to the doorpost and touched on the way in and out." },
  { id: "onething", name: "Age Quod Agis", plain: "One thing", trad: "Jesuit tradition", tier: "s", cue: "Several things open at once",
    short: "Name what you’re doing in three words. Close or hide one thing that isn’t that.",
    how: "Say it under your breath: “Writing the summary.” Then close one tab, turn the phone face down, or shut one window that belongs to something else. One is enough.",
    why: "Switching between tasks costs time and accuracy; that much is well established in lab research on task switching. Naming the task draws a clear line, so drifting over it is easier to notice.",
    from: "Latin for “do what you are doing.” It is the motto of many Jesuit schools, and Pope John XXIII used it to mean giving your whole attention to the task in front of you, not doing everything perfectly." },
  { id: "kavanah", name: "Kavanah", plain: "Purpose first", trad: "Jewish mysticism", tier: "s", cue: "About to start something",
    short: "Before you start, say in one sentence what this is for.",
    how: "For example: “This message is so they can decide by Friday.” Then begin. When you drift, come back to the sentence.",
    why: "A stated purpose gives you something to come back to, and makes it easier to see when a task has grown past what it’s for. This is an old idea with little direct research behind it; treat it as a habit to try, not a proven fix.",
    from: "<em>Kavanah</em> is Hebrew for intention: the direction of the heart. The Mishnah (Berakhot 5:1) describes early pious men who waited an hour before praying so they could first direct their hearts. Kabbalists later attached detailed meditations, also called <em>kavanot</em>, to ordinary prayers and acts." },
  { id: "drill", name: "The Tyler’s Drill", plain: "Practice the pause", trad: "Freemasonry · Stress inoculation", tier: "s", cue: "Before small, routine actions", link: 10,
    short: "Before something trivial, like opening a message or picking up your phone, wait three seconds. Then go.",
    how: "Choose one small, frequent action for today. Each time, stop for three seconds and loosen your jaw, then carry on. You’re rehearsing the pause from The Tyler’s Sword on moments that don’t matter.",
    why: "A skill rehearsed under low pressure is easier to reach under high pressure. Clinicians call the method stress inoculation training (Donald Meichenbaum, from the 1970s on); a 1996 review of 37 studies found it lowered anxiety and helped performance under stress. Those studies tested the full program, not this one piece.",
    from: "The Tyler guards the lodge door with a drawn sword (see The Tyler’s Sword). A guard is trained before the night of the attack, not during it." },
  { id: "watchtower", name: "The Watchtower", plain: "Look far away", trad: "The Golden Dawn", tier: "s", cue: "Eyes tired from the screen",
    short: "Look at the farthest thing you can see for 20 seconds. If you can, look out in all four directions.",
    how: "A window is best; otherwise the far end of a hallway. Let your eyes go soft at that distance, and blink a few times before you come back to the screen.",
    why: "Eye-care groups (the American Academy of Ophthalmology and the American Optometric Association) suggest looking about 20 feet away for 20 seconds every 20 minutes at a screen. The rule itself has barely been tested, but a short break from close focus is harmless, and it doubles as a reset for attention.",
    from: "Golden Dawn rituals open by calling on the four Watchtowers, guardians stationed at the four quarters of the world. Here the watchtower is you, looking out." },
  { id: "above", name: "The View from Above", plain: "Zoom out", trad: "Stoicism", tier: "m", cue: "Something feels bigger than it is",
    short: "Picture this room from the ceiling, then the building, the city, the whole planet. Then come back and look at what you’re doing.",
    how: "Take about a minute. Rise in steps and pause at each one. On the way back down, notice whether the thing in front of you looks a different size.",
    why: "Psychologists call this self-distancing. In experiments by Ethan Kross and colleagues, people who looked at a problem from a distance, or talked about themselves in the third person, reported less distress and reasoned about it more calmly. The effects are moderate and mostly short-term.",
    from: "Marcus Aurelius returns to the image often: <blockquote>“Look down from above on the countless herds of men and their countless solemnities.”</blockquote> (Meditations IX.30, Long). Pierre Hadot named it “the view from above.”" },
  { id: "kitchen", name: "The Kitchen Practice", plain: "Come back", trad: "Christian mysticism", tier: "s", cue: "Plain, repetitive work",
    short: "When you notice your mind has wandered, come back to the task in front of you. No scolding. Just return.",
    how: "Use it during plain work: typing, washing up, walking down a hall. Each time you catch yourself drifting, the catch is the practice. Count it as a rep, not a failure.",
    why: "Wandering is the mind’s normal state: in a large study that sampled people by phone through the day (Killingsworth and Gilbert, 2010), minds were off the task at hand almost half the time. Meditation research treats the moment of noticing and returning as the skill being trained. Scolding yourself for drifting mostly adds a second distraction.",
    from: "Brother Lawrence (about 1614–1691) was a lay brother who worked in a Paris monastery kitchen. He kept his mind on God, <blockquote>“recalling it as often as I found it wandered from Him,”</blockquote> and said that in “the noise and clatter of my kitchen” he kept the same calm as at prayer. He also advised against fretting over wandering, since <blockquote>“trouble and disquiet serve rather to distract the mind than to recollect it.”</blockquote> (<em>The Practice of the Presence of God</em>, 1895 translation)" },
  { id: "lens", name: "Today’s Lens", plain: "Today’s question", trad: "Hermeticism · The Kybalion", tier: "m", cue: "Carried through the day", tool: "lens",
    short: "", how: "Each day of the week takes one of The Kybalion’s seven principles as a lens. You don’t have to believe it; use it as a question for noticing things. The Watch shows today’s when it starts.",
    why: "One question carried through the day gives scattered attention a direction. Treat it as a reflective game: The Kybalion’s claims about the universe aren’t evidence of anything.",
    from: "<em>The Kybalion</em> (1908) sets out seven principles, from “The All is Mind” to “Gender is in everything.” It presents them as ancient Hermetic teaching; it is American New Thought, most likely written by William Walker Atkinson (see the Field Guide chapter). The seven-day planetary week is ancient and the metals come from alchemy, but pairing each day with a principle is this app’s own arrangement." },
  { id: "stage", name: "The Four Stages", plain: "Name the stage", trad: "Alchemy", tier: "s", cue: "Partway through a task",
    short: "Name the stage of the task in front of you: blackening (a mess), whitening (clearing), yellowing (taking shape), or reddening (finishing).",
    how: "Say it plainly: “This is still in the blackening.” A task can slip back a stage; that’s normal. When something is stuck in the black, the next move is usually to sort or separate something.",
    why: "Putting a state into words, even odd words, seems to take a little of its sting: in a brain-imaging study (Lieberman and colleagues, 2007), naming feelings lowered activity in the amygdala, a region involved in alarm. Calling a mess a stage also frames it as part of the process instead of proof that something is wrong.",
    from: "Alchemists described the Work in color stages: <em>nigredo</em> (blackening), <em>albedo</em> (whitening), <em>citrinitas</em> (yellowing), and <em>rubedo</em> (reddening). Jung read them as stages of inner change in <em>Psychology and Alchemy</em> (1944). See the Field Guide chapter on alchemy." },
  { id: "shadow", name: "The Shadow Note", plain: "Irritation note", trad: "Jungian psychology", tier: "m", cue: "Someone irritates you more than the moment deserves", tool: "shadow",
    short: "Write one line: what did they do that I don’t let myself do?",
    how: "Write it down and leave it. Some answers will be useless; that’s fine. Look over the list now and then for repeats.",
    why: "Treat this as a prompt for reflection, not a diagnosis. Jung’s idea of the shadow wasn’t built on experiments, and the related idea of projection has only weak support in modern research. The useful part is pausing on a strong reaction long enough to ask a question about it.",
    from: "In Jung’s psychology the shadow holds the parts of yourself you don’t recognize or accept. Jung held that they often show up first as outsized reactions to other people." },
  { id: "hardship", name: "The Small Hardship", plain: "Small discomfort", trad: "Stoicism", tier: "l", cue: "Once a day, on purpose",
    short: "Choose one small discomfort on purpose: take the stairs, stand for a call, or leave your phone in another room for half an hour.",
    how: "Pick something mild that costs nothing and harms nothing. Do it once today, on purpose, and notice whether it’s as bad as you expected. Skip anything painful, or anything your senses strongly object to; there are other options on the list.",
    why: "Doing a mildly unpleasant thing by choice is a small dose of exposure, the principle behind well-supported anxiety treatments that build tolerance through gradual practice. Research on this everyday version is thin, so judge it by whether ordinary friction starts to feel smaller.",
    from: "Seneca told Lucilius to practice poverty on purpose: <blockquote>“Set aside a certain number of days, during which you shall be content with the scantiest and cheapest fare, with coarse and rough dress, saying to yourself the while: ‘Is this the condition that I feared?’”</blockquote> (Letter 18, Gummere)" },
  { id: "weather", name: "The Weather Report", plain: "Quick check-in", trad: "Ignatian discernment", tier: "s", cue: "A few times a day", tool: "weather",
    short: "One tap: how are you right now? Clear, foggy, stirred up, or low.",
    how: "Pick the closest word. No explanation needed. After a few weeks, My Log shows how your days tend to run by time of day.",
    why: "Brief check-ins through the day give a truer picture than remembering at night. Memory of a day leans heavily on its most intense moment and its ending (Daniel Kahneman’s peak-end rule), so in-the-moment reports, which researchers call experience sampling, catch what recall smooths over.",
    from: "Ignatius of Loyola taught people to notice two movements in themselves, consolation and desolation, and to name them before acting on them (<em>Spiritual Exercises</em>, rules for discernment)." },
  { id: "examen", name: "The Particular Examen", plain: "One habit, counted", trad: "Ignatian spirituality", tier: "m", cue: "Morning, midday, and evening", tool: "aim",
    short: "Pick one habit to watch today. Each time you catch it, tap once. No grading.",
    how: "In the morning, write the habit as a short phrase, something to do less (checking the phone) or more (drinking water). Tap “Caught it” each time you notice it. Tonight, Raising the Sparks shows the count. It starts fresh each day.",
    why: "Self-monitoring, simply counting a behavior, is one of the more dependable techniques in behavior-change research; noticing tends to shift the behavior on its own. It works best on one specific habit at a time.",
    from: "In the <em>Spiritual Exercises</em> (written 1522–1524), Ignatius sets out a “particular examen” three times a day: on rising, resolve to watch one fault; after the midday meal, go back over the morning hour by hour and mark a dot for each slip; after supper, do it again. Here the dots are taps." },
  { id: "spark", name: "Gathering a Spark", plain: "One good thing", trad: "Lurianic Kabbalah", tier: "s", cue: "An hour that felt long",
    short: "Name one thing from the last hour that went right, or was good to see.",
    how: "It can be small: a clean sentence, a decent coffee, a door someone held. Say it, or write it in a word. That’s all.",
    why: "In research reviews, gratitude-style exercises have small effects on mood that vary a lot between people. Their use here is as a counterweight: attention drifts toward problems on its own, and this tips it back for a moment.",
    from: "In Lurianic Kabbalah, sparks of light lie scattered through ordinary things, waiting to be lifted (see Raising the Sparks). This is the daytime version: one spark at a time." },
  { id: "silence", name: "Pythagorean Silence", plain: "Say less", trad: "Pythagoreanism", tier: "l", cue: "A meeting or a meal",
    short: "For one stretch (a meeting, a meal, twenty minutes), say only what’s needed. Notice what you wanted to say and didn’t.",
    how: "You don’t have to be silent, just sparing. Keep a rough count of the urges, and afterward ask which ones you’re glad you held back.",
    why: "There’s no research on this as such. The value is in the noticing: once you’ve agreed not to follow every urge to speak, the urges become easy to watch.",
    from: "Later biographers of Pythagoras, such as Iamblichus (around AD 300), report that newcomers to his school kept a long silence, <em>echemythia</em>, before they could join the discussions. The story may be legend, but it puts restraint of speech first among the disciplines." },
  { id: "walk", name: "Solvitur Ambulando", plain: "Walk it out", trad: "Latin saying", tier: "l", cue: "Stuck on something that can wait five minutes",
    short: "Walk for five minutes with no phone. When you sit back down, write the first thing you think.",
    how: "Walk anywhere; a loop of the hallway counts. Don’t try to solve the problem. Let it sit at the edge of your mind, and write down the first thought when you’re back, even if it seems unrelated.",
    why: "In Stanford experiments (Oppezzo and Schwartz, 2014), people came up with more ideas on a creativity test while walking and shortly afterward, indoors or out. The effect was on producing ideas, not on finding a single right answer.",
    from: "“It is solved by walking.” The Latin saying is often credited to Diogenes or to Augustine; its real origin is uncertain." },
  { id: "breath", name: "The Watchful Breath", plain: "Breath phrase", trad: "Hesychasm", tier: "m", cue: "Walking or waiting", link: 3,
    short: "While walking or waiting, pair a short phrase with your breath: the first half on the in-breath, the second on the out-breath.",
    how: "Pick two words, such as “here / now” or “steady / on.” Let the out-breath run a little longer than the in-breath. Keep it up for a minute, or for the length of a walk.",
    why: "Slow breathing, around six breaths a minute, reliably calms the body in the short term, and the phrase gives the mind something to hold onto meanwhile. Vessel Expansion is the longer, sitting version.",
    from: "The Hesychasts (from Greek <em>hēsychia</em>, stillness) of Eastern Orthodox monasticism joined a short prayer to the breath and repeated it through the day. Their writings, gathered in the <em>Philokalia</em>, call the alertness this builds <em>nepsis</em>: watchfulness, a guard kept at the entrance of the heart." }

function logChart(log) {
  var by = {};
  log.forEach(function (r) { var x = by[r.n] = by[r.n] || { b: 0, a: 0, c: 0 }; x.b += r.b; x.a += r.a; x.c++; });
  var rows = Object.keys(by).map(function (n) { var x = by[n]; return { n: +n, b: x.b / x.c, a: x.a / x.c, c: x.c }; })
    .sort(function (p, q) { return (p.a - p.b) - (q.a - q.b); });
  function pct(v) { return ((v - 1) / 4 * 100).toFixed(1) + "%"; }
  function num(v) { return (Math.round(v * 10) / 10).toString(); }
  var box = h("div", { class: "chartbox", role: "list", "aria-label": "Average rating before and after each practice" }, [
    h("div", { class: "legend" }, [h("span", null, [h("i", { class: "k before" }), "Before"]), h("span", null, [h("i", { class: "k after" }), "After"])]),
    h("div", { class: "scaleh", "aria-hidden": "true" }, [h("span", null, ["1 calm"]), h("span", null, ["5 maxed out"])])
  ]);
  rows.forEach(function (r) {
    var same = Math.abs(r.a - r.b) < 0.05, lo = Math.min(r.a, r.b), hi = Math.max(r.a, r.b);
    var val = num(r.b) + " → " + num(r.a) + (same ? ", no change" : "");
    var track = h("div", { class: "ctrack", "aria-hidden": "true" }, [
      same ? null : h("span", { class: "cline", style: "left:" + pct(lo) + ";width:calc(" + pct(hi) + " - " + pct(lo) + ")" }),
      same ? null : h("span", { class: "cdot b", style: "left:" + pct(r.b) }),
      h("span", { class: "cdot a", style: "left:" + pct(r.a) })

/* ---------- Read: one page ---------- */
function linkChapters(html) {
  // "(Ch. 8)" and "(Ch. 11, 13)" in the glossary become links
  return html.replace(/\(Ch\. ([\d, ]+)\)/g, function (m, nums) {
    return '<span class="chref">(' + nums.split(/,\s*/).map(function (n, i) {
      var c = CH_BY_NUM[+n]; if (!c) return n;
      return '<a href="#/read/' + c.id + '">' + (i === 0 ? "Ch. " : "") + n + "</a>";
    }).join(", ") + ")</span>";
  });
}
function glossaryBody() {
  var wrap = h("div", { class: "prose" });
  var q = h("input", { class: "search", type: "search", placeholder: "Find a word", "aria-label": "Find a word", autocomplete: "off" });
  var list = h("div", { class: "gloss" });
  // a letter heading wherever the first letter changes ("The Kybalion" files under K)
  var letters = [], cur = null, lastL = "";
  var rows = BOOK.glossary.map(function (g) {
    var L = g.term.replace(/^the\s+/i, "").charAt(0).toUpperCase();
    if (L !== lastL) { lastL = L; cur = { el: h("h3", { class: "letter" }, [L]), items: [] }; letters.push(cur); list.appendChild(cur.el); }
    var p = h("p", { html: "<strong>" + g.term + ":</strong> " + linkChapters(g.def) + (g.src === "tb" && g.group ? ' <span class="from">(' + g.group + ")</span>" : "") });
    list.appendChild(p);
    var r = { el: p, text: (g.term + " " + g.def).toLowerCase().replace(/<[^>]+>/g, "") };
    cur.items.push(r);
    return r;
  });
  q.addEventListener("input", function () {
    var v = q.value.trim().toLowerCase();
    rows.forEach(function (r) { r.el.hidden = v && r.text.indexOf(v) < 0; });
    letters.forEach(function (l) { l.el.hidden = !l.items.some(function (r) { return !r.el.hidden; }); });
  });
  wrap.appendChild(h("p", { class: "empty" }, ["Every unfamiliar word from the practices and the Field Guide, in one list. Tap a chapter number to open it."]));
  wrap.appendChild(q); wrap.appendChild(list);
  return wrap;
}

/* ---------- My Log ---------- */
function backupData() {
  var data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("tb:") === 0) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return { app: "trestleboard", version: 1, saved: new Date().toISOString(), data: data };
}
function saveBackup(msg) {
  var json = JSON.stringify(backupData(), null, 1);
  var name = "trestleboard-backup-" + dayKey() + ".json";
  var file = null;
  try { file = new File([json], name, { type: "application/json" }); } catch (e) {}
  // On iPhone the share sheet has "Save to Files"; elsewhere this downloads the file
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: "Trestleboard backup" })
      .then(function () { msg.textContent = "Backup saved."; })
      .catch(function (err) { if (err && err.name !== "AbortError") download(); });
    return;
  }
  download();
  function download() {
    try {
      var url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      var a = h("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      msg.textContent = "Backup file saved as " + name + ".";
    } catch (e) { msg.textContent = "Couldn't save a file here."; }
  }
}
function restoreBackup(file, msg) {
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var b = JSON.parse(rd.result);
      if (!b || b.app !== "trestleboard" || !b.data) throw new Error("not ours");
      var keys = Object.keys(b.data);
      keys.forEach(function (k) { if (k.indexOf("tb:") === 0) localStorage.setItem(k, b.data[k]); });
      msg.textContent = "Restored " + keys.length + " saved items from " + (b.saved || "").slice(0, 10) + ".";
      setTimeout(render, 900);
    } catch (e) { msg.textContent = "That file isn't a Trestleboard backup."; }
  };
  rd.readAsText(file);
}
function clock12(t) { if (!t) return ""; var p = t.split(":"), hr = +p[0]; return ((hr % 12) || 12) + ":" + p[1] + (hr < 12 ? " am" : " pm"); }

      h("div", { class: "tablewrap" }, [h("table", { class: "log" }, [h("thead", null, [h("tr", null, [h("th", null, ["Date"]), h("th", null, ["Practice"]), h("th", null, ["Before → after"])])]), h("tbody", null, rows)])])]));

  app.appendChild(box);

  // parked thoughts from entry 14
  var parked = store.get("park", []);

    app.appendChild(h("section", { class: "group" }, [
      h("h2", null, ["Parked thoughts"]),

      h("ul", { class: "list" }, parked.map(function (it) { return h("li", null, [h("span", null, [h("small", null, ["At " + clock12(it.at)]), it.t]), h("span")]); })),
      h("a", { class: "linkrow", href: "#/p/14" }, [h("span", null, ["Open The Apophatic Cut"]), icon("chev", "chev")])
    ]));

  // check-ins from the Watch, by time of day
  var wx = store.get("weather", []);
  if (wx.length) {
    var BANDS = [["Morning", 0, 12], ["Midday", 12, 14], ["Afternoon", 14, 17], ["Evening", 17, 24]];
    var trs = BANDS.map(function (b) {
      var c = {}, n = 0;
      wx.forEach(function (r) { var hr = +r.t.split(":")[0]; if (hr >= b[1] && hr < b[2]) { c[r.v] = (c[r.v] || 0) + 1; n++; } });
      var txt = n ? WEATHER.filter(function (v) { return c[v]; }).map(function (v) { return wxName(v) + " " + c[v]; }).join(" · ") : "None yet";
      return h("tr", null, [h("td", null, [b[0]]), h("td", null, [txt])]);

      h("div", { class: "tablewrap" }, [h("table", { class: "log" }, [h("thead", null, [h("tr", null, [h("th", null, ["When"]), h("th", null, ["Check-ins"])])]), h("tbody", null, trs)])])
    ]));

  // notes from The Shadow Note

  if (sh.length) {

      h("ul", { class: "list" }, sh.slice().reverse().map(function (it) { return h("li", null, [h("span", null, [h("small", null, [it.d]), it.t]), h("span")]); }))
    ]));

  // backup
  var msg = h("p", { class: "msg", "aria-live": "polite" });
  var input = h("input", { class: "filepick", type: "file", accept: "application/json,.json", id: "restore-file", tabindex: "-1", "aria-hidden": "true" });
  input.addEventListener("change", function () { if (input.files && input.files[0]) restoreBackup(input.files[0], msg); input.value = ""; });
  var data = h("section", { class: "group" }, [h("h2", null, ["Your data"]),
    h("div", { class: "card" }, [
      h("h3", null, ["Back up"]),
      h("p", null, ["Everything you save here (ratings, notes, pinned practices, parked thoughts, check-ins, settings) lives only on this phone. A backup file keeps a copy somewhere safe, like your Files app or iCloud Drive."]),
      h("div", { class: "btnrow" }, [
        h("button", { class: "go", type: "button", onclick: function () { saveBackup(msg); } }, ["Save a backup"]),
        h("button", { class: "opt", type: "button", onclick: function () { input.click(); } }, ["Restore from a backup"])
      ]),
      input, msg
    ])
  ]);
  var extra = h("div", { class: "btnrow" });
  if (log.length) {
    var clr = h("button", { class: "opt", type: "button" }, ["Clear log"]);
    clr.addEventListener("click", function () {
      if (clr.dataset.sure) { store.set("log", []); render(); return; }
      clr.dataset.sure = "1"; clr.textContent = "Tap again to clear";
    });
    extra.appendChild(clr);

}

/* ---------- every line the app can speak (used to make the built-in voice recordings) ---------- */
var SAMPLE = "Breathe in, slowly. And let it go.";

// what "Read it aloud" says; "spoken" keeps the wording the built-in voices were recorded with
function spokenMethod(id) { var d = document.createElement("div"); d.innerHTML = BOOK.entries[id].spoken || BOOK.entries[id].method; return d.textContent; }
function allPhrases() {
  COLLECT = [];
  Object.keys(E).forEach(function (n) { try { E[n].tool(); } catch (e) {} });
  var out = COLLECT; COLLECT = null;
  out.push("Parked. Not now.", "Set done. Start the next task now.", "Begin.", "Voice guidance is on.", "This loud.", SAMPLE, "Breathe in, slowly.",
    "Two minutes. Finish your sentence, write the note.", "Time to switch. Palms on the doorframe, breathe out, step through.");
  for (var i = 1; i <= 60; i++) out.push(String(i));

}

function render() {
